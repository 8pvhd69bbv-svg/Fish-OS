const DATA={"version": "0.7", "system": "FISH OS", "project": "FLYS FOR FISH", "storage_note": "Seed/reference data. User-created browser records remain local until a real shared backend is connected.", "master_profile_text": "FISHING OS — USER CONTEXT / MASTER FISHING PROFILE\n\nUSER\n- 27-year-old male, Oregon.\n- Experienced fly fisherman, especially interested in predatory trout and steelhead.\n- Primary targets: Bull trout and large brown trout.\n- Secondary/high-priority targets: summer steelhead, tiger trout, big brook trout, trophy redbands, carp.\n- Wants factual, confident, well-cited fishing information.\n- Do not invent conditions, regulations, flows, weather, fish sizes, or historical data.\n- If data cannot be retrieved, explicitly say so.\n- User strongly prefers actual data and useful analysis over generic fishing advice.\n\nMASTER FISHING JOURNAL\nThe journal is intended to become a long-term angling database, not merely a trip diary.\n\nFor every trip, preserve:\n- Date\n- Waterbody\n- Exact/approximate location or named hole\n- Start/end time\n- Weather\n- Air temperature\n- Wind speed/direction\n- Cloud cover\n- Barometric pressure\n- Pressure trend\n- Moon phase/illumination\n- Sunrise/sunset\n- Rainfall\n- Days since measurable rain\n- River flow (cfs) where applicable\n- Flow trend\n- Water temperature where available\n- Water clarity\n- Tide for coastal fisheries\n- Fish seen\n- Fish landed\n- Fish lost\n- Approximate size\n- Species\n- Flies/lures\n- Presentation\n- Productive water\n- Wildlife/forage observations\n- Important behavioral observations\n- Lessons learned\n- Environmental/fishing correlations\n\nIMPORTANT:\nEnvironmental data should be retrieved from actual historical sources whenever possible. Do NOT fabricate or estimate historical weather, pressure, flow, rainfall, moon, or tide data and present it as observed data.\n\nPreferred environmental sources:\n- NOAA/NWS or reliable historical weather station data\n- USGS gauges for river flow and water temperature\n- NOAA tide data for coastal trips\n- Reliable astronomical data for moon phase/sunrise/sunset\n\nPreferred weather stations:\n- Nestucca: Hebo, Oregon\n- Metolius: Camp Sherman / nearest appropriate station\n- Upper Deschutes: La Pine / nearest appropriate station\n- East Lake/Diamond/Crane Prairie: nearest representative Central Oregon station\n- Imnaha: nearest appropriate station\n- Coastal fisheries: nearest representative coastal station\n\nSTEELHEAD TRACKING\nSteelhead are a major component of the journal.\n\nLower Deschutes:\n- 5-star personal goal: land a summer steelhead on the swing.\n- Track flows, recent rainfall, water temperature, timing, visibility, and fly/presentation.\n- Summer steelhead are a major priority.\n\nNestucca:\n- Track both summer and winter steelhead.\n- For every Nestucca entry, use Hebo weather.\n- Flow is considered particularly important.\n- Track recent rainfall and days since rain.\n- User specifically wants rainfall/flow incorporated into analysis.\n\nWilson:\n- Track winter and summer steelhead timing.\n- User will provide additional timing information later.\n\nTROUT PRIORITIES\n1. Bull trout — obsession / highest priority.\n2. Large brown trout — highest priority.\n3. Lower Deschutes summer steelhead — must land a summer fish on the swing.\n4. Huge tiger trout — 4-star priority.\n5. Big brook trout.\n6. Trophy redbands / Upper Klamath Basin.\n7. Carp.\n8. Winter steelhead.\n\nMAJOR OREGON FISHERIES OF INTEREST\n- Metolius River\n- Upper Deschutes / Cow Meadows\n- Crane Prairie Reservoir\n- Wickiup Reservoir\n- East Lake\n- Diamond Lake\n- Lake Billy Chinook\n- Lower Deschutes\n- Nestucca River\n- Wilson River\n- Upper Klamath Lake\n- Williamson River\n- Sprague River\n- Imnaha River\n- Wallowa River\n- Grande Ronde\n- Sauvie Island / Crane Lake\n- Oregon coastal jetty/rock fisheries\n\nMETOLIUS\n- User considers the Metolius a primary bull trout fishery.\n- River is spring-fed, extremely clear, and generally very stable.\n- User frequently fishes specific named locations including:\n  - Dolly Hole\n  - Pokenny Hole\n  - Aquarium Hole\n  - Lower Bridge / Bridge 99\n  - Long Jams\n  - Tailouts\n- User wants to investigate upper-river fishing immediately before seasonal closure, especially October, because of large lake-run bull trout moving upstream to spawn.\n- Big articulated streamers are extremely important.\n- User has repeatedly observed bull trout reacting to large white streamers.\n- User has learned that 10–12+ inch streamers can move fish that smaller 4–6 inch flies do not.\n- User has observed bull trout attacking hooked whitefish/trout.\n- User has observed bull trout attacking other hooked bull trout.\n- Important hypothesis to track: bull trout may respond strongly to streamers that dead-drift, stall, or contact the bottom rather than only actively swung/stripped flies.\n- User has observed major short feeding windows rather than continuous activity.\n- Tailouts may contain many bull trout at certain times, particularly around evening/night, then appear empty later.\n- User wants environmental conditions correlated with these behavioral observations.\n\nIMPORTANT METOLIUS JOURNAL OBSERVATIONS\nApril 8, 2024:\n- User considers this one of his best bull trout days and the day he \"cracked the code.\"\n- Caught multiple bulls.\n- Used huge ~12-inch articulated, often white flies.\n- Several big fish.\n- Saw fish chasing other fish.\n- Caught whitefish and had bull trout remain nearby and attack a streamer.\n- User believes 4–6 inch flies often fail to move the biggest fish.\n- This pattern has been difficult to reproduce and appears rare.\n\nMay 14, 2026:\n- Fished Metolius briefly.\n- Hooked whitefish in Dolly Hole.\n- Large bull immediately ate/attacked the whitefish.\n- Bull went extremely deep into euro rod backing.\n- User had to enter water to clear snags.\n- Ultimately landed the bull.\n- Around 7:30 PM.\n- No other whitefish sign noted.\n\nMay 26, 2026:\n- Fished roughly 2 PM–9 PM.\n- Water crystal clear / normal Metolius conditions.\n- Pokenny: saw at least two bulls; one repeatedly attempted to eat small rainbows user was catching.\n- Dolly Hole: no sign initially until whitefish was hooked.\n- ~4:20 PM caught a decent fish on euro setup with heavy jig Lunch Money streamer.\n- Shortly afterward caught ~16-inch fish on switch rod with indicator and golden stone.\n- Fished hard until dark.\n- Around 8:50 PM caught a massive bull in deep tailout on a swung fly.\n- Fish made multiple hard upstream runs.\n- Barely fit in Fishpond Mid-Length net; estimated >35 inches / 3x net basket length (size estimate uncertain).\n- This was NOT a sighting; it was a landed fish.\n- Important: user corrected earlier misunderstanding that this was a \"giant sighting.\"\n\nJune 15, 2025:\n- Pokenny Hole: bull around 18–20 inches at 9:44 AM.\n\nJune 16, 2025:\n- Dolly Hole: brown trout around 18 inches on a nymph.\n- Pokenny: bull around 22 inches at 6:55 AM.\n- Roadside deep bucket near campground pull-off: bull around 24 inches at 9:08 AM.\n- Saw golden stones on branches.\n\nJuly 5, 2025:\n- Around 9:27 PM caught a thick bull around 24 inches immediately below lower bridge.\n- 12+ inch yellow/white brush streamer.\n- Also caught a brown trout.\n\nSeptember 2025 Metolius:\n- September 23: very productive day, lots of fish/running.\n- Large colored-up trout estimated 25+ inches near Lake Creek.\n- Another smaller bull upper river around 1:47 PM.\n- September 24: bull around 20 inches in Long Jams below Dolly Hole around 10:48 PM.\n- Another afternoon session with Michael produced several rainbows.\n- User snapped rod.\n\nJuly 11, 2026:\n- Started ~5 PM.\n- Checked upstream spot without success, then Dolly Hole by ~5:30 PM.\n- Fished until ~1 hour after sunset (~9:51 PM).\n- Bull #1: 7:11 PM, 10-inch white streamer / red-wire \"Bully\" contraption.\n- Bull #2: 7:53 PM, basic white-on-white Dolly Llama.\n- Lost anothe e lake. Alternating currents with small wells. Extraordinary setting.\nKrimmler Ache- Located in the Salzburg region above Europe's highest waterfalls, offering incredible high-altitude scenery. one of the most beautiful fishing spots on the continent, is located above the highest waterfalls in Europe. With restricted access.\nSalza River-Famous for wild brown trout and grayling in a stunning, natural valley setting. only fishing at the beginning of the season or the end of September and October.\nStubach River: river with a great variety of species.\nTraun River- A historic and legendary European fly-fishing destination with technical, clear-water currents.\nYbbs River- Renowned for clear waters and well-managed stretches with dedicated fishing hospitality.\nLakes: Lenisee, Elizabethsee, Hollersbachsee, Hintersee..\nRegulations and Licensing\nPrivate Waters: Almost all rivers in Austria are privately owned or managed; open public access is rare.\nPermits: You need both a state/regional guest fishing card (Gästefischereikarte) and a specific day or stretch ticket (Revierbezirk).\nStay & Fish: Many top-tier fishing hotels (such as those around Mittersill or the Ybbs valley) bundle permits exclusively for their guests.\nTechnique Rules: Most waters enforce strict catch-and-release or single barbless hook policies to protect native stocks"},{"country":"Azerbaijan","regions":["possible not likely","Salmo Trutta Caspius","Religion: Predominantly Shia Muslim (97.3%"],"notes":"possible not likely\nSalmo Trutta Caspius\nAzerbaijan's borders, and its separate exclave, Nakhchivan Autonomous Republic , which is geographically cut off by Armenia, creating two distinct parts of Azerbaijan\nCapital: Baku. Official Language: Azerbaijani\n Religion: Predominantly Shia Muslim (97.3%"},{"country":"Bahamas","regions":["Bonefish"],"notes":"Bonefish"},{"country":"Bahrain","regions":[],"notes":"bust: overfished/ Hot & hot water\n\n\nThe smallest country in the Middle East, Bahrain island varkmcleod.com/destination/nubian-flats-sudan-fishing/ \nhttps://issuu.com/intheloopmagazine/docs/in_the_loop_mag_no32-2/s/15128069"},{"country":"Suriname","regions":[],"notes":"634,000 people https://www.worldsbestfishingtrips.com/surinam"},{"country":"Sweden","regions":["Grayling. Trout, Sea Trout, PIke"],"notes":"Grayling. Trout, Sea Trout, PIke\nFishing rights in Sweden's lakes and rivers are individually owned by land or property owners. To fish, you need a fishing permit, which is a personal agreement between you and the owner, allowing you to fish in a specified area for a limited time. Identification is required unless stated otherwise. No permit is needed for fishing in Vänern, Vättern, Mälaren, Hjälmaren, and Storsjön in Jämtland. Unlike hunting, no general fishing license or certification is required for sport fishing.\nhttps://www.youtube.com/watch?v=BnPMzEJzN88 \nhttps://visitsweden.com/what-to-do/nature-outdoors/fishing/fishing-sweden/?utm_campaign=Awareness_Activities_Fishing_EN&gad_source=1&gad_campaignid=13338715852&gbraid=0AAAAABVc5rkiqjDL84VzvWzq_fxfPKwos&gclid=Cj0KCQiAsNPKBhCqARIsACm01fSyqj_hC1gyDIX9wlTM-_MEBArEIL99EGTtw2d0yHvo50PuuRoBHfgaAo2SEALw_wcB"},{"country":"Switzerland","regions":[],"notes":"Bust: Illegal\nStrict laws against catch and release."},{"country":"Syria","regions":[],"notes":"Bust: Danger/ Overfished"},{"country":"Taiwan","regions":["Mahsser"],"notes":"Bust: Overpopulated/small overfished\nEnemic: Formosan Landlocked Salmon (Oncorhynchus masou formosanus) in mountain streams https://en.wikipedia.org/wiki/Oncorhynchus_masou_formosanus \ncherry salmon, Taiwanese trout ( タイワンマス, taiwan masu), Tsugitaka trout (次高鱒, tsugitaka masu), Lishan trout ( 梨山鱒 ) or Slamaw trout, Sakura Kabuki Salmon\nAdult Formosan salmon are about 30 cm (1 ft)  \nMahsser \nChina….."},{"country":"Tajikistan","regions":["Snow Trout"],"notes":"Bust\nTrout, Barbel, carp etc: elusive Amu Darya trout and Sattar snowtrout),  pike asp in high-altitude rivers and lo h almost all vehicles are American and have left-hand drive.\nThere are three primary islands in USVI: St. Thomas, St. John, and St Croix. The islands of St. Thomas and St. John are connected by ferry, whereas St. Croix is located south"},{"country":"Uzbekistan","regions":["🐟Trouts","Unlikely?"],"notes":"🐟Trouts\nUnlikely?"},{"country":"Vanuatu","regions":["South Pacific","🐟Bluewater- Mahi, Dogtooth, Marlin, Wahoo","🐟GTS- But On the fly no go?"],"notes":"South Pacific\n(French Republic) South Pacific approx 330k population. 83 islands, 63 inhabited. 810 mi archipelago \n🐟Bluewater- Mahi, Dogtooth, Marlin, Wahoo\n🐟GTS- But On the fly no go? \nhttps://www.nambasfishingcharters.com/fly-fishing"},{"country":"Vatican City (Holy See)","regions":[],"notes":"Bust: No fishin"},{"country":"Venezuela","regions":["Los Roques -350 islands"],"notes":"🐟Tarpon, bone, permit, trigger, jacks, cuda, snook\n🐟Blue water-  Tuna, Dolphin, Wahoo and Billfish amongst others. Also, there are good chances of catching a Marlins (blue and white) or swordfish, with the right equipment.\n🐟Snappers, grouper, cero mackerel, bonito, tuna, etc.\n\nLos Roques -350 islands\nhttps://flyfishinglosroques.com/ \nFarbanks: https://farbank.com/products/fly-water-travel-los-roques \nFrontiers: https://www.frontierstravel.com/fly-fishing-los-roques \nSports Quest: https://www.sportquestholidays.com/destinations/venezuela-fishing/ \nhttps://www.youtube.com/watch?v=jr2pC-XDWDw \n\n\nOther: Payara (vampire fish), Peacock bass  \nhttps://www.flyfisherman.com/editorial/venezuela-fly-fishing/152090"},{"country":"Vietnam","regions":["Snakehead","Overfished?"],"notes":"Snakehead \n🐟Mekong giant catfish, snakehead, and peacock bass in the Mekong Delta to saltwater species like tuna, barramundi, grouper, barracuda, and various sea breams \nOverfished?"},{"country":"Yemen","regions":["Socotra Island","🐟Parrotfish, Bohar , Blue trigger (ultra rare), Unicorn, Blue travelley"],"notes":"Level 4: do not travel \nSocotra Islan function calendar(){let now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),lead=first.getDay(),todayISO=localISO(now),cells=[],entries=calendarEntries();for(let i=0;i<lead;i++)cells.push('<div class="calcell"></div>');for(let d=1;d<=days;d++){let date=new Date(y,m,d),iso=localISO(date),dayTrips=(DATA.trips||[]).filter(t=>iso>=tripDate(t.date)&&iso<=tripEndDate(t.date)),dayEvents=entries.filter(e=>e.date===iso||(e.end&&iso>=e.date&&iso<=e.end)),cls=iso===todayISO?'today':iso<todayISO?'pastday':'futureday';cells.push(`<div class="calcell ${cls}"><b>${d}</b>${dayTrips.map(t=>{let st=tripStatus(t,now);return `<button class="event ${st==='Completed'?'past':st==='Active'?'today':'future'}" onclick="go('trip-${slug(t.id)}')">${esc(t.id)}</button>`}).join('')}${dayEvents.map(e=>`<button class="event future" onclick="calendarInfo('${esc(e.id)}')">${esc(e.title)}</button>`).join('')}</div>`)}while(cells.length%7)cells.push('<div class="calcell"></div>');let upcoming=(DATA.trips||[]).filter(t=>tripStatus(t,now)!=='Completed').sort((a,b)=>tripDate(a.date).localeCompare(tripDate(b.date))),custom=entries.filter(e=>e.date>=todayISO).sort((a,b)=>a.date.localeCompare(b.date));return shell('Live Calendar',`Real-time calendar • ${now.toLocaleDateString(undefined,{month:'long',year:'numeric'})}`,`<div class="notice"><b>Now:</b> <span id="calendarNow">${now.toLocaleString()}</span> • <b>Clock:</b> live • Trip status uses the current date.</div><div class="caltools"><button class="btn gold" onclick="addCalendarEntry()">+ Calendar Entry</button><button class="btn" onclick="go('calendar-help')">Google Calendar</button></div><div class="calendar" style="margin-top:12px">${['SUN','MON','TUE','WED','THU','FRI','SAT'].map(x=>`<div class="calhead">${x}</div>`).join('')}${cells.join('')}</div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Upcoming / Active Trips</h3>${upcoming.length?list(upcoming.map(t=>({title:t.id,meta:`${t.date} • ${tripStatus(t,now)} • ${t.place||t.region||''}`})),i=>`go('trip-${slug(upcoming[i].id)}')`):'<div class="empty">No future trips currently stored.</div>'}</div><div class="card"><h3>Calendar Entries</h3>${custom.length?custom.map(e=>`<div class="row"><div><div class="title">${esc(e.title)}</div><div class="meta">${esc(e.date)}${e.location?' • '+esc(e.location):''}</div></div><button class="gcal" onclick='window.open(googleCalendarUrl(${JSON.stringify(e)}),"_blank")'>GOOGLE CAL</button></div>`).join(''):'<div class="empty">No custom calendar entries yet.</div>'}</div></div>`)}
function calendarHelp(){return shell('Google Calendar','Easy one-way event creation now; two-way sync can come later.',`<div class="card"><h3>Google Calendar</h3><p>Fish OS can create a pre-filled Google Calendar event without accessing your Google account. Click <b>GOOGLE CAL</b> beside an entry and save it.</p><p class="muted">Automatic two-way synchronization requires Google OAuth and the Google Calendar API. That is the next-level integration after Supabase accounts.</p><button class="btn" onclick="go('calendar')">Back to Calendar</button></div>`)}

function maps(){return shell('Maps','Interactive map layer with Fish OS pins plus direct scouting links.',`${liveMap('maps')}<div class="maplinks"><a href="https://www.google.com/maps" target="_blank" rel="noopener">GOOGLE MAPS</a><a href="https://earth.google.com/web/" target="_blank" rel="noopener">GOOGLE EARTH</a><a href="https://www.onxmaps.com/" target="_blank" rel="noopener">ONX</a><a href="https://waterdata.usgs.gov/" target="_blank" rel="noopener">USGS</a><a href="https://www.weather.gov/" target="_blank" rel="noopener">NOAA / NWS</a></div><div class="notice" style="margin-top:10px"><b>Overlay direction:</b> Fish OS pins are now the persistent index. The next storage layer can save per-pin coordinates, notes, photos and external OnX / Google Earth references to the user's account.</div>`)}

function flies(){return shell('Fly Tying','Patterns, materials, fly photos and tying knowledge — all linked to fish and trips.',`<div class="grid g4">${doors([{k:'PATTERNS',t:'Patterns',d:`${DATA.flies.length} named patterns in current load.`,page:'fly-patterns'},{k:'MATERIALS',t:'Materials',d:'Inventory and purchase connections.',page:'inventory'},{k:'PHOTOS',t:'Fly photos / Best Of',d:'Visual pattern library.',page:'photos'},{k:'KNOWLEDGE',t:'Tying knowledge',d:'Techniques, designers and notes.',page:'research'}])}</div><div class="card" style="margin-top:14px"><h3>Pattern index</h3>${list(DATA.flies.map(x=>({title:x,meta:'Fly pattern'})),i=>`go('fly-${slug(DATA.flies[i])}')`)}</div>`)}
function flyType(x){let n=(typeof x==='string'?x:x?.name||'').toLowerCase();if(/clouser|streamer|dolly|sparkle|minnow|muddler|sculpin|zonker|leech|baby got bead|tiny dancer/.test(n))return'Streamer';if(/dry|caddis|hopper|adams|parachute|ant|beetle|stimulator/.test(n))return'Dry Fly';if(/nymph|perdigon|pheasant|hare|prince|stonefly/.test(n))return'Nymph';if(/egg|worm|san juan/.test(n))return'Egg / Worm';if(/popovic|crease|airhead|squid|deceiver|clouser|tarpon|rooster|permit|bonefish|tuna|dorado/.test(n))return'Saltwater';return x?.type||'Other'}
function flyPatterns(){let types=['All','Streamer','Dry Fly','Nymph','Emerger','Saltwater','Warmwater','Egg / Worm','Other'];let active=window.flyFilter||'All';let arr=(DATA.flies||[]).map((x,i)=>({x,i,name:typeof x==='string'?x:x.name||`Pattern ${i+1}`,type:flyType(x)})).filter(a=>active==='All'||a.type===active);return shell('Fly Pattern Index','Every pattern is indexed by type, with room for species, materials, tying notes, trips and catch history.',`<div class="toolbar"><button class="btn gold" onclick="flyForm()">+ ADD PATTERN</button></div><div class="flytabs">${types.map(t=>`<button class="flytab ${active===t?'active':''}" onclick="window.flyFilter='${t}';go('fly-patterns')">${t}</button>`).join('')}</div><div class="flygrid">${arr.map(a=>`<div class="flycard" onclick="go('fly-${slug(a.name)}')"><b>${esc(a.name)}</b><div><span class="tag">${esc(a.type)}</span></div><div class="muted small">${typeof a.x==='object'?esc(a.x.species||a.x.materials||'Indexed pattern'):'Pattern / tying record'}</div></div>`).join('')}</div>`)}
function flyDetail(n){let p=n.replace(/^fly-/,'').replace(/-/g,' ');p=p.replace(/\b\w/g,c=>c.toUpperCase());return shell(p,'Pattern workspace.',`<div class="grid g3">${doors([{k:'TYING',t:'Tying recipe',d:'Materials, hook, thread and steps.',page:'research'},{k:'FISH',t:'Fish caught',d:'Species records using this pattern.',page:'journal-fish'},{k:'INVENTORY',t:'Inventory',d:'Count and material dependencies.',page:'inventory'}])}</div><div class="card" style="margin-top:14px"><h3>Raw pattern note</h3><p class="muted">The master archive currently preserves this pattern name. Recipe fields can be filled through Quick Add without changing the raw record.</p></div>`)}
function rodIcon(type){let t=String(type).toLowerCase();if(t.includes('reel'))return I('gear');if(t.includes('line'))return I('map');if(t.includes('fly'))return I('fly');return I('gear')}
function gear(){let total=(DATA.rods||[]).reduce((n,r)=>n+(parseFloat(String(r[9]).replace(/[$,]/g,''))||0),0);return shell('Gear','Interactive rod vault plus the rest of the fishing system.',`<div class="split"><div class="rodscene"><div class="rod"></div><div class="rodpoint rp1" onclick="go('rod-list')">ROD VAULT</div><div class="rodpoint rp2" onclick="go('rod-list')">LINE</div><div class="rodpoint rp3" onclick="go('rod-list')">REEL</div><div class="rodpoint rp4" onclick="go('fly-patterns')">FLY BOX</div><div class="rodpoint rp5" onclick="go('packing')">FIELD KIT</div></div><div class="card"><h3>Collection value</h3><div class="stat"><b>$${total.toLocaleString()}</b><span>Listed rod value</span></div><div class="rodchart">${[...DATA.rods].sort((a,b)=>(parseFloat(String(b[8]).replace(/[$,]/g,''))||0)-(parseFloat(String(a[8]).replace(/[$,]/g,''))||0)).slice(0,6).map(r=>{let v=parseFloat(String(r[9]).replace(/[$,]/g,''))||0;return `<div class="rodbar"><span>${esc(r[0])}</span><i style="width:${Math.max(3,Math.round(v/1500*100))}%"></i><b>$${v.toLocaleString()}</b></div>`}).join('')}</div><p class="muted small">18 rod records loaded. Price chart uses the listed values from the inventory; no market valuation is being invented.</p><button class="btn gold" onclick="go('rod-list')">OPEN ROD INVENTORY</button></div></div><div class="card" style="margin-top:14px"><h3>Rod inventory</h3>${list(DATA.rods.map(r=>({title:`${r[0]} — ${r[2]} ${r[3]}`,meta:`${r[1]} wt • ${r[7]} • ${r[8]}`})),i=>`go('rod-${i}')`)}</div>`)}

function rodList(){return shell('Rod Inventory','Click any setup to inspect the rod, reel, line, purpose and species as a connected system.',`<div class="tablewrap"><table class="table"><thead><tr><th></th><th>Nickname</th><th>WT</th><th>Brand</th><th>Model</th><th>Reel</th><th>Line</th><th>Purpose</th><th>Species</th><th>Price</th></tr></thead><tbody>${DATA.rods.map((r,i)=>`<tr onclick="go('rod-${i}')" style="cursor:pointer"><td><span class="gearicon">${rodIcon(r[6]||'rod')}</span></td>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="notice" style="margin-top:12px">Buy: ${DATA.buy_rods.map(esc).join(' • ')}</div>`)}

function rodDetail(i){let r=DATA.rods[Number(i)]||DATA.rods[0];let parts=[['ROD',`${r[1]} wt • ${r[2]} ${r[3]}`,'gear'],['REEL',r[4],'gear'],['LINE',r[5],'map'],['PURPOSE',r[7],'fly'],['SPECIES',r[8],'fish']];return shell(r[0],'Gear setup workspace — click a component to focus on that part of the system.',`<div class="card"><div class="setup">${parts.map((p,j)=>`<div class="setupPart" onclick="alert('${p[0]}\\n${String(p[1]).replace(/'/g,"\\'")}')"><div class="partIcon">${I(p[2])}</div><b>${p[0]}</b><div class="small muted">${esc(p[1])}</div></div>`).join('')}</div></div><div class="grid g3" style="margin-top:12px">${[['Weight',r[1]],['Brand',r[2]],['Model',r[3]],['Current reel',r[4]],['Line',r[5]],['Purpose',r[7]],['Species',r[8]],['Listed price',r[9]]].map(a=>`<div class="card"><div class="muted small">${a[0]}</div><h3>${esc(a[1])}</h3></div>`).join('')}</div>`)}

function purchases(){return shell('Purchases + Warranties','Buy queue and gear purchase records.',`<div class="card"><h3>Current buy list</h3>${list(DATA.buy.map(x=>({title:x})),i=>`go('purchase-${i}')`)}</div><div class="card" style="margin-top:14px"><h3>Reel watchlist</h3><p>5 wt Guru S olive • 7 wt Guru S Blue • 8 wt Ross Evolution R Salt Blue $695 • 9 wt replacement • 8 wt Spey • 11/12 wt backing.</p><p class="muted">Brands noted: Hatch, Shilton, Nautilus, Ross, Hardy, Abel, Tibor, Bauer.</p></div>`)}
function research(){return shell('Research','Raw notes, podcasts, links, experiments and AI-ready research.',`<div class="grid researchgrid">${doors([{k:'PODCASTS',t:'Podcast notes',d:'Fly fishing destinations, Fish Tips and technique notes.',page:'podcasts'},{k:'TECHNIQUE',t:'Experiments / To Do',d:'Prototype streamers, Carolina rig, donkey rig, practice knots.',page:'todo'},{k:'DOCUMENTS',t:'Master research',d:'Country atlas, species notes and destination research.',page:'destinations'},{k:'WHY I FISH',t:'Why I fish',d:'Personal fishing philosophy and long-form writing.',page:'why-i-fish'},{k:'AI',t:'AI Archive',d:'Structured prompts and research capture.',page:'account'},{k:'RESOURCES',t:'External resources',d:'Shops, bookers, operators, podcasts and maps.',page:'resources'}])}</div>`)}
function resources(){let shops=['Wild on the Fly','The Fly Shop — California','Emerald Water Anglers — Seattle','Frontier Angler','Montana Angler','Trident Fly Fishing'];let bookers=['Yellowdog','Fly Water Travel','Orvis','Fly Odyssey','Eleven Experiences','Nervous Waters','Aardvark Mcleod','Big Y Fly','Isolation Outfitters','Tight Loop Adventure','Shallow Water Expeditions','Tarpon Flats','Moccasin Fly Club','Sports Quest','World’s Best Fishing Trips','Slipstream Angling','African Waters','Fly Cast Away'];return shell('Resources','Fly shops, booking operators, guides, podcasts and field resources.',`<div class="grid g2"><div class="card"><h3>Fly shops / operators</h3>${list(shops.map(x=>({title:x})),i=>`go('resource-${i}')`)}</div><div class="card"><h3>Major bookers</h3>${list(bookers.map(x=>({title:x})),i=>`go('resource-booker-${i}')`)}</div></div><div class="card" style="margin-top:14px"><h3>Specific contacts</h3><p>Braden — Moraine float guide — MillerTimeFlies — (804)-774-1548</p><p>Frank Day — Nestucca steelhead</p><p>Dan Smith — How to Catch Any Fish</p><p>Chad See — Fly Rod Chronicles filmmaker / producer</p></div><div class="card" style="margin-top:14px"><h3>Imported Links</h3><div class="linksgrid">${(DATA.links||[]).map(x=>`<div class="linkitem"><a href="${x.url}" target="_blank" rel="noopener">${esc(x.title)}</a><div class="muted small">${esc(x.tags||'')}</div></div>`).join('')}</div></div>`)}
function destinations(){let q=(window.destFilter||'').toLowerCase();let arr=DEST_ATLAS.filter(a=>!q||a.country.toLowerCase().includes(q)||a.regions.join(' ').toLowerCase().includes(q)||a.notes.toLowerCase().includes(q));return shell('Destinations','Complete destination atlas from the country research file, with countries and the regions / waters noted inside them.',`<div class="toolbar"><input id="destFilter" class="filterInput" value="${esc(window.destFilter||'')}" placeholder="Filter countries or regions…" oninput="window.destFilter=this.value;destinationsRender()"><button class="btn gold" onclick="quick('destination')">+ Destination</button></div><div id="destAtlas">${destCards(arr)}</div>`)}
function destCards(arr){return `<div class="atlas-count">${arr.length} country / territory records indexed • source terminology preserved</div><div class="atlas">${arr.map((a,i)=>`<details class="country"><summary><span><b>${esc(a.country)}</b>${(()=>{let n=(DATA.destination_notes||[]).find(x=>x.country.toLowerCase()===a.country.toLowerCase());let rating=n?.rating||(/\bbust\b/i.test(a.notes)?'Bust':/\bgreat\b/i.test(a.notes)?'Great':/\bgood\b/i.test(a.notes)?'Good':'');return rating?`<br><span class="ratingline rating-${rating.toLowerCase()}">${rating.toUpperCase()}</span>`:''})()}</span><small>${a.regions.length} region${a.regions.length===1?'':'s'} noted</small></summary><div class="countrybody">${a.regions.length?`<div class="regiontags">${a.regions.map(r=>`<button class="tag" onclick="atlasSearch('${esc(r).replace(/'/g,"\\'")}')">${esc(r)}</button>`).join('')}</div>`:''}<pre>${esc(a.notes||'No additional notes stored.')}</pre><div class="toolbar"><button class="btn" onclick="go('destination-${slug(a.country)}')">Open workspace</button></div></div></details>`).join('')}</div>`}
function destinationsRender(){document.getElementById('destAtlas').innerHTML=destCards(DEST_ATLAS.filter(a=>{let q=(window.destFilter||'').toLowerCase();return !q||a.country.toLowerCase().includes(q)||a.regions.join(' ').toLowerCase().includes(q)||a.notes.toLowerCase().includes(q)}))}
function atlasSearch(q){window.destFilter=q;go('destinations')}

function destinationDetail(n){let key=n.replace(/^destination-/,'').replace(/-/g,' ').toLowerCase();let a=DEST_ATLAS.find(x=>slug(x.country)===n.replace(/^destination-/,'').toLowerCase())||DEST_ATLAS.find(x=>x.country.toLowerCase()===key);let title=a?.country||n.replace(/^destination-/,'').replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());return shell(title,'Destination workspace.',`<div class="grid g3">${doors([{k:'SPECIES',t:'Target species',d:'Species connected to this destination.',page:'fish-list'},{k:'OPERATORS',t:'Operators / bookers',d:'Open known booking and guide references.',page:'resources'},{k:'RESEARCH',t:'Research notes',d:'Open all captured notes and links.',page:'research'}])}</div><div class="card" style="margin-top:14px"><h3>Regions / waters listed</h3>${a?.regions?.length?`<div class="regiontags">${a.regions.map(r=>`<span class="tag">${esc(r)}</span>`).join('')}</div>`:'<p class="muted">No region line was extracted from the source block.</p>'}</div><div class="card" style="margin-top:14px"><h3>Source notes</h3><pre style="white-space:pre-wrap;font:12px/1.45 Tahoma">${esc(a?.notes||'Country / destination notes are retained in the master atlas.')}</pre></div>`)}
function customIcons(){
  const iconsNow=state.customIcons||{};
  const keys=[['home','Dashboard'],['trip','Trips'],['fish','Fish / Journal'],['map','Maps / Locations'],['fly','Flies / Knots'],['gear','Gear / Account'],['box','Inventory / Packing'],['book','Research / Resources'],['globe','Destinations']];
  return shell('Custom Icons','Local icon pack editor — PNG, JPG, GIF, WEBP or SVG.',`<div class="card"><div class="titlebar">ICON PACK // USER OVERRIDES</div><div class="filechrome">These icons are stored in this browser. For permanent GitHub icons, upload the image files to an <b>/icons/</b> folder in the repository and reference them from the site.</div><div class="dropzone" style="margin:10px 0"><input id="iconFiles" type="file" accept="image/*,.svg" multiple onchange="importIcons(this.files)"><div style="margin-top:6px">SELECT CUSTOM ICON FILES</div></div><div class="iconpicker">${keys.map(([k,n])=>`<div class="iconcard"><div class="iconpreview">${iconsNow[k]?`<img src="${iconsNow[k]}" alt="${esc(n)}">`:`<span class="ico" style="width:42px;height:42px">${I(k)}</span>`}</div><div class="iconname">${esc(n)}</div>${iconsNow[k]?`<button class="btn" style="margin-top:6px;padding:4px 7px" onclick="clearIcon('${k}')">CLEAR</button>`:'<div class="muted" style="font-size:10px;margin-top:6px">Use filename to assign</div>'}</div>`).join('')}</div><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="exportIcons()">EXPORT ICON PACK</button><button class="btn" onclick="go('upload-guide')">UPLOAD GUIDE</button><button class="btn" onclick="clearAllIcons()">RESET ICONS</button></div></div><div class="card" style="margin-top:12px"><h3>How assignment works</h3><p class="small muted">Name files with a Fish OS key — for example <b>home.svg</b>, <b>trip.png</b>, <b>fish.svg</b>, <b>map.png</b>, <b>fly.svg</b>, <b>gear.svg</b>, <b>box.svg</b>, <b>book.svg</b>, or <b>globe.svg</b>. Fish OS will assign matching names automatically.</p></div>`)
}
function importIcons(files){
  const wanted=new Set(['home','trip','fish','map','fly','gear','box','book','globe']);let pending=[...files];if(!pending.length)return;
  let out={...(state.customIcons||{})};let i=0;
  const next=()=>{if(i>=pending.length){state.customIcons=out;localStorage.setItem('fishos_custom_icons',JSON.stringify(out));render();return;}let f=pending[i++];let base=f.name.replace(/\.[^.]+$/,'').toLowerCase().replace(/[^a-z0-9_-]/g,'');let key=base;if(!wanted.has(key)){let hit=[...wanted].find(k=>base.includes(k));if(hit)key=hit;}if(!wanted.has(key)){next();return;}if(f.size>350000){alert(f.name+' is over 350 KB and was skipped.');next();return;}let r=new FileReader();r.onload=()=>{out[key]=r.result;next()};r.readAsDataURL(f)};next()
}
function clearIcon(k){delete state.customIcons[k];localStorage.setItem('fishos_custom_icons',JSON.stringify(state.customIcons));render()}
function clearAllIcons(){if(confirm('Reset all custom Fish OS icons?')){state.customIcons={};localStorage.removeItem('fishos_custom_icons');render()}}
function exportIcons(){let blob=new Blob([JSON.stringify(state.customIcons||{},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fish_os_custom_icons.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}

function uploadGuide(){return shell('Upload Guide','How to add photos and custom icons to Fish OS without breaking the site.',`<div class="grid g2"><div class="card"><div class="titlebar">PHOTOS // GITHUB UPLOAD</div><h3>For photos you want displayed by the website</h3><ol><li>Open your <b>Fish-OS</b> GitHub repository.</li><li>Open or create a folder such as <b>photos/</b>.</li><li>Choose <b>Add file → Upload files</b>.</li><li>Drop the JPG/PNG/WebP files into the upload box.</li><li>Commit the changes to <b>main</b>.</li><li>Reference them from Fish OS using the repository path, for example <b>photos/wickiup-brown.jpg</b>.</li></ol><div class="notice"><b>Do not use GitHub as the long-term home for your photo archive.</b> Keep the repository for website assets and small images. The future Fish OS photo library should use cloud storage (for example Supabase Storage) and keep only the photo records/links in the database.</div></div><div class="card"><div class="titlebar">ICONS // GITHUB UPLOAD</div><h3>For permanent custom navigation icons</h3><ol><li>Create an <b>icons/</b> folder in the repository.</li><li>Upload SVG, PNG or WebP icons.</li><li>Use the Fish OS names: <b>home</b>, <b>trip</b>, <b>fish</b>, <b>map</b>, <b>fly</b>, <b>gear</b>, <b>box</b>, <b>book</b>, <b>globe</b>.</li><li>Example: <b>icons/fish.svg</b>.</li><li>Commit to <b>main</b>.</li></ol><p class="muted small">For quick experiments, the <b>Custom Icons</b> page can load icons directly from your computer. Those browser-local icons do not automatically become part of GitHub.</p></div></div><div class="card" style="margin-top:12px"><div class="titlebar">RECOMMENDED FILE STRUCTURE</div><pre class="mono" style="white-space:pre-wrap">Fish-OS/
├── index.html
├── .nojekyll
├── icons/
│   ├── home.svg
│   ├── trip.svg
│   ├── fish.svg
│   ├── map.svg
│   └── ...
└── photos/
    └── small website/reference images only</pre><p class="muted small">For your real fishing photo collection, Fish OS should eventually store the files in cloud storage and keep metadata such as trip, location, fish, date and tags in the Fish OS database.</p></div>`)}
function knots(){let groups={"Fly / tippet":['Clinch','Improved Clinch','Trilene','Davey','San Diego Jam','Palomar'],"Leader / tippet connections":['Uni / Grinner / Duncan','Improved Uni','Double Uni','Surgeons','Blood / Barrel','Improved Blood','Albright','Alberto Knot','Carrot Knot'],"Loops":['Non-slip Mono Loop','Perfection Loop','Micro Perfection Loop','Homer Rhodes Loop','Figure 8'],"Backing / reel / line":['Arbor Knot','Nail Knot','Bimini Twist'],"Saltwater / heavy connection":['FG Knot','Bimini Twist','Haywire Twist','Albright','San Diego Jam'],"Special / field":['Snell','Seaguar']};return shell('Knots','Knot library broken into practical connection categories.',`<div class="grid g2">${Object.entries(groups).map(([g,items])=>`<div class="card"><h3>${esc(g)}</h3>${list(items.map(x=>({title:x,meta:'Open knot record'})),i=>`go('knot-${slug(items[i])}')`)}</div>`).join('')}</div>`)}
function knotDetail(n){let p=n.replace(/^knot-/,'').replace(/-/g,' ');p=p.replace(/\b\w/g,c=>c.toUpperCase());return shell(p,'Knot technique record.',`<div class="card"><h3>Notes</h3><p class="muted">The master notes include breaking-strength observations, use cases and connection categories. Preserve the raw values while the knot library is normalized.</p></div>`)}
function defaultPacking(){return {"CLOTHING":[['Hat',1],['Sunglasses',1],['Tshirt',4],['Fishing shirt',4],['Nice shirt',4],['Boxers',8],['Fishing pants',4],['Shorts',2],['Regular pants',2],['Socks',8],['Shoes',1],['Sandals',1]],"FIELD":[['Fly rod',1],['Reel',1],['Leaders',3],['Tippet',3],['Nippers',1],['Forceps / pliers',1],['Floatant',1],['Net',1]],"TRAVEL":[['License / permits',1],['Phone',1],['Charger',1],['Passport / ID',1],['Headlamp',1]]}}
function packState(){if(!state.packing){let d=defaultPacking();state.packing=Object.fromEntries(Object.entries(d).map(([g,items])=>[g,items.map(x=>({name:x[0],qty:x[1],done:false}))]));localStorage.setItem('fishos_packing',JSON.stringify(state.packing))}return state.packing}
function packing(){let p=packState();let total=Object.values(p).flat().length,done=Object.values(p).flat().filter(x=>x.done).length;return shell('Packing','Customizable field checklist — compact RPG / trade-selection style.',`<div class="packhud"><b>PACK LOADOUT</b><span>${done}/${total} checked</span><span>WEIGHT: --</span><button class="btn gold" onclick="addPack()">+ ADD ITEM</button><button class="btn" onclick="resetPack()">RESET</button></div><div class="packscreen">${Object.entries(p).map(([g,items])=>`<section class="packcat"><h3>${esc(g)}</h3>${items.map((x,i)=>`<div class="packitem ${x.done?'done':''}"><button class="packcheck" onclick="togglePack('${esc(g)}',${i})">${x.done?'X':' '}</button><span>${esc(x.name)}</span><input class="qty" type="number" min="0" value="${x.qty}" onchange="qtyPack('${esc(g)}',${i},this.value)"><button class="packdel" onclick="delPack('${esc(g)}',${i})">DEL</button></div>`).join('')}</section>`).join('')}</div>`)}
function persistPack(){localStorage.setItem('fishos_packing',JSON.stringify(state.packing));render()}
function togglePack(g,i){state.packing[g][i].done=!state.packing[g][i].done;persistPack()}
function qtyPack(g,i,v){state.packing[g][i].qty=Math.max(0,Number(v)||0);persistPack()}
function delPack(g,i){state.packing[g].splice(i,1);persistPack()}
function addPack(){let n=prompt('Item name');if(!n)return;let g=prompt('Category','FIELD')||'FIELD';if(!state.packing[g])state.packing[g]=[];state.packing[g].push({name:n,qty:1,done:false});persistPack()}
function resetPack(){if(confirm('Reset packing checklist to the Fish OS seed list?')){state.packing=null;localStorage.removeItem('fishos_packing');render()}}
function casting(){return shell('Casting','Casting notes, practice and technique references.',`<div class="grid g3">${doors([{k:'PRACTICE',t:'Casting drills',d:'Keep practice notes here.',page:'resources'},{k:'SPEY',t:'Two-hand casting',d:'Switch and spey notes.',page:'gear'},{k:'SALT',t:'Saltwater casting',d:'Heavy rod and tropical line notes.',page:'gear'}])}</div>`)}
function why(){return shell('Why I Fish','Long-form personal fishing philosophy.',`<div class="card"><p>${esc(DATA.master_note)}</p></div>`)}
function account(){let logged=!!state.profile.loggedIn;return shell(logged?'Account / Signed In':'Log In','Supabase-ready account layer. Magic-link auth is the default; the browser session persists through supabase-js when configured.',`<div class="loginbox"><div class="card"><div class="eyebrow">FISH OS ACCOUNT</div><h2>${logged?'SIGNED IN':'LOG IN'}</h2><p class="muted">${logged?esc(state.profile.email||'Signed-in user'):'Connect your Supabase project below, then use your email to receive a magic sign-in link.'}</p><div class="form"><input id="sburl" value="${esc(state.supabase.url||'')}" placeholder="Supabase Project URL"><input id="sbkey" value="${esc(state.supabase.key||'')}" placeholder="Supabase Publishable Key"><button class="btn" onclick="saveSupabase()">SAVE SUPABASE CONNECTION</button><input id="pemail" value="${esc(state.profile.email||'')}" placeholder="Email"><button class="btn gold" onclick="magicLogin()">EMAIL ME A MAGIC LINK</button>${logged?'<button class="btn" onclick="logoutSupabase()">LOG OUT</button>':''}</div><div class="notice" style="margin-top:12px">Use the Supabase Project URL and Publishable Key from the project Connect/API settings. Do not paste a service-role/secret key here.</div></div></div>`)}
async function supaClient(){if(!state.supabase.url||!state.supabase.key)return null;if(!window.supabaseClient){if(!window.supabase)return null;window.supabaseClient=window.supabase.createClient(state.supabase.url,state.supabase.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});window.supabaseClient.auth.onAuthStateChange((event,session)=>{if(session?.user){state.profile.loggedIn=true;state.profile.email=session.user.email||'';state.profile.userId=session.user.id;localStorage.setItem('fishos_profile',JSON.stringify(state.profile));state.page='account';setTimeout(render,0)}})}return window.supabaseClient}
function saveSupabase(){state.supabase={url:document.getElementById('sburl').value.trim(),key:document.getElementById('sbkey').value.trim()};localStorage.setItem('fishos_supabase',JSON.stringify(state.supabase));alert('Supabase connection saved.');render()}
async function magicLogin(){let c=await supaClient();let email=document.getElementById('pemail').value.trim();if(!c){alert('Save the Supabase Project URL and Publishable Key first.');return}if(!email){alert('Enter your email.');return}let {error}=await c.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});if(error)alert(error.message);else alert('Magic link sent. Check your email.');}
async function logoutSupabase(){let c=await supaClient();if(c)await c.auth.signOut();state.profile.loggedIn=false;state.profile.email='';localStorage.setItem('fishos_profile',JSON.stringify(state.profile));render()}

function back(){let target=history.state&&history.state.page;if(target){state.page=target;render();window.scrollTo(0,0);return}if(state.stack.length){state.page=state.stack.pop();render();return}state.page='home';render()}

function render(){side();mobile();window.fieldContext=state.page.startsWith('trip-')?window.fieldContext||{}:{};let p=state.page,body='';if(p==='home')body=home();else if(p==='trips')body=trips();else if(p==='trip-katmai')body=tripDetail('katmai');else if(p.startsWith('trip-'))body=tripDetail(p);else if(p==='journal')body=journal();else if(p==='fish-list')body=fishList();else if(p.startsWith('species-'))body=speciesDetail(p);else if(p.startsWith('journal-entry'))body=shell('Journal Entry','Field note workspace.',`<div class="card"><h3>Field note</h3><p>Open and expand the original journal record here. This is where photos, fish measurements, conditions, flies and exact location become linked records.</p></div>`);else if(p==='locations')body=locations();else if(p.startsWith('location-'))body=locationDetail(p);else if(p==='calendar')body=calendar();else if(p==='calendar-help')body=calendarHelp();else if(p==='maps')body=maps();else if(p==='fly-tying')body=flies();else if(p==='fly-patterns')body=flyPatterns();else if(p.startsWith('fly-'))body=flyDetail(p);else if(p==='gear')body=gear();else if(p==='rod-list')body=rodList();else if(p.startsWith('rod-'))body=rodDetail(p.slice(4));else if(p==='inventory')body=inventory();else if(p==='buy-list')body=buyList();else if(p==='purchases'||p.startsWith('purchase-'))body=purchases();else if(p==='research'||p==='podcasts'||p==='todo')body=research();else if(p==='why-i-fish')body=why();else if(p.startsWith('resource-'))body=resourceDetail(p);else if(p==='resources')body=resources();else if(p==='destinations'||p==='destinations-top'||p==='destinations-bust')body=destinations();else if(p.startsWith('destination-'))body=destinationDetail(p);else if(p==='knots')body=knots();else if(p.startsWith('knot-'))body=knotDetail(p);else if(p==='casting')body=casting();else if(p==='packing')body=packing();else if(p==='account')body=account();else if(p==='custom-icons'||p==='icons')body=customIcons();else if(p==='upload-guide')body=uploadGuide();else body=home();document.getElementById('main').innerHTML=body;if(p==='maps'||p==='home')setTimeout(initFishMap,30)}
function search(q){q=q.trim().toLowerCase();let box=document.getElementById('searchResults');if(!q){box.classList.remove('show');return}let arr=[];const add=(type,title,page,hay)=>{if(title&&String(hay??title).toLowerCase().includes(q))arr.push([type,String(title),page])};const routeFor=k=>({trips:'trips',journal:'journal',locations:'locations',rivers:'locations',flies:'fly-patterns',destinations:'destinations',rods:'gear',buy_rods:'gear',knots:'knots',packing:'packing',buy:'purchases',master_note:'why-i-fish'}[k]||'research');const label=k=>({trips:'Trip',journal:'Journal',locations:'Water',rivers:'Water',flies:'Fly',destinations:'Destination',rods:'Rod',knots:'Knot',packing:'Packing',buy:'Purchase',species:'Species',fish:'Species'}[k]||'Fish OS');const walk=(v,key='DATA')=>{if(v==null)return;if(typeof v==='string'){if(v.toLowerCase().includes(q))add(label(key),v,routeFor(key),v);return}if(Array.isArray(v)){v.forEach((x,i)=>{if(typeof x==='string')add(label(key),x,routeFor(key),x);else if(x&&typeof x==='object'){let title=x.id||x.name||x.title||x.place||x.location||`Record ${i+1}`,page=key==='trips'?`trip-${slug(x.id||title)}`:routeFor(key);add(label(key),title,page,JSON.stringify(x));walk(x,key)}});return}if(typeof v==='object')Object.entries(v).forEach(([k,x])=>walk(x,k))};walk(DATA);let seen=new Set();arr=arr.filter(x=>{let k=x[0]+'|'+x[1]+'|'+x[2];if(seen.has(k))return false;seen.add(k);return true});box.innerHTML=arr.slice(0,40).map(x=>`<div class="result" onclick="go('${x[2]}');document.getElementById('searchResults').classList.remove('show')"><span class="tag">${esc(x[0])}</span> ${esc(x[1])}</div>`).join('')||'<div class="result muted">No indexed result.</div>';box.classList.add('show')}
function localISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function updateClock(){let el=document.getElementById('liveClock');if(el){let n=new Date();el.textContent=n.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',second:'2-digit'})+' '+n.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}}

document.getElementById('search').addEventListener('input',e=>search(e.target.value));document.getElementById('searchBtn').onclick=()=>search(document.getElementById('search').value);document.getElementById('accountBtn').onclick=()=>go('account');document.getElementById('menuBtn').onclick=()=>{const side=document.getElementById('side'),shellEl=document.getElementById('shell'),btn=document.getElementById('menuBtn');if(window.innerWidth<=760){side.style.display=side.style.display==='block'?'':'block';}else{side.classList.toggle('collapsed');shellEl.classList.toggle('sidecollapsed');btn.classList.toggle('menu-open');}};window.addEventListener('popstate',()=>{state.page=currentHash();render();window.scrollTo(0,0)});window.addEventListener('hashchange',()=>{state.page=currentHash();render();window.scrollTo(0,0)});if(!location.hash)history.replaceState({page:'home'},'',location.pathname+'#home');state.customIcons=JSON.parse(localStorage.getItem('fishos_custom_icons')||'{}');state.page=currentHash();render();setTimeout(initFishMap,80);setTimeout(initFishMap,600);setTimeout(initFishMap,1500);updateClock();setInterval(updateClock,1000);

function fishSvg(caught=false){return `<svg viewBox="0 0 64 36" aria-hidden="true"><path d="M8 18c8-10 25-13 39-5l9-8-2 11 7 2-7 2 2 11-9-8C33 31 16 28 8 18Z" fill="${caught?'#79c900':'#aeb6a5'}" stroke="#245500" stroke-width="2"/><circle cx="21" cy="15" r="2.2" fill="#111"/><path d="M32 12c4 3 5 9 0 12" fill="none" stroke="#245500" stroke-width="1.5"/></svg>`}

function fishList(){let custom=state.fishCustom||[],groups=Object.entries(FISH_CATALOG).map(([g,items])=>[g,[...items,...custom.filter(x=>x.group===g).map(x=>x.name)]]);if(custom.filter(x=>!FISH_CATALOG[x.group]).length)groups.push(['Custom',custom.filter(x=>!FISH_CATALOG[x.group]).map(x=>x.name)]);let all=groups.flatMap(g=>g[1]);let caught=all.filter(x=>(state.fishCaught||[]).includes(x)).length;return shell('Fish List','Common names plus scientific names where Fish OS has a verified species mapping.',`<div class="stats"><div class="stat"><b>${caught}</b><span>Caught</span></div><div class="stat"><b>${all.length}</b><span>Total species</span></div><div class="stat"><b>${all.length-caught}</b><span>Targets / unmarked</span></div></div>${fishProgress(caught,all.length)}<div class="toolbar"><button class="btn gold" onclick="addFish()">+ Add species</button><button class="btn" onclick="go('journal')">Journal</button></div><div class="grid g2" style="margin-top:14px">${groups.map(([g,items])=>`<div class="card"><h3>${esc(g)}</h3><div class="fishgrid">${items.map(x=>{let c=(state.fishCaught||[]).includes(x);return `<label class="fishrow"><input type="checkbox" ${c?'checked':''} onchange="toggleFish('${esc(x).replace(/'/g,"\\'")}')"><span>${esc(x)}<em class="scientific">${esc(FISH_SCI[x]||'Scientific name not yet indexed')}</em></span><em>${c?'CAUGHT':'TARGET'}</em></label>`}).join('')}</div></div>`).join('')}</div>`)}
function fishIcon(){return L.divIcon({className:'fish-pin',html:fishSvg(true),iconSize:[28,20],iconAnchor:[14,10],popupAnchor:[0,-8]})}
function initFishMap(){const el=document.getElementById('fishMap');if(!el||el.dataset.ready==='1')return;if(!window.L){el.innerHTML='<div class="notice" style="margin:12px"><b>MAP ENGINE WAITING</b><br>Leaflet did not finish loading. Refresh once the page is fully loaded.</div>';return;}el.dataset.ready='1';const pts=[['Wickiup',43.678869,-121.732449,'location-wickiup'],['Metolius',44.555950,-121.620612,'location-metolius'],['Upper Nestucca',45.220,-123.585,'location-upper-nestucca'],['Katmai',58.65,-156.58,'trip-katmai'],['Bighorn',45.319682,-107.910387,'location-bighorn-river'],['Baja / La Paz',24.14231,-110.31316,'destination-baja-mexico']];const map=L.map(el,{scrollWheelZoom:true,zoomControl:true,worldCopyJump:true}).setView([43,-118],4);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const icon=fishIcon();pts.forEach(p=>L.marker([p[1],p[2]],{icon}).addTo(map).bindPopup(`<b>${esc(p[0])}</b><br>${p[1].toFixed(5)}, ${p[2].toFixed(5)}<br><button class="btn" style="margin-top:5px;padding:3px 6px" onclick="go('${p[3]}')">OPEN</button>`));const bounds=L.latLngBounds(pts.map(p=>[p[1],p[2]]));if(el.dataset.mapKind==='maps')map.fitBounds(bounds.pad(.18));setTimeout(()=>map.invalidateSize(),150);window.fishMap=map}
function standardDate(v){return /^\d{4}-\d{2}-\d{2}$/.test(v||'')?v:''}
function tripLocationSearch(){let q=document.getElementById('nfPlace').value.trim();if(q.length<3)return;let box=document.getElementById('tripLocResults');box.innerHTML='<div class="location-result">Searching…</div>';fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&q='+encodeURIComponent(q)).then(r=>r.json()).then(rows=>{box.innerHTML=rows.length?rows.map(x=>`<div class="location-result" onclick="selectTripLocation(${JSON.stringify(x).replace(/</g,'&lt;')})"><b>${esc(x.display_name.split(',').slice(0,2).join(', '))}</b><br><span class="muted">${esc(x.display_name)}</span></div>`).join(''):'<div class="location-result">No matches.</div>'}).catch(()=>box.innerHTML='<div class="location-result">Location search unavailable; enter the location manually.</div>')}
function selectTripLocation(x){document.getElementById('nfPlace').value=x.display_name||'';document.getElementById('nfLat').value=x.lat||'';document.getElementById('nfLon').value=x.lon||'';document.getElementById('tripLocResults').innerHTML='<div class="location-result">Location selected.</div>'}
function tripForm(){openModal('NEW TRIP',`<div class="tripgrid"><div class="tripfield wide"><b>Trip name *</b><input id="nfTrip" placeholder="e.g. Montana Fall 2027"></div><div class="tripfield"><b>Start date *</b><input id="nfStart" type="date" value="${localISO(new Date())}"></div><div class="tripfield"><b>End date</b><input id="nfEnd" type="date" value="${localISO(new Date())}"></div><div class="tripfield wide"><b>Location / water</b><input id="nfPlace" placeholder="Search a river, lake, city, lodge…"><button class="btn" type="button" onclick="tripLocationSearch()" style="margin-top:5px">SEARCH LOCATION</button><input id="nfLat" type="hidden"><input id="nfLon" type="hidden"><div id="tripLocResults" class="location-results" style="margin-top:5px"></div></div><div class="tripfield"><b>Region / state / country</b><input id="nfRegion" placeholder="Oregon / Montana / Mexico"></div><div class="tripfield"><b>Trip type</b><select id="nfType"><option>Freshwater</option><option>Saltwater</option><option>Travel</option><option>Lodge</option><option>Local</option></select></div><div class="tripfield wide"><b>Targets / species</b><input id="nfTargets" placeholder="Bull trout, brown trout, steelhead…"></div><div class="tripfield"><b>Host / lodge / operator</b><input id="nfHost" placeholder="Optional"></div><div class="tripfield"><b>Budget</b><input id="nfBudget" type="number" min="0" step="1" placeholder="$"></div><div class="tripfield"><b>Travel / booking reference</b><input id="nfBooking" placeholder="Flight, confirmation, reservation…"></div><div class="tripfield"><b>Expected hours</b><input id="nfHours" type="number" min="0" step="0.5" placeholder="0"></div><div class="tripfield wide"><b>Trip notes / plan</b><textarea id="nfNotes" placeholder="Plan, logistics, research, conditions, goals, route, etc."></textarea></div><div class="tripfield wide"><b>Gear / packing</b><textarea id="nfGear" placeholder="Optional exact rods, reels, lines, fly boxes, waders, etc."></textarea></div></div><button class="btn gold" onclick="saveTripForm()" style="margin-top:10px">SAVE TRIP</button>`)}
function saveTripForm(){let id=document.getElementById('nfTrip').value.trim(),start=document.getElementById('nfStart').value,end=document.getElementById('nfEnd').value||start;if(!id)return alert('Trip name required.');if(!standardDate(start)||!standardDate(end))return alert('Use the date pickers. Dates are stored as YYYY-MM-DD.');if(end<start)return alert('End date cannot be before start date.');DATA.trips=DATA.trips||[];let rec={id,region:document.getElementById('nfRegion').value.trim(),date:start===end?start:`${start}–${end}`,start_date:start,end_date:end,place:document.getElementById('nfPlace').value.trim(),lat:document.getElementById('nfLat').value,lon:document.getElementById('nfLon').value,type:document.getElementById('nfType').value,host:document.getElementById('nfHost').value.trim(),budget:Number(document.getElementById('nfBudget').value)||0,booking:document.getElementById('nfBooking').value.trim(),expected_hours:Number(document.getElementById('nfHours').value)||0,targets:document.getElementById('nfTargets').value.split(',').map(x=>x.trim()).filter(Boolean),notes:document.getElementById('nfNotes').value.trim(),gear_notes:document.getElementById('nfGear').value.trim(),status:'Upcoming'};DATA.trips.unshift(rec);ensureTripPack(rec.id);persistData();closeModal();go('trip-'+slug(rec.id))}
function tripDate(v){if(v&&/^\d{4}-\d{2}-\d{2}$/.test(v))return v;let m=String(v||'').match(/([A-Z][a-z]{2})\s+(\d{1,2})(?:[–-](\d{1,2}))?,\s*(\d{4})/);if(m){let mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].indexOf(m[1]);return `${m[4]}-${String(mo+1).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`}return '9999-12-31'}
function tripEndDate(v){if(v&&/^\d{4}-\d{2}-\d{2}$/.test(v))return v;let m=String(v||'').match(/([A-Z][a-z]{2})\s+(\d{1,2})(?:[–-](\d{1,2}))?,\s*(\d{4})/);if(m&&m[3]){let mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].indexOf(m[1]);return `${m[4]}-${String(mo+1).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`}return tripDate(v)}
function ensureTripPack(id){state.packingByTrip=state.packingByTrip||{};if(!state.packingByTrip[id])state.packingByTrip[id]=defaultTripPack();return state.packingByTrip[id]}
function defaultTripPack(){return {CLOTHING:[{name:'Hat',qty:1,weight:0,details:''},{name:'Fishing shirt',qty:2,weight:0,details:''},{name:'Socks',qty:4,weight:0,details:''}],FIELD:[{name:'Fly rod',qty:1,weight:0,details:'Specify rod below'},{name:'Reel',qty:1,weight:0,details:''},{name:'Leaders / tippet',qty:1,weight:0,details:''},{name:'Nippers / forceps',qty:1,weight:0,details:''}],TRAVEL:[{name:'License / permits',qty:1,weight:0,details:''},{name:'Phone / charger',qty:1,weight:0,details:''}]}}
function packing(){let trips=DATA.trips||[],sel=state.packTripId||(trips[0]?.id||'GENERAL');if(sel!=='GENERAL'&&!trips.some(t=>t.id===sel))sel=trips[0]?.id||'GENERAL';state.packTripId=sel;let p=sel==='GENERAL'?(state.packing||(state.packing=defaultTripPack())):ensureTripPack(sel),all=Object.values(p).flat(),done=all.filter(x=>x.done).length,totalWeight=all.reduce((n,x)=>n+(Number(x.qty)||0)*(Number(x.weight)||0),0);return shell('Packing','Exact trip loadouts — every item can carry quantity, weight and gear detail.',`<div class="packtripbar"><label>TRIP<select onchange="state.packTripId=this.value;localStorage.setItem('fishos_pack_trip',this.value);persistPack();">${['GENERAL',...trips.map(t=>t.id)].map(x=>`<option ${x===sel?'selected':''} value="${esc(x)}">${esc(x)}</option>`).join('')}</select></label><span class="packweight">${done}/${all.length} checked • ${totalWeight.toFixed(1)} oz listed</span><button class="btn gold" onclick="addPack()">+ ADD ITEM</button><button class="btn" onclick="addGearPack()">+ ADD GEAR</button></div><div class="packscreen">${Object.entries(p).map(([g,items])=>`<section class="packcat"><h3>${esc(g)}</h3>${items.map((x,i)=>`<div class="packgear ${x.done?'done':''}"><button class="packcheck" onclick="togglePack('${esc(g)}',${i})">${x.done?'X':' '}</button><span><b>${esc(x.name)}</b><br><span class="small muted">${esc(x.details||'')}</span></span><input placeholder="details" value="${esc(x.details||'')}" onchange="packEdit('${esc(g)}',${i},'details',this.value)"><input type="number" min="0" step="0.1" value="${Number(x.weight)||0}" title="weight oz each" onchange="packEdit('${esc(g)}',${i},'weight',this.value)"><input type="number" min="0" value="${Number(x.qty)||0}" onchange="packEdit('${esc(g)}',${i},'qty',this.value)"><button class="packdel" onclick="delPack('${esc(g)}',${i})">DEL</button></div>`).join('')}</section>`).join('')}</div>`)}
function packEdit(g,i,k,v){let p=state.packTripId==='GENERAL'?state.packing:ensureTripPack(state.packTripId);p[g][i][k]=k==='details'?v:(Number(v)||0);persistPack()}
function persistPack(){localStorage.setItem('fishos_packing',JSON.stringify(state.packing));localStorage.setItem('fishos_packing_by_trip',JSON.stringify(state.packingByTrip||{}));persistData();render()}
function addPack(){let p=state.packTripId==='GENERAL'?(state.packing||(state.packing=defaultTripPack())):ensureTripPack(state.packTripId);openModal('ADD PACKING ITEM',`<div class="form"><input id="npName" placeholder="Exact item / gear name"><input id="npCat" value="FIELD" placeholder="Category"><input id="npQty" type="number" value="1" min="0"><input id="npWeight" type="number" value="0" min="0" step="0.1" placeholder="Weight per item (oz)"><input id="npDetails" placeholder="Exact model / setup / size"><button class="btn gold" onclick="savePackItem()">ADD TO ${esc(state.packTripId)}</button></div>`)}
function savePackItem(){let p=state.packTripId==='GENERAL'?(state.packing||(state.packing=defaultTripPack())):ensureTripPack(state.packTripId),g=document.getElementById('npCat').value.trim()||'FIELD';if(!p[g])p[g]=[];p[g].push({name:document.getElementById('npName').value.trim(),qty:Number(document.getElementById('npQty').value)||1,weight:Number(document.getElementById('npWeight').value)||0,details:document.getElementById('npDetails').value.trim(),done:false});persistPack();closeModal()}
function addGearPack(){let p=state.packTripId==='GENERAL'?(state.packing||(state.packing=defaultTripPack())):ensureTripPack(state.packTripId);let opts=(DATA.rods||[]).map((r,i)=>`<option value="${i}">${esc(r[0])} — ${esc(r[2])} ${esc(r[3])} (${r[1]} wt)</option>`).join('');openModal('ADD ROD SETUP',`<div class="form"><select id="gearRod">${opts}</select><select id="gearPart"><option>ROD</option><option>REEL</option><option>LINE</option><option>FLY BOX</option></select><input id="gearWeight" type="number" min="0" step="0.1" placeholder="Actual packed weight (oz)"><input id="gearDetails" placeholder="Exact setup details"><button class="btn gold" onclick="saveGearPack()">ADD GEAR TO LOADOUT</button></div>`)}
function saveGearPack(){let r=DATA.rods[Number(document.getElementById('gearRod').value)]||DATA.rods[0],part=document.getElementById('gearPart').value,p=state.packTripId==='GENERAL'?(state.packing||(state.packing=defaultTripPack())):ensureTripPack(state.packTripId);if(!p.GEAR)p.GEAR=[];let text=part==='ROD'?`${r[0]} — ${r[2]} ${r[3]}`:part==='REEL'?r[4]:part==='LINE'?r[5]:`Fly box for ${r[0]}`;p.GEAR.push({name:text,qty:1,weight:Number(document.getElementById('gearWeight').value)||0,details:document.getElementById('gearDetails').value.trim(),done:false});persistPack();closeModal()}
function togglePack(g,i){let p=state.packTripId==='GENERAL'?state.packing:ensureTripPack(state.packTripId);p[g][i].done=!p[g][i].done;persistPack()}
function qtyPack(g,i,v){packEdit(g,i,'qty',v)}
function delPack(g,i){let p=state.packTripId==='GENERAL'?state.packing:ensureTripPack(state.packTripId);p[g].splice(i,1);persistPack()}
function resetPack(){if(confirm('Reset this trip packing list?')){if(state.packTripId==='GENERAL')state.packing=defaultTripPack();else state.packingByTrip[state.packTripId]=defaultTripPack();persistPack()}}
function tripDetail(k){let key=k.replace(/^trip-/,'');let t=(DATA.trips||[]).find(x=>slug(x.id||'')===key);if(!t)return shell('Trip','Trip workspace','<div class="empty">Trip record not found.</div>');let status=tripStatus(t);ensureTripPack(t.id);return shell(t.id||'Trip','Deep trip workspace — the central record linking location, dates, fish, journal, gear, flies, packing and research.',`<div class="grid g3"><div class="card"><h3>Overview</h3><div class="tag ${status==='Completed'?'':'hot'}">${esc(status)}</div><div class="tag">${esc(t.date||'')}</div><p class="muted">${esc(t.place||t.location||t.region||'')}</p></div><div class="card"><h3>Targets / species</h3><p>${esc((t.targets||t.species||[]).join(' • ')||'No targets stored.')}</p><p class="small muted">${esc(t.type||'')} ${t.host?'• '+esc(t.host):''}</p></div><div class="card"><h3>Trip details</h3><p class="small">Budget: <b>${t.budget?'$'+Number(t.budget).toLocaleString():'—'}</b><br>Booking: ${esc(t.booking||'—')}<br>Expected hours: ${t.expected_hours||0}</p></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Location</h3><p>${esc(t.place||'—')}</p>${t.lat&&t.lon?`<p class="small muted">${esc(t.lat)}, ${esc(t.lon)}</p>`:''}<div class="triplinks"><button class="btn" onclick="go('maps')">MAPS</button><button class="btn" onclick="tripLocationSearch()">EDIT LOCATION</button></div></div><div class="card"><h3>Plan / notes</h3><p>${esc(t.notes||'No trip notes yet.')}</p>${t.gear_notes?`<p class="small"><b>Gear:</b> ${esc(t.gear_notes)}</p>`:''}</div></div><div class="grid g3" style="margin-top:14px">${doors([{k:'PACK',t:'Trip Packing',d:'Exact loadout, quantities, weights and setup details.',page:'packing'},{k:'JOURNAL',t:'Trip Journal',d:'Conditions, observations and lessons.',page:'journal'},{k:'FISH',t:'Fish Log',d:'Fish caught and target species.',page:'fish-list'}])}</div>`)}
function gear(){let total=(DATA.rods||[]).reduce((n,r)=>n+(parseFloat(String(r[8]).replace(/[$,]/g,''))||0),0),top=[...DATA.rods].sort((a,b)=>(parseFloat(String(b[8]).replace(/[$,]/g,''))||0)-(parseFloat(String(a[8]).replace(/[$,]/g,''))||0)).slice(0,6);return shell('Gear','Interactive rod vault plus the rest of the fishing system.',`<div class="split"><div class="rodscene"><div class="rodgrip"></div><div class="rod"></div><div class="rodreel"></div><div class="rodpoint rp1" onclick="go('rod-list')">ROD VAULT</div><div class="rodpoint rp2" onclick="go('rod-list')">LINE</div><div class="rodpoint rp3" onclick="go('rod-list')">REEL</div><div class="rodpoint rp4" onclick="go('fly-patterns')">FLY BOX</div><div class="rodpoint rp5" onclick="go('packing')">FIELD KIT</div><div class="rodsectionlabel">CLICK A COMPONENT • BUILD A TRIP LOADOUT</div></div><div class="card rodvalueclick" onclick="go('rod-list')"><h3>Collection value</h3><div class="stat"><b>$${total.toLocaleString()}</b><span>Listed rod value</span></div><div class="rodchart">${top.map(r=>{let v=parseFloat(String(r[8]).replace(/[$,]/g,''))||0;return `<div class="rodbar"><span>${esc(r[0])}</span><i style="width:${Math.max(3,Math.round(v/1500*100))}%"></i><b>$${v.toLocaleString()}</b></div>`}).join('')}</div><p class="muted small">Uses the supplied listed prices only. Click to open the full inventory.</p></div></div><div class="card" style="margin-top:14px"><h3>Rod inventory</h3>${list(DATA.rods.map(r=>({title:`${r[0]} — ${r[2]} ${r[3]}`,meta:`${r[1]} wt • ${r[6]} • $${parseFloat(String(r[8]).replace(/[$,]/g,''))||0}`})),i=>`go('rod-${i}')`)}</div>`)}
function inventory(){return shell('Inventory','Counted flies, materials, tippet, leaders and gear.',`<div class="grid g4">${doors([{k:'FLIES',t:'Fly inventory',d:'Patterns, counts and boxes.',page:'fly-patterns'},{k:'MATERIALS',t:'Materials',d:'Tying stock and purchase needs.',page:'purchases'},{k:'TIPPET',t:'Tippet / leaders',d:'Fluoro, mono and sizes.',page:'tippet'},{k:'GEAR',t:'Gear',d:'Rods, reels, lines and field kit.',page:'gear'},{k:'BUY',t:'Buy List',d:'Checklist, categories and running totals.',page:'buy-list'}])}</div>`)}
function buyList(){let items=DATA.buy_items||[];let cats=[...new Set(items.map(x=>x.category||'Other'))];let total=items.filter(x=>!x.done).reduce((n,x)=>n+(Number(x.price)||0)*(Number(x.qty)||1),0);return shell('Buy List','Purchase checklist with category totals and a running total.',`<div class="card"><div class="buytotal">OPEN TOTAL: $${total.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div><p class="muted small">Edit any item directly through the item editor. Price is per item; category totals include quantity.</p><button class="btn gold" onclick="addBuyItem()">+ ADD TO BUY LIST</button></div><div class="buygrid" style="margin-top:12px">${cats.map(c=>{let arr=items.filter(x=>(x.category||'Other')===c),sum=arr.filter(x=>!x.done).reduce((n,x)=>n+(Number(x.price)||0)*(Number(x.qty)||1),0);return `<div class="card buycat"><h3>${esc(c)}</h3><div class="muted small">Category total: $${sum.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div>${arr.map(x=>`<div class="buyitem ${x.done?'done':''}"><input class="buycheck" type="checkbox" ${x.done?'checked':''} onchange="toggleBuy('${esc(x.id)}')"><span style="flex:1;min-width:0"><b>${esc(x.name)}</b><br><span class="small muted">Qty ${x.qty||1} • ${esc(x.notes||'')}</span></span><b>$${((Number(x.price)||0)*(Number(x.qty)||1)).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</b><button class="btn" onclick="editBuyItem('${esc(x.id)}')">EDIT</button><button class="btn" onclick="deleteBuyItem('${esc(x.id)}')">DEL</button></div>`).join('')}</div>`}).join('')}</div>`)}

function addBuyItem(){openModal('ADD BUY LIST ITEM',`<div class="form"><input id="buyName" placeholder="Item"><input id="buyCat" placeholder="Category — Rods, Reels, Lines, Flies, Travel…"><input id="buyQty" type="number" value="1" min="1"><input id="buyPrice" type="number" value="0" min="0" step="0.01" placeholder="Price each"><textarea id="buyNotes" placeholder="Model, size, reason, link…"></textarea><button class="btn gold" onclick="saveBuyItem()">ADD ITEM</button></div>`)}
function saveBuyItem(){let n=document.getElementById('buyName').value.trim();if(!n)return alert('Item required.');DATA.buy_items=DATA.buy_items||[];DATA.buy_items.push({id:'buy-'+Date.now(),name:n,category:document.getElementById('buyCat').value.trim()||'Other',qty:Number(document.getElementById('buyQty').value)||1,price:Number(document.getElementById('buyPrice').value)||0,notes:document.getElementById('buyNotes').value.trim(),done:false});persistData();closeModal();go('buy-list')}
function editBuyItem(id){let x=(DATA.buy_items||[]).find(x=>x.id===id);if(!x)return;openModal('EDIT BUY LIST ITEM',`<div class="form"><label>Item<input id="editBuyName" value="${esc(x.name||'')}"></label><label>Category<input id="editBuyCat" value="${esc(x.category||'Other')}"></label><label>Quantity<input id="editBuyQty" type="number" value="${Number(x.qty)||1}" min="1"></label><label>Price each<input id="editBuyPrice" type="number" value="${Number(x.price)||0}" min="0" step="0.01"></label><label>Notes<textarea id="editBuyNotes">${esc(x.notes||'')}</textarea></label><button class="btn gold" onclick="saveEditedBuyItem('${esc(id)}')">SAVE CHANGES</button></div>`)}
function saveEditedBuyItem(id){let x=(DATA.buy_items||[]).find(x=>x.id===id);if(!x)return;x.name=document.getElementById('editBuyName').value.trim();x.category=document.getElementById('editBuyCat').value.trim()||'Other';x.qty=Math.max(1,Number(document.getElementById('editBuyQty').value)||1);x.price=Math.max(0,Number(document.getElementById('editBuyPrice').value)||0);x.notes=document.getElementById('editBuyNotes').value.trim();if(!x.name)return alert('Item required.');persistData();closeModal();go('buy-list')}
function deleteBuyItem(id){let x=(DATA.buy_items||[]).find(x=>x.id===id);if(!x)return;if(confirm(`Delete ${x.name}?`)){DATA.buy_items=DATA.buy_items.filter(x=>x.id!==id);persistData();render()}}

function iconUploadHub(){const iconsNow=state.customIcons||{};const keys=[['home','Dashboard'],['trip','Trips'],['fish','Fish / Journal'],['map','Maps / Locations'],['fly','Flies / Knots'],['gear','Gear / Account'],['box','Inventory / Packing'],['book','Research / Resources'],['globe','Destinations']];return shell('Custom Icons + Upload Guide','One page for icon overrides, private file uploads and the Fish OS storage workflow.',`<div class="grid g2"><div class="card"><div class="titlebar">CUSTOM ICON PACK</div><div class="dropzone"><input id="iconFiles" type="file" accept="image/*,.svg" multiple onchange="importIcons(this.files)"><div>SELECT CUSTOM ICON FILES</div></div><div class="iconpicker">${keys.map(([k,n])=>`<div class="iconcard"><div class="iconpreview">${iconsNow[k]?`<img src="${iconsNow[k]}" alt="${esc(n)}">`:`<span class="ico" style="width:42px;height:42px">${I(k)}</span>`}</div><div class="iconname">${esc(n)}</div>${iconsNow[k]?`<button class="btn" onclick="clearIcon('${k}')">CLEAR</button>`:''}</div>`).join('')}</div><div class="toolbar"><button class="btn" onclick="exportIcons()">EXPORT ICON PACK</button><button class="btn" onclick="clearAllIcons()">RESET</button></div></div><div class="card"><div class="titlebar">PRIVATE FISH OS FILES</div><p class="muted small">Photos, PDFs, research, scans and other real files belong in the private Supabase Storage bucket — not the public GitHub repository.</p><div class="form"><label>File category<select id="storageCategory"><option value="photos">Photos</option><option value="research">Research / PDFs</option><option value="journal">Journal files</option><option value="video">Video</option><option value="documents">Documents</option><option value="other">Other</option></select></label><label>Trip ID (optional)<input id="storageTrip" placeholder="e.g. Katmai Trophy Lodge"></label><label>Journal ID (optional)<input id="storageJournal" placeholder="Existing journal record ID"></label><label>Notes (optional)<textarea id="storageNotes" placeholder="What is this file?"></textarea><input id="storageFiles" type="file" multiple><button class="btn gold" onclick="uploadFishFiles()">UPLOAD TO PRIVATE STORAGE</button></div><div id="storageStatus" class="small muted" style="margin-top:10px"></div></div></div><div class="card" style="margin-top:12px"><div class="titlebar">UPLOAD GUIDE // HOW THIS WORKS</div><div class="grid g2"><div><h3>Public GitHub</h3><p class="small">Keep <b>index.html</b>, <b>.nojekyll</b>, custom site icons and small public reference assets here. Do not put private photos, research files, passwords or secrets in the repository.</p></div><div><h3>Private Supabase Storage</h3><p class="small">Your actual files live in a private bucket under your account UUID. Fish OS stores metadata in <b>fishos_files</b>, which can later link each file to a trip, journal entry or location.</p></div></div><div class="notice"><b>Storage setup status:</b> Run the supplied <b>fish_os_supabase_setup.sql</b> once in Supabase SQL Editor. Then sign in to Fish OS and this upload panel can use the private bucket.</div></div><div class="card" style="margin-top:12px"><div class="titlebar">RECENT PRIVATE FILES</div><div id="storageList"><div class="muted">Loading file records…</div></div></div>`)}

function fieldSettings(){return JSON.parse(localStorage.getItem('fishos_field_settings')||'{"usgs":"","lat":"","lon":"","weatherName":"Local water"}')}

function fieldSettingsModal(pref={}){let s={...fieldSettings(),...pref};openModal('FIELD DATA SETTINGS',`<div class="form"><label>USGS gauge site ID<input id="fdUSGS" value="${esc(s.usgs||'')}" placeholder="e.g. 00000000"></label><label>Latitude<input id="fdLat" value="${esc(s.lat||'')}" placeholder="45.0000"></label><label>Longitude<input id="fdLon" value="${esc(s.lon||'')}" placeholder="-121.0000"></label><label>Water / weather name<input id="fdName" value="${esc(s.weatherName||'')}" placeholder="Metolius / local water"></label><p class="small muted">USGS uses the gauge ID you choose. Weather uses the latitude/longitude. No historical values are fabricated.</p><button class="btn gold" onclick="saveFieldSettings()">SAVE FIELD SETTINGS</button></div>`)}
async function loadFieldData(target='fieldData'){let el=document.getElementById(target);if(!el)return;let s={...fieldSettings()};el.innerHTML='<div class="muted">Loading live field data…</div>';let out=[];try{if(s.usgs){let u=`https://waterservices.usgs.gov/nwis/iv/?format=json&sites=${encodeURIComponent(s.usgs)}&parameterCd=00060,00010&siteStatus=all`;let j=await fetch(u).then(r=>r.json());let series=j?.value?.timeSeries||[];let vals=series.map(x=>({name:x.variable?.variableName||'',v:x.values?.[0]?.value?.at(-1)?.value||'',unit:x.variable?.unit?.unitCode||''}));out.push(`<div class="fieldsource"><b>USGS LIVE</b>${vals.length?vals.map(v=>`<div><span>${esc(v.name)}</span><strong>${esc(v.v)} ${esc(v.unit)}</strong></div>`).join(''):'No current readings returned.'}</div>`)}else out.push('<div class="fieldsource"><b>USGS</b><span>Configure a gauge ID.</span></div>');if(s.lat&&s.lon){let p=await fetch(`https://api.weather.gov/points/${encodeURIComponent(s.lat)},${encodeURIComponent(s.lon)}`).then(r=>r.json());let f=p?.properties?.forecast;if(f){let w=await fetch(f).then(r=>r.json());let periods=(w?.properties?.periods||[]).slice(0,4);out.push(`<div class="fieldsource"><b>WEATHER — ${esc(s.weatherName)}</b>${periods.map(x=>`<div><span>${esc(x.name)}</span><strong>${esc(x.temperature)}° ${esc(x.temperatureUnit)}</strong></div>`).join('')}</div>`)}else out.push('<div class="fieldsource"><b>WEATHER</b><span>No forecast returned.</span></div>')}else out.push('<div class="fieldsource"><b>WEATHER</b><span>Configure latitude / longitude.</span></div>');el.innerHTML=out.join('')+`<button class="btn" onclick="fieldSettingsModal()">CUSTOMIZE FIELD DATA</button>`}catch(e){el.innerHTML=`<div class="notice">Live field data could not be loaded right now. <button class="btn" onclick="fieldSettingsModal()">CHECK SETTINGS</button></div>`}}
function fieldDataCard(){return `<div class="card fieldcard"><div class="fieldhead"><h3>Local stream + weather</h3><button class="btn" onclick="fieldSettingsModal()">CUSTOMIZE</button></div><div id="fieldData" class="fielddata"><div class="muted">Loading…</div></div></div>`}

function home(){let today=new Date(),upcoming=(DATA.trips||[]).filter(t=>tripStatus(t,today)!=='Completed').sort((a,b)=>tripDate(a.date).localeCompare(tripDate(b.date))),next=upcoming[0];return `<div class="hero"><div><div class="eyebrow">PRIVATE FISHING COMMAND CENTER</div><h1>FISH OS</h1><p>A wormhole into the entire FLYS FOR FISH world: trips, fish, waters, flies, gear, research and future destinations.</p></div><button class="btn gold" onclick="quick()">+ QUICK ADD</button></div><div class="stats dashstats">${[['14','Trips','trips'],['31','Days fished','journal'],['128','Hours fished','journal'],['1,940','Miles','trips'],['67','Fish logged','journal'],['55','Species caught','fish-list'],['24','Waters','locations']].map(a=>`<div class="stat link" onclick="go('${a[2]}')"><b>${a[0]}</b><span>${a[1]}</span></div>`).join('')}</div><div class="dashboard-next"><div><div class="kicker">NEXT TRIP / TIME AWARE</div><h2>${esc(next?.id||'No upcoming trip')}</h2><p>${esc(next?`${next.date} • ${next.place||''} • ${tripStatus(next)}`:'Add a future trip')}</p></div><div><button class="btn gold" onclick="go('${next?`trip-${slug(next.id)}`:'trips'}')">OPEN</button><button class="btn" onclick="go('calendar')">CALENDAR</button></div></div><div class="dashsection v16dash" style="margin-top:14px">${doors([{k:'GOAL',t:'Summer Steelhead',d:'Lower Deschutes swing program and coastal Oregon steelhead.',page:'journal'},{k:'RESEARCH',t:'World Destination Atlas',d:'Country-by-country fly fishing research.',page:'destinations'},{k:'SPECIES',t:'Fly-Rod Fish List',d:'Common and scientific names with catch progress.',page:'fish-list'},{k:'GEAR',t:'Rod Vault',d:'Rods, reels, lines and field kits.',page:'gear'},{k:'FIELD',t:'Wickiup Brown Trout',d:'Spring arm observations and big-brown program.',page:'location-wickiup'},{k:'PACK',t:'Trip Packing',d:'Exact gear, weights and checklists per trip.',page:'packing'}])}</div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Live fishing

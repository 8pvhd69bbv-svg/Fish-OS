function initFishMap(){
  const el=document.getElementById('fishMap');
  if(!el || el.dataset.ready==='1') return;
  if(!window.L){el.innerHTML='<div class=\"notice\" style=\"margin:12px\"><b>MAP ENGINE WAITING</b><br>Leaflet did not finish loading. Refresh once the page is fully loaded. The rest of Fish OS remains available.</div>';return;}
  el.dataset.ready='1';
  const pts=[];
  const map=L.map(el,{scrollWheelZoom:true,zoomControl:true,worldCopyJump:true}).setView([43,-118],4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
  const fishIcon=L.divIcon({className:'fish-pin',html:'<div style="width:14px;height:14px;background:#ff5b00;border:2px solid #7d2500;box-shadow:1px 1px 0 #fff"></div>',iconSize:[14,14],iconAnchor:[7,7]});
  pts.forEach(p=>L.marker([p[1],p[2]],{icon:fishIcon}).addTo(map).bindPopup(`<b>${esc(p[0])}</b><br>${p[1].toFixed(5)}, ${p[2].toFixed(5)}<br><button class="btn" style="margin-top:5px;padding:3px 6px" onclick="go('${p[3]}')">OPEN</button>`));
  const bounds=L.latLngBounds(pts.map(p=>[p[1],p[2]]));
  if(kind==='maps') map.fitBounds(bounds.pad(.18));
  setTimeout(()=>map.invalidateSize(),150);
  window.fishMap=map;
}

function importIcons(files){
  const wanted=new Set(['home','trip','fish','map','fly','gear','box','book','globe']);let pending=[...files];if(!pending.length)return;
  let out={...(state.customIcons||{})};let i=0;
  const next=()=>{if(i>=pending.length){state.customIcons=out;localStorage.setItem('fishos_custom_icons',JSON.stringify(out));render();return;}let f=pending[i++];let base=f.name.replace(/\.[^.]+$/,'').toLowerCase().replace(/[^a-z0-9_-]/g,'');let key=base;if(!wanted.has(key)){let hit=[...wanted].find(k=>base.includes(k));if(hit)key=hit;}if(!wanted.has(key)){next();return;}if(f.size>350000){alert(f.name+' is over 350 KB and was skipped.');next();return;}let r=new FileReader();r.onload=()=>{out[key]=r.result;next()};r.readAsDataURL(f)};next()
}

async function supaClient(){if(!state.supabase.url||!state.supabase.key)return null;if(!window.supabaseClient){if(!window.supabase)return null;window.supabaseClient=window.supabase.createClient(state.supabase.url,state.supabase.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});}return window.supabaseClient}
function saveSupabase(){state.supabase={url:document.getElementById('sburl').value.trim(),key:document.getElementById('sbkey').value.trim()};localStorage.setItem('fishos_supabase',JSON.stringify(state.supabase));alert('Supabase connection saved.');render()}
async function magicLogin(){let c=await supaClient();let email=document.getElementById('pemail').value.trim();if(!c){alert('Save the Supabase Project URL and Publishable Key first.');return}if(!email){alert('Enter your email.');return}let {error}=await c.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});if(error)alert(error.message);else alert('Magic link sent. Check your email.');}
async function logoutSupabase(){let c=await supaClient();if(c)await c.auth.signOut();state.profile.loggedIn=false;state.profile.email='';localStorage.setItem('fishos_profile',JSON.stringify(state.profile));render()}

function fishSvg(caught=false){return `<svg viewBox="0 0 64 36" aria-hidden="true"><path d="M8 18c8-10 25-13 39-5l9-8-2 11 7 2-7 2 2 11-9-8C33 31 16 28 8 18Z" fill="${caught?'#79c900':'#aeb6a5'}" stroke="#245500" stroke-width="2"/><circle cx="21" cy="15" r="2.2" fill="#111"/><path d="M32 12c4 3 5 9 0 12" fill="none" stroke="#245500" stroke-width="1.5"/></svg>`}

function initFishMap(){const el=document.getElementById('fishMap');if(!el||el.dataset.ready==='1')return;if(!window.L){el.innerHTML='<div class="notice" style="margin:12px"><b>MAP ENGINE WAITING</b><br>Leaflet did not finish loading. Refresh once the page is fully loaded.</div>';return;}el.dataset.ready='1';const pts=[];const map=L.map(el,{scrollWheelZoom:true,zoomControl:true,worldCopyJump:true}).setView([43,-118],4);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const icon=fishIcon();pts.forEach(p=>L.marker([p[1],p[2]],{icon}).addTo(map).bindPopup(`<b>${esc(p[0])}</b><br>${p[1].toFixed(5)}, ${p[2].toFixed(5)}<br><button class="btn" style="margin-top:5px;padding:3px 6px" onclick="go('${p[3]}')">OPEN</button>`));const bounds=L.latLngBounds(pts.map(p=>[p[1],p[2]]));if(el.dataset.mapKind==='maps')map.fitBounds(bounds.pad(.18));setTimeout(()=>map.invalidateSize(),150);window.fishMap=map}

  function loadV21IntoData(d){

    ['trips','locations','rods','journal','fish','flies','destination_notes','calendar_entries','buy_items','fly_tying_inventory','tippet_inventory','material_inventory','podcast_notes','trip_sessions'].forEach(k=>{if(Array.isArray(d[k]))DATA[k]=d[k]});

    if(d.packing)state.packing=d.packing;
    if(Array.isArray(d.fishCustom))state.fishCustom=d.fishCustom;
    if(Array.isArray(d.fishCaught))state.fishCaught=d.fishCaught;
    if(d.component_gear)DATA.component_gear=d.component_gear;
    if(d.field_settings)DATA.field_settings=d.field_settings;
    if(typeof d.youtube_playlist==='string')DATA.youtube_playlist=d.youtube_playlist;

  window.loadCloudV21=async function(){
    try{
      if(!window.supabaseClient||!state.profile.userId)return false;
      const r=await window.supabaseClient.from('fishos_user_data').select('data').eq('user_id',state.profile.userId).maybeSingle();
      if(r.error){console.warn('Fish OS cloud load:',r.error.message);return false}
      if(r.data?.data){loadV21IntoData(r.data.data);return true}
      await window.supabaseClient.from('fishos_user_data').upsert({user_id:state.profile.userId,data:cloudV21(),updated_at:new Date().toISOString()});
      return true;
    }catch(e){console.warn('Fish OS cloud load:',e);return false}
  };

listed dollar values.',page:'rod-list'},{k:'FIELD',t:'Locations',d:'Saved private fishing waters and pins.',page:'locations'},{k:'PACK',t:'Fishing Pack',d:'Trip-specific packing list.',page:'packing'}])}</div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Live fishing map</h3>${liveMap('home')}</div><div class="card"><h3>Big fish / recent</h3>${list((DATA.journal||[]).slice(-3).reverse().map(x=>({title:x.title||x.id||x.location||"Journal entry",meta:[x.date,x.location||x.place].filter(Boolean).join(" • ")})),()=>"go('journal')")}}</div></div><div class="card" style="margin-top:14px"><h3>Today</h3><p class="muted">${today.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})} • ${upcoming.length?upcoming.length+' upcoming/active trip(s)':'no future trips currently stored'}</p><button class="btn" onclick="go('calendar')">Open live calendar</button></div>`}

<script id="fishos-v33-focused-map-import">
(function(){
 const esc33=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const normalized=s=>String(s??'').toLowerCase().replace(/[^a-z0-9]/g,'');
 const keyFor=(kind,v)=>{
  if(typeof v==='string')return normalized(v);
  if(!v||typeof v!=='object')return normalized(JSON.stringify(v));
  if(kind==='journal')return normalized([v.id||v.title||v.date,v.date||'',v.location||v.place||''].join('|'));
  if(kind==='rods')return normalized([v[0],v[1],v[2],v[3]].join('|'));
  if(kind==='trips')return normalized(v.id||v.title||v.name);
  if(kind==='locations')return normalized(v.name||v.id||v.place);
  if(kind==='links'){try{let u=new URL(v.url||v);return (u.hostname.replace(/^www\./,'')+u.pathname.replace(/\/$/,'')).toLowerCase()}catch{return normalized(v.url||v)}}
  if(kind==='knot_notes')return normalized(v.name||v.title);
  if(kind==='flies')return normalized(v.name||v.title);
  if(kind==='destinations')return normalized(v.country||v.name);
  return normalized(v.id||v.name||v.title||JSON.stringify(v));
 };
 const keep={trips:1,locations:1,rods:1,journal:1,fish:1,flies:1,links:1,knot_notes:1,destinations:1,destination_notes:1,buy:1,buy_items:1,buy_rods:1,calendar_entries:1,trip_sessions:1,component_gear:1,river:1,rivers:1,packing:1,knots:1,priority_species:1,species:1};
 function mapLinks(){
  const p=state.page;
  if(!['maps','locations'].includes(p)&&!p.startsWith('location-')&&!p.startsWith('trip-'))return;
  const main=document.getElementById('main');if(!main||main.querySelector('#fishos33-links'))return;
  const chosen=p.startsWith('location-')?(DATA.locations||[]).find(x=>normalized(x.name||x.id)===normalized(p.slice(9))):null;
  const lat=Number(chosen?.lat??chosen?.latitude),lon=Number(chosen?.lon??chosen?.lng??chosen?.longitude);
  const coords=Number.isFinite(lat)&&Number.isFinite(lon)&&lat&&lon?lat+','+lon:null;
  const query=coords||chosen?.name||'fishing locations';
  const div=document.createElement('section');div.id='fishos33-links';div.className='card';div.style.marginTop='12px';
  const items=[['GOOGLE MAPS','https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(query)],['GOOGLE EARTH','https://earth.google.com/web/'],['ONX MAPS','https://web.onxmaps.com/'],['USGS WATER DATA','https://waterdata.usgs.gov/'],['NOAA WEATHER','https://www.weather.gov/'],['OPENSTREETMAP','https://www.openstreetmap.org/search?query='+encodeURIComponent(query)]];
  div.innerHTML='<h3>MAPS & FIELD DATA</h3><p class="muted small">External resources open in new tabs. ONX is a link, not an embedded ONX layer. USGS readings require a selected gauge.</p><div class="toolbar">'+items.map(([t,u])=>'<a class="btn" href="'+esc33(u)+'" target="_blank" rel="noopener noreferrer">'+t+'</a>').join('')+'</div>';
  main.appendChild(div);
 }
 function addImport(){return; if(state.page!=='account')return;const main=document.getElementById('main');if(!main||main.querySelector('#fishos33-import'))return;
  const div=document.createElement('section');div.id='fishos33-import';div.className='card';div.style.marginTop='12px';div.innerHTML='<h3>SAFE CONSOLIDATED PRIVATE IMPORT</h3><p class="muted small">Upload the V33 personal JSON here ONLY, after signing in. Compares records by identity and skips matches; does not overwrite edited cloud records. Preview before confirming. Back up current cloud data first using Export Private JSON above.</p><input type="file" accept=".json,application/json" id="fishos33-file"><button class="btn gold" onclick="fishos33Import()">PREVIEW / IMPORT MISSING ONLY</button><p class="muted small" id="fishos33-result"></p>';main.appendChild(div);
 }
 window.fishos33Import=async function(fileOverride){const label=document.getElementById('fishos33-result');const say=s=>{if(label)label.textContent=s};try{
  const file=fileOverride||document.getElementById('fishos33-file')?.files?.[0];if(!file)throw Error('Select the V33 private JSON.');if(file.size>15e6)throw Error('Backup too large.');
  if(!state.profile?.loggedIn||!state.privateHydrated||!window.supabaseClient||!state.profile?.userId)throw Error('Sign in and finish cloud loading first.');
  const raw=JSON.parse(await file.text());if(raw?._fishos_private_backup?.version!=='v33-consolidated')throw Error('Select the V33 consolidated private JSON file.');
  const client=window.supabaseClient;const res=await client.from('fishos_user_data').select('data').eq('user_id',state.profile.userId).maybeSingle();if(res.error)throw res.error;
  const current=res.data?.data||{},merged={...current},counts=[];
  for(const [k,items] of Object.entries(raw)){
   if(k.startsWith('_')||k==='storage_note'||k==='system'||k==='project'||k==='version')continue;
   if(Array.isArray(items)){
    if(!keep[k])continue;
    const prev=Array.isArray(current[k])?current[k]:[];
    const identities=new Set(prev.map(v=>keyFor(k,v)));
    const additions=items.filter(v=>{const id=keyFor(k,v);if(!id||identities.has(id))return false;identities.add(id);return true});
    if(additions.length)merged[k]=prev.concat(additions);
    counts.push(k+': '+additions.length+' new / '+(items.length-additions.length)+' skipped');
   }else if(items&&typeof items==='object'){
    if(!Object.prototype.hasOwnProperty.call(merged,k))merged[k]=items;
   }else if((merged[k]===undefined||merged[k]===null||merged[k]==='')&&items!==undefined)merged[k]=items;
  }
  const changes=counts.filter(x=>!x.includes(': 0 new'));
  say('Preview: '+(changes.join('; ')||'No missing array records')+'. Nothing saved yet.');
  if(!changes.length){say('No missing array records detected. Your existing cloud data was not changed.');return}
  if(!confirm('Import missing records ONLY? Existing records are skipped. '+changes.join('; ')))return;
  const save=await client.from('fishos_user_data').upsert({user_id:state.profile.userId,data:merged,updated_at:new Date().toISOString()});if(save.error)throw save.error;
  say('Saved to private Supabase. Reload the page to hydrate all imported records.');state.cloudStatus='Saved';
 }catch(err){say('Import not completed: '+(err.message||err))}
 };
 const prior=window.render;window.render=function(){const result=prior.apply(this,arguments);setTimeout(()=>{try{mapLinks();addImport()}catch(e){console.warn('V33 enhancement',e)}},0);return result};
 setTimeout(()=>{mapLinks();addImport()},100);
})();
</script>

function cat(x){const t=String(x?.type||x?.category||'Other').toLowerCase().trim();return ({'dry':'Dry Fly','dry fly':'Dry Fly','nymphs':'Nymph','streamers':'Streamer','egg':'Egg / Worm','egg/worm':'Egg / Worm','salt':'Saltwater','warm water':'Warmwater'})[t]||flyTypes.find(c=>c.toLowerCase()===t)||'Other'}

function researchPage(){return shell('Research','Private file library, searchable catalog, and existing research sources.',`<div class="grid g2"><div class="card"><h3>UPLOAD PRIVATE RESEARCH</h3><p class="muted small">Any file format accepted by the selector; actual file size/type limits depend on your Supabase Storage settings. Files are not added to GitHub.</p><label>FILES<input id="v34Files" type="file" multiple></label><label>CATEGORY<select id="v34Category"><option>General</option><option>Destinations</option><option>Species</option><option>Fly Patterns</option><option>Knots</option><option>Maps</option><option>Gear</option><option>Trip Research</option><option>Articles</option><option>Video / Audio</option><option>Other</option></select></label><label>NOTES<textarea id="v34Notes" rows="3" placeholder="Description, source, trip or location…"></textarea></label><button class="btn gold" onclick="v34UploadFiles()">UPLOAD TO PRIVATE RESEARCH</button><div id="v34UploadStatus" class="muted small" role="status"></div></div><div class="card"><h3>CATALOG</h3><label>SEARCH<input id="v34Search" placeholder="Filter files, categories and notes" oninput="v34FilterCatalog(this.value)"></label><button class="btn" onclick="v34ListFiles()">REFRESH PRIVATE FILES</button><div id="v34FileStatus" class="muted small" role="status"></div></div></div><div id="v34FileRows" class="card">Sign in to load private research files.</div><div class="card"><h3>RESEARCH LINKS & NOTES</h3><button class="btn" onclick="go('resources')">OPEN RESOURCES</button><button class="btn" onclick="go('custom-icons')">CUSTOM ICONS + UPLOAD GUIDE</button><button class="btn" onclick="go('account')">IMPORT RESEARCH JSON VIA ACCOUNT</button></div>`)}

window.v34UploadFiles=async function(){const e=document.getElementById('v34UploadStatus'),files=[...document.getElementById('v34Files')?.files||[]];try{if(!files.length)throw Error('Select one or more files.');const {client,userId}=clientUser();const category=document.getElementById('v34Category').value,notes=document.getElementById('v34Notes').value;let done=0,skipped=0;const existing=await client.from('fishos_files').select('original_name,size_bytes,category').eq('user_id',userId);if(existing.error)throw existing.error;const known=new Set((existing.data||[]).map(f=>`${f.original_name.toLowerCase()}|${f.size_bytes}|${(f.category||'').toLowerCase()}`));for(const file of files){const key=`${file.name.toLowerCase()}|${file.size}|${category.toLowerCase()}`;if(known.has(key)){skipped++;continue}const basename=file.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-140)||'file';const path=`${userId}/research/${crypto.randomUUID()}-${basename}`;if(e)e.textContent=`Uploading ${done+1} / ${files.length}: ${file.name}`;const up=await client.storage.from('fishos-private').upload(path,file,{upsert:false,contentType:file.type||'application/octet-stream'});if(up.error)throw new Error(`Upload ${file.name}: ${up.error.message}`);const meta=await client.from('fishos_files').insert({user_id:userId,bucket_id:'fishos-private',path,original_name:file.name,mime_type:file.type||'application/octet-stream',size_bytes:file.size,category,notes});if(meta.error){await client.storage.from('fishos-private').remove([path]);throw new Error('Metadata save: '+meta.error.message)}known.add(key);done++}if(e)e.textContent=`Uploaded ${done} file(s) to private Research; skipped ${skipped} existing filename/size/category matches.`;await window.v34ListFiles()}catch(err){if(e)e.textContent='Upload error: '+statusText(err)}};
window.v34OpenFile=async function(id){try{const {client,userId}=clientUser(),f=fileRows.find(x=>x.id===id&&x.user_id===userId);if(!f)return;const x=await client.storage.from('fishos-private').createSignedUrl(f.path,60);if(x.error)throw x.error;window.open(x.data.signedUrl,'_blank','noopener,noreferrer')}catch(err){alert('Could not open file: '+statusText(err))}};

(function(){

const esc35=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

 for(const id of ['privateImportFile','v31-import-file','fishos33-file']){const n=host.querySelector('#'+id);if(n){const c=n.closest('.card');if(c)c.remove()}}

window.v35Import=async function(){const info=document.getElementById('v35ImportStatus'),f=document.getElementById('v35ImportFile')?.files?.[0];const say=t=>{if(info)info.textContent=t};try{if(!f)throw Error('Select a private Fish OS JSON file.');if(f.size>15e6)throw Error('JSON exceeds 15 MB.');if(!state.profile?.loggedIn||!state.privateHydrated||!window.supabaseClient)throw Error('Sign in and finish cloud loading first.');const p=JSON.parse(await f.text());if(p?.format==='fishos-research-import-v1'){say('Research import: checking duplicate knot names and URLs.');await window.importV31Research(f)}else if(p?._fishos_private_backup?.version==='v33-consolidated'){say('Consolidated import: checking record identities and duplicate entries.');await window.fishos33Import(f)}else if((p?.format==='fishos-private'&&p.data)||['journal','trips','rods','locations','flies','knot_notes','links'].some(k=>Object.hasOwn(p,k))){say('Private backup: older format uses whole-record matching. Review the confirmation carefully; cancel if you have edited existing records.');await window.importFishOSPrivate(f)}else throw Error('Unrecognized Fish OS JSON. No changes made.');say('Import process finished. Review the confirmation and private cloud status.');}catch(e){say('Import not completed: '+(e.message||String(e)))}};
// Keep original import feedback visible inside the single import card, not separate cards.
function feedback35(){const e=document.getElementById('v35ImportStatus');if(!e)return;for(const id of ['v31-import-result','fishos33-result','importReport']){const old=document.getElementById(id);if(old&&old.textContent)e.textContent=old.textContent}}

let rows35=[];
const originalList35=window.v34ListFiles;
window.v34ListFiles=async function(){const el=document.getElementById('v34FileStatus');try{const {client,userId}=v35Client();if(el)el.textContent='Loading private catalog…';const r=await client.from('fishos_files').select('id,user_id,bucket_id,path,original_name,mime_type,size_bytes,category,notes,created_at').eq('user_id',userId).order('created_at',{ascending:false});if(r.error)throw r.error;rows35=r.data||[];renderRows35(document.getElementById('v34Search')?.value||'');if(el)el.textContent=`${rows35.length} cataloged files. Click VERIFY to check each object in private Storage.`}catch(e){if(el)el.textContent='Catalog error: '+(e.message||e)}};
function v35Client(){if(!state.profile?.loggedIn||!state.profile.userId||!window.supabaseClient)throw Error('Sign in to access private files.');return {client:window.supabaseClient,userId:state.profile.userId}}
function renderRows35(q){const e=document.getElementById('v34FileRows');if(!e)return;const subset=rows35.filter(f=>[f.original_name,f.category,f.notes,f.mime_type].some(x=>String(x||'').toLowerCase().includes(String(q||'').toLowerCase())));e.innerHTML=`<h3>PRIVATE FILES — ${subset.length}</h3>`+(subset.map(f=>`<div style="padding:12px 0;border-bottom:1px solid #7774"><b>${esc35(f.original_name)}</b> <span class="muted small">${esc35(f.category||'General')} · ${Number(f.size_bytes||0).toLocaleString()} bytes · ${esc35((f.created_at||'').slice(0,10))}</span><p class="muted small">${esc35(f.notes||'')}</p><div class="toolbar"><button class="btn" onclick="v35OpenFile('${f.id}')">OPEN</button><button class="btn" onclick="v35VerifyFile('${f.id}')">VERIFY</button><button class="btn" onclick="v35EditFile('${f.id}')">EDIT</button><button class="btn" onclick="v35DeleteFile('${f.id}')">DELETE</button></div><div id="v35Status-${f.id}" class="muted small" role="status">Cataloged (not yet verified in Storage)</div></div>`).join('')||'<p class="muted">No matching files.</p>')}

window.v35OpenFile=async function(id){const f=rows35.find(x=>x.id===id);if(!f)return;try{const {client}=v35Client();const r=await client.storage.from(f.bucket_id||'fishos-private').createSignedUrl(f.path,60);if(r.error)throw r.error;window.open(r.data.signedUrl,'_blank','noopener,noreferrer')}catch(e){alert('Open error: '+(e.message||e))}};

function lookupCountry(slug){const name=countries[slug]||slug.replace(/-/g,' ');const privateRows=Array.isArray(DATA.destination_notes)?DATA.destination_notes:[];const row=privateRows.find(x=>norm(x.country||x.name)===norm(name));const legacy=(Array.isArray(DATA.destinations)?DATA.destinations:[]).find(x=>norm(typeof x==='string'?x:x.country||x.name)===norm(name));return {name,row,legacy:typeof legacy==='object'?legacy:null}}

function countryPage39(route){const key=route.replace(/^destination-/,'');const {name,row,legacy}=lookupCountry(key);const rating=row?.rating||legacy?.rating||'Unrated';const notes=row?.notes||row?.description||legacy?.notes||legacy?.description||'';const regions=[...new Set([row?.region,...(Array.isArray(legacy?.regions)?legacy.regions:[])].filter(Boolean))];const links=(DATA.links||[]).filter(v=>{const z=typeof v==='object'?v:{};return norm([z.country,z.category,z.tags,z.title,z.notes].filter(Boolean).join(' ')).includes(norm(name))});
return shell(name,'Country / destination workspace — private notes, ratings and research.',`<div class="grid g2"><div class="card"><div class="titlebar">COUNTRY PROFILE</div><label>FISHING RATING<select id="v39CountryRate">${['Unrated','Great','Good','OK','Bust'].map(x=>`<option ${x===rating?'selected':''}>${x}</option>`).join('')}</select></label><label>NOTES / SPECIES / WATERS<textarea id="v39CountryNotes" rows="12" placeholder="Your research, species, access, operators and seasons">${H(notes)}</textarea></label><label>REGIONS / WATERS (comma separated)<input id="v39CountryRegions" value="${H(regions.join(', '))}"></label><button class="btn gold" onclick="fishos39CountrySave('${encodeURIComponent(name)}')">SAVE PRIVATE COUNTRY NOTES</button></div><div class="card"><div class="titlebar">RESEARCH & MAPS</div><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}">GOOGLE MAPS</a> <a class="btn" target="_blank" rel="noopener" href="https://www.openstreetmap.org/search?query=${encodeURIComponent(name)}">OPENSTREETMAP</a><h3>Saved research links (${links.length})</h3>${links.map(v=>`<p><a target="_blank" rel="noopener" href="${H(v.url||'')}">${H(v.title||v.url||'Source')}</a></p>`).join('')||'<p class="muted">No linked resource entries yet. Use Resources to import and catalog your saved research.</p>'}<button class="btn" onclick="go('resources')">RESOURCE LIBRARY</button><button class="btn" onclick="go('destinations')">BACK TO ATLAS</button></div></div>`)}
window.fishos39CountrySave=encoded=>{const name=decodeURIComponent(encoded);DATA.destination_notes=Array.isArray(DATA.destination_notes)?DATA.destination_notes:[];let row=DATA.destination_notes.find(x=>norm(x.country||x.name)===norm(name));if(!row){row={country:name};DATA.destination_notes.push(row)}row.rating=document.getElementById('v39CountryRate').value;row.notes=document.getElementById('v39CountryNotes').value;row.regions=document.getElementById('v39CountryRegions').value.split(',').map(s=>s.trim()).filter(Boolean);row.region=row.regions[0]||'';persistData();window.render()};
const normalUrl=s=>{try{const u=new URL(s);return (u.hostname+u.pathname.replace(/\/$/,'')).toLowerCase()}catch{return ''}};
let resourceFilter39='';
window.fishos39ResourcesFilter=value=>{resourceFilter39=value;window.render()};
function resources39(){let links=(Array.isArray(DATA.links)?DATA.links:[]).map(x=>typeof x==='string'?{title:x,url:''}:x).filter(Boolean);let unique=new Map();for(const link of links){const k=normalUrl(link.url)||norm(link.title||link.name);if(k&&!unique.has(k))unique.set(k,link)}links=[...unique.values()];const categorize48=x=>{const v=[x.title,x.name,x.url,x.tags,x.notes].filter(Boolean).join(' ').toLowerCase();if(/\b(regulations?|licenses?|licences?|fishing rules|fish and wildlife|fish and game|odfw|wdfw|myodfw|fwp\.mt|wildlife\.ca\.gov)\b/.test(v))return 'Regulations';if(/\b(fly shop|fly shops|fly store|fly fishing shop|trident fly|fly fish food|big y fly|j stockard|avidmax|the fly shop)\b/.test(v)||/(flyshop|tridentflyfishing|flyfishfood|bigyfly|jstockard)/.test(v))return 'Fly Shop';return 'Research'};links=links.map(x=>({...x,category:categorize48(x)}));const categories=['All','Fly Shop','Regulations','Research'];const activeCategory=window.fishosResourceCategory||'All';const shown=links.filter(x=>(activeCategory==='All'||x.category===activeCategory)&&(!resourceFilter39||JSON.stringify(x).toLowerCase().includes(resourceFilter39.toLowerCase())));return shell('Resources','Searchable private catalog of fishing links, organized by category and source.',`<div class="toolbar"><button class="btn gold" onclick="fishos39AddLink()">+ ADD LINK</button><button class="btn" onclick="document.getElementById('v39CatalogInput').click()">IMPORT LINK CATALOG</button><input id="v39CatalogInput" type="file" accept=".json,application/json" style="display:none" onchange="fishos39ImportLinks(this.files[0])"><input aria-label="Search resource links" value="${H(resourceFilter39)}" placeholder="Search links / categories" oninput="fishos39ResourcesFilter(this.value)"></div><div class="toolbar" id="fishos-resource-categories">${categories.map(cat=>'<button class="btn '+(activeCategory===cat?'gold':'')+'" onclick="window.fishosResourceCategory='+JSON.stringify(cat).replace(/"/g,'&quot;')+';render()">'+cat+'</button>').join('')}</div><div id="v39CatalogStatus" class="muted small"></div><p class="muted">${shown.length} unique links • ${categories.length} categories</p><div class="grid g2">${shown.map(x=>`<div class="card"><div class="titlebar">${H(x.category||'GENERAL')}</div><b>${H(x.title||x.name||x.url||'Resource')}</b><p class="muted small">${H(typeof x.tags==='string'?x.tags:x.notes||'')}</p>${/^https?:\/\//.test(x.url||'')?`<a class="btn" target="_blank" rel="noopener noreferrer" href="${H(x.url)}">OPEN WEBSITE</a>`:''}</div>`).join('')||'<div class="empty">No resource links match this search.</div>'}</div>`)}
window.fishos39AddLink=()=>openModal('ADD RESOURCE LINK',`<div class="form"><label>LINK TITLE<input id="v39LinkName"></label><label>WEBSITE URL<input type="url" id="v39LinkUrl" placeholder="https://..."></label><label>CATEGORY<input id="v39LinkCategory" placeholder="Destinations / Steelhead"></label><label>NOTES<textarea id="v39LinkNotes"></textarea></label><button class="btn gold" onclick="fishos39SaveLink()">SAVE LINK</button></div>`);
window.fishos39SaveLink=()=>{const url=document.getElementById('v39LinkUrl').value.trim();if(!/^https?:\/\//i.test(url)){alert('Enter a valid web URL.');return}DATA.links=DATA.links||[];if(DATA.links.some(x=>normalUrl(x.url)===normalUrl(url))){alert('This link is already cataloged.');return}DATA.links.push({title:document.getElementById('v39LinkName').value.trim()||url,url,category:document.getElementById('v39LinkCategory').value.trim()||'General',notes:document.getElementById('v39LinkNotes').value});persistData();closeModal();window.render()};
window.fishos39ImportLinks=async file=>{try{if(!file)return;if(!state.profile?.loggedIn||!state.privateHydrated)throw Error('Sign in and load private data first.');const parsed=JSON.parse(await file.text());if(parsed.format!=='fishos-v39-resource-catalog-v1'||!Array.isArray(parsed.links))throw Error('Please select the V39 private resource catalog JSON.');const client=window.supabaseClient;if(!client)throw Error('Supabase is not connected.');const res=await client.from('fishos_user_data').select('data').eq('user_id',state.profile.userId).maybeSingle();if(res.error)throw res.error;const old=res.data?.data||{},existing=Array.isArray(old.links)?old.links:[];const seen=new Set(existing.map(x=>normalUrl(typeof x==='string'?x:x.url)));const additions=[];for(const l of parsed.links){if(!l||typeof l.url!=='string'||!/^https?:\/\//i.test(l.url))continue;const key=normalUrl(l.url);if(!key||seen.has(key))continue;seen.add(key);additions.push(l)}if(!additions.length){alert('All links in this catalog are already saved.');return}if(!confirm(`Import ${additions.length} new resource links? ${parsed.links.length-additions.length} entries will be skipped. Existing records will not change.`))return;const write=await client.from('fishos_user_data').upsert({user_id:state.profile.userId,data:{...old,links:[...existing,...additions]},updated_at:new Date().toISOString()});if(write.error)throw write.error;DATA.links=[...existing,...additions];localStorage.setItem('fishos_data',JSON.stringify(DATA));state.cloudStatus='Saved';window.render();alert(`Saved ${additions.length} private resource links.`)}catch(e){alert('Link catalog import failed: '+String(e.message||e))}};

function routeAnimation39(){const current=state.page;if(current===lastPage39)return;lastPage39=current;const main=document.getElementById('main');if(main&&window.matchMedia('(prefers-reduced-motion: no-preference)').matches){main.style.animation='none';void main.offsetWidth;main.style.animation='fishos39Once .2s ease-out 1'}}

})();

<script>
/* V40: narrow enhancement over V39; older routes and controls remain. */
(()=>{
const safe40=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORE40='fishos_v40_sync_';
const sKey40=()=>STORE40+(state.profile?.userId||'anonymous');
const metric40=()=>{try{return JSON.parse(localStorage.getItem(sKey40())||'{}')}catch{return {}}};
function writeMetric40(p){const o={...metric40(),...p};localStorage.setItem(sKey40(),JSON.stringify(o));return o}
// Wrap the canonical save path; log successful DB response rather than optimistic local edits.
const prevSync40=window.syncCloud;
if(typeof prevSync40==='function')window.syncCloud=async function(){try{const ok=await prevSync40.apply(this,arguments);if(ok===true){writeMetric40({lastSuccess:new Date().toISOString(),lastError:null});}else if(state.profile?.loggedIn&&state.privateHydrated){writeMetric40({lastError:state.cloudError||'Database did not confirm save',lastFailure:new Date().toISOString()});}return ok}catch(e){writeMetric40({lastError:String(e.message||e),lastFailure:new Date().toISOString()});throw e}};
let masterArchive40=null;
let fileList40=[];
window.fishos40Mode=(v)=>{document.getElementById('f40mode').value=v;document.querySelectorAll('[data-f40mode]').forEach(b=>b.classList.toggle('gold',b.dataset.f40mode===v));document.getElementById('f40modehelp').textContent=v==='add'?'Add a trip, journal entry, fish, fly, destination or link directly. No file required.':v==='upload'?'Store any selected file privately and catalog it. JSON is stored as a document, not imported.': 'Import an existing Fish OS backup or location-coordinate JSON. Confirm before applying records.';};
window.fishos40Add=(type)=>{const f={trip:'tripForm',journal:'journalForm',fish:'fishForm',fly:'flyForm',destination:'destinationForm',resource:'fishos39AddLink'}[type];if(typeof window[f]==='function')return window[f]();if(type==='fish'&&typeof fishForm==='function')return fishForm();if(typeof quick==='function')quick(type);};
async function connected40(){if(!state.profile?.loggedIn||!state.profile?.userId||!window.supabaseClient)throw Error('Sign in to your private account first.');return {client:window.supabaseClient,id:state.profile.userId}}
function say40(msg){const e=document.getElementById('f40result');if(e)e.textContent=msg}
window.fishos40Status=async function(){const box=document.getElementById('f40stats');if(!box)return;let html='';const m=metric40();html+=`<div><b>Last confirmed database save:</b> ${safe40(m.lastSuccess?new Date(m.lastSuccess).toLocaleString():'Not recorded yet on this device')}</div>`;
html+=`<div><b>Failed saves:</b> ${safe40(m.lastError||'None recorded on this device')}</div>`;
html+=`<div><b>Private cloud:</b> ${safe40(state.cloudStatus||'Unknown')}${state.cloudError?' — '+safe40(state.cloudError):''}</div>`;

<script id="fishos-v45-search-dashboard">

(function(){

 const labels={trips:'Trip',journal:'Journal',locations:'Water',rivers:'Water',flies:'Fly',destinations:'Destination',rods:'Rod',packing:'Packing',buy:'Purchase',knots:'Knot',species:'Species',fish:'Fish',trip_sessions:'Session'};
 window.search=function(query){
  const q=String(query??'').trim().toLowerCase(),box=document.getElementById('searchResults');if(!box)return;
  if(!q){box.classList.remove('show');box.innerHTML='';return;}
  const hits=[],seen=new Set();
  function add(type,title,page,content){
   const text=String(content??'').replace(/\s+/g,' ').trim(),at=text.toLowerCase().indexOf(q);if(at<0)return;
   const key=type+'|'+title+'|'+page;if(seen.has(key))return;seen.add(key);
   let from=Math.max(0,at-65);let excerpt=text.slice(from,from+250);if(from)excerpt='…'+excerpt.slice(0,249);if(from+250<text.length)excerpt=excerpt.slice(0,249)+'…';
   hits.push({type,title:String(title??'Untitled').slice(0,100),page,excerpt:excerpt.slice(0,250)});
  }
  function scan(value,kind='DATA',depth=0){
   if(value==null||depth>6||hits.length>=250)return;
   if(Array.isArray(value)){value.forEach((v,i)=>{
    if(typeof v==='string')add(labels[kind]||'Fish OS',v,routes[kind]||'research',v);

     const title=String(v.id||v.name||v.title||v.place||v.location||'Record '+(i+1));

   });return;}
   if(value&&typeof value==='object')Object.entries(value).forEach(([k,v])=>scan(v,k,depth+1));

 };

   save('FishOS_revision_history_'+stamp()+'.json',new Blob([JSON.stringify({format:'fishos-revision-history-v1',exported_at:new Date().toISOString(),revisions:all},null,2)],{type:'application/json'}));say('Downloaded '+all.length+' revisions. Keep this file private.');return;
  }
  const records=await c.from('fishos_user_data').select('data,updated_at').eq('user_id',uid).maybeSingle();
  if(records.error)throw records.error;
  if(!records.data?.data)throw Error('No private account data was returned.');
  const manifest=await c.from('fishos_files').select('id,bucket_id,path,original_name,mime_type,size_bytes,category,notes,created_at').eq('user_id',uid);
  if(manifest.error)throw manifest.error;
  const files=manifest.data||[];
  const prefix='FishOS_'+stamp();
  if(mode==='records'){
   say('Preparing full private record snapshot…');
   save(prefix+'_records_and_file_manifest.json',new Blob([JSON.stringify({format:'fishos-portable-backup-v1',exported_at:new Date().toISOString(),data_updated_at:records.data.updated_at,data:records.data.data,file_manifest:files,notice:'Uploaded file bytes must be downloaded separately with DOWNLOAD PRIVATE FILES.'},null,2)],{type:'application/json'}));
   say('Downloaded full private records and '+files.length+' file references. Use DOWNLOAD PRIVATE FILES for the actual media bytes.');return;
  }
  if(mode==='files'){
   say('Downloading '+files.length+' private file(s)… Browser may request permission for multiple downloads.');
   let downloaded=0;for(const f of files){const r=await c.storage.from(f.bucket_id||'fishos-private').download(f.path);if(r.error)throw r.error;const safeName=String(f.original_name||f.path.split('/').pop()||'file').replace(/[\\/:*?"<>|]/g,'_');save(prefix+'_'+String(downloaded+1).padStart(3,'0')+'_'+safeName,r.data);downloaded++;say('Downloaded '+downloaded+' of '+files.length+' files.');}
   say('Downloaded '+downloaded+' private file(s). Store alongside the records and manifest.');return;
  }
 }catch(e){say('Export error: '+(e.message||String(e)));}
 };
 const prior=window.render;window.render=function(...args){const result=prior.apply(this,args);build();backupCard();return result};setTimeout(()=>{build();backupCard()},150);
})();

const DATA={"version": "0.7", "system": "FISH OS", "project": "FLYS FOR FISH", "storage_note": "Seed/reference data. User-created browser records remain local until a real shared backend is connected.", "master_profile_text": "FISHING OS — USER CONTEXT / MASTER FISHING PROFILE\n\nUSER\n- 27-year-old male, Oregon.\n- Experienced fly fisherman, especially interested in predatory trout and steelhead.\n- Primary targets: Bull trout and large brown trout.\n- Secondary/high-priority targets: summer steelhead, tiger trout, big brook trout, trophy redbands, carp.\n- Wants factual, confident, well-cited fishing information.\n- Do not invent conditions, regulations, flows, weather, fish sizes, or historical data.\n- If data cannot be retrieved, explicitly say so.\n- User strongly prefers actual data and useful analysis over generic fishing advice.\n\nMASTER FISHING JOURNAL\nThe journal is intended to become a long-term angling database, not merely a trip diary.\n\nFor every trip, preserve:\n- Date\n- Waterbody\n- Exact/approximate location or named hole\n- Start/end time\n- Weather\n- Air temperature\n- Wind speed/direction\n- Cloud cover\n- Barometric pressure\n- Pressure trend\n- Moon phase/illumination\n- Sunrise/sunset\n- Rainfall\n- Days since measurable rain\n- River flow (cfs) where applicable\n- Flow trend\n- Water temperature where available\n- Water clarity\n- Tide for coastal fisheries\n- Fish seen\n- Fish landed\n- Fish lost\n- Approximate size\n- Species\n- Flies/lures\n- Presentation\n- Productive water\n- Wildlife/forage observations\n- Important behavioral observations\n- Lessons learned\n- Environmental/fishing correlations\n\nIMPORTANT:\nEnvironmental data should be retrieved from actual historical sources whenever possible. Do NOT fabricate or estimate historical weather, pressure, flow, rainfall, moon, or tide data and present it as observed data.\n\nPreferred environmental sources:\n- NOAA/NWS or reliable historical weather station data\n- USGS gauges for river flow and water temperature\n- NOAA tide data for coastal trips\n- Reliable astronomical data for moon phase/sunrise/sunset\n\nPreferred weather stations:\n- Nestucca: Hebo, Oregon\n- Metolius: Camp Sherman / nearest appropriate station\n- Upper Deschutes: La Pine / nearest appropriate station\n- East Lake/Diamond/Crane Prairie: nearest representative Central Oregon station\n- Imnaha: nearest appropriate station\n- Coastal fisheries: nearest representative coastal station\n\nSTEELHEAD TRACKING\nSteelhead are a major component of the journal.\n\nLower Deschutes:\n- 5-star personal goal: land a summer steelhead on the swing.\n- Track flows, recent rainfall, water temperature, timing, visibility, and fly/presentation.\n- Summer steelhead are a major priority.\n\nNestucca:\n- Track both summer and winter steelhead.\n- For every Nestucca entry, use Hebo weather.\n- Flow is considered particularly important.\n- Track recent rainfall and days since rain.\n- User specifically wants rainfall/flow incorporated into analysis.\n\nWilson:\n- Track winter and summer steelhead timing.\n- User will provide additional timing information later.\n\nTROUT PRIORITIES\n1. Bull trout — obsession / highest priority.\n2. Large brown trout — highest priority.\n3. Lower Deschutes summer steelhead — must land a summer fish on the swing.\n4. Huge tiger trout — 4-star priority.\n5. Big brook trout.\n6. Trophy redbands / Upper Klamath Basin.\n7. Carp.\n8. Winter steelhead.\n\nMAJOR OREGON FISHERIES OF INTEREST\n- Metolius River\n- Upper Deschutes / Cow Meadows\n- Crane Prairie Reservoir\n- Wickiup Reservoir\n- East Lake\n- Diamond Lake\n- Lake Billy Chinook\n- Lower Deschutes\n- Nestucca River\n- Wilson River\n- Upper Klamath Lake\n- Williamson River\n- Sprague River\n- Imnaha River\n- Wallowa River\n- Grande Ronde\n- Sauvie Island / Crane Lake\n- Oregon coastal jetty/rock fisheries\n\nMETOLIUS\n- User considers the Metolius a primary bull trout fishery.\n- River is spring-fed, extremely clear, and generally very stable.\n- User frequently fishes specific named locations including:\n  - Dolly Hole\n  - Pokenny Hole\n  - Aquarium Hole\n  - Lower Bridge / Bridge 99\n  - Long Jams\n  - Tailouts\n- User wants to investigate upper-river fishing immediately before seasonal closure, especially October, because of large lake-run bull trout moving upstream to spawn.\n- Big articulated streamers are extremely important.\n- User has repeatedly observed bull trout reacting to large white streamers.\n- User has learned that 10–12+ inch streamers can move fish that smaller 4–6 inch flies do not.\n- User has observed bull trout attacking hooked whitefish/trout.\n- User has observed bull trout attacking other hooked bull trout.\n- Important hypothesis to track: bull trout may respond strongly to streamers that dead-drift, stall, or contact the bottom rather than only actively swung/stripped flies.\n- User has observed major short feeding windows rather than continuous activity.\n- Tailouts may contain many bull trout at certain times, particularly around evening/night, then appear empty later.\n- User wants environmental conditions correlated with these behavioral observations.\n\nIMPORTANT METOLIUS JOURNAL OBSERVATIONS\nApril 8, 2024:\n- User considers this one of his best bull trout days and the day he \"cracked the code.\"\n- Caught multiple bulls.\n- Used huge ~12-inch articulated, often white flies.\n- Several big fish.\n- Saw fish chasing other fish.\n- Caught whitefish and had bull trout remain nearby and attack a streamer.\n- User believes 4–6 inch flies often fail to move the biggest fish.\n- This pattern has been difficult to reproduce and appears rare.\n\nMay 14, 2026:\n- Fished Metolius briefly.\n- Hooked whitefish in Dolly Hole.\n- Large bull immediately ate/attacked the whitefish.\n- Bull went extremely deep into euro rod backing.\n- User had to enter water to clear snags.\n- Ultimately landed the bull.\n- Around 7:30 PM.\n- No other whitefish sign noted.\n\nMay 26, 2026:\n- Fished roughly 2 PM–9 PM.\n- Water crystal clear / normal Metolius conditions.\n- Pokenny: saw at least two bulls; one repeatedly attempted to eat small rainbows user was catching.\n- Dolly Hole: no sign initially until whitefish was hooked.\n- ~4:20 PM caught a decent fish on euro setup with heavy jig Lunch Money streamer.\n- Shortly afterward caught ~16-inch fish on switch rod with indicator and golden stone.\n- Fished hard until dark.\n- Around 8:50 PM caught a massive bull in deep tailout on a swung fly.\n- Fish made multiple hard upstream runs.\n- Barely fit in Fishpond Mid-Length net; estimated >35 inches / 3x net basket length (size estimate uncertain).\n- This was NOT a sighting; it was a landed fish.\n- Important: user corrected earlier misunderstanding that this was a \"giant sighting.\"\n\nJune 15, 2025:\n- Pokenny Hole: bull around 18–20 inches at 9:44 AM.\n\nJune 16, 2025:\n- Dolly Hole: brown trout around 18 inches on a nymph.\n- Pokenny: bull around 22 inches at 6:55 AM.\n- Roadside deep bucket near campground pull-off: bull around 24 inches at 9:08 AM.\n- Saw golden stones on branches.\n\nJuly 5, 2025:\n- Around 9:27 PM caught a thick bull around 24 inches immediately below lower bridge.\n- 12+ inch yellow/white brush streamer.\n- Also caught a brown trout.\n\nSeptember 2025 Metolius:\n- September 23: very productive day, lots of fish/running.\n- Large colored-up trout estimated 25+ inches near Lake Creek.\n- Another smaller bull upper river around 1:47 PM.\n- September 24: bull around 20 inches in Long Jams below Dolly Hole around 10:48 PM.\n- Another afternoon session with Michael produced several rainbows.\n- User snapped rod.\n\nJuly 11, 2026:\n- Started ~5 PM.\n- Checked upstream spot without success, then Dolly Hole by ~5:30 PM.\n- Fished until ~1 hour after sunset (~9:51 PM).\n- Bull #1: 7:11 PM, 10-inch white streamer / red-wire \"Bully\" contraption.\n- Bull #2: 7:53 PM, basic white-on-white Dolly Llama.\n- Lost another small bull after another bull attacked it.\n- Strong bull frenzy roughly 7–8 PM.\n- Activity then died.\n- Walked to tailout and saw many bull trout eyes; described it as insane.\n- Next day saw no bull trout in lower tailout.\n- Possible otter observed rising.\n\nJuly 12, 2026:\n- Dolly Hole ~4:30–6:45 AM: one small bull on streamer, otherwise quiet.\n- Pokenny: moved one bull but no eat.\n- Lower Bridge: fished until around noon; no fish seen.\n- Aquarium Hole with Chase: moved fish; caught whitefish on nymph, followed by bull trout.\n- Dolly Hole ~6:30–10 PM: very slow, one bull observed.\n- Repeatedly saw a fish porpoising in same location.\n- Other anglers believed these were Chinook.\n- Another scarred fish with white patches was also believed to be Chinook.\n- User suspects a pair of Chinook may have been present.\n- Baby black bear observed.\n- Dolly tailout had no visible bull eyes, unusual compared with previous evening.\n\nJuly 14, 2026:\n- Dolly Hole ~9 AM–noon: no fish.\n- Around noon Bridge 99: Chase caught ~12-inch bull on spinner with minnow attached.\n- Pokenny around 3 PM: caught a couple rainbows, no big bull.\n- Aquarium Hole ~7–10 PM: caught two bulls, ~20 and ~18 inches.\n- Both on large white streamer in far tailout.\n\nJuly 15, 2026:\n- Dolly Hole ~5:30 AM–1 PM.\n- Around 6 AM: ~16-inch tagged bull on swung Sparkle Minnow.\n- Hooked a substantially larger bull on switch rod indicator with small caddis Perdigon; fish made hard run and broke off.\n- Saw many fish in tailout in morning.\n- Fish seemed to move forward into hole as morning progressed, while some remained deep/far tailout under logs.\n- Around 10:20 AM activity suddenly increased for ~30 minutes.\n- Hooked approximately seven bull trout.\n- Landed three.\n- Largest approximately 27 inches.\n- A ~20-inch bull ate large white streamer; larger bull attacked it and both were hooked briefly before smaller fish came off.\n- Alternated 12–14 inch white streamer and 15-inch olive streamer.\n- Olive generated interest from two fish.\n- User believes hooks are too large and contributed to losses.\n- Important observation: bull trout repeatedly showed willingness to attack streamer when it was dead-drifted or even snagged on bottom.\n- Fish could appear from nowhere to eat a fly resting near bottom.\n- User wants to determine better presentation.\n- Fished holes below Dolly with large white streamer and got no eats.\n- Lower Bridge ~2:30–3:30 PM: no bulls on large white streamer.\n\nUPPER DESCHUTES / COW MEADOWS\nMay 24, 2026:\n- Fished Cow Meadows.\n- Large brook trout present.\n- Landed one easy ~18-inch brook trout.\n- Jig streamer, Sparkle Minnow / minnow color, worked in logs and undercuts.\n- Many looks/eats.\n- Estimated ~20 fish landed in ~4 hours.\n- Unclear whether any were rainbows.\n- Floated lake in pontoon in morning; okay fishing.\n- Spooked many fish.\n- Could not initially find deep water; fish were holding in weeds.\n- Caught one while stripping a leech sight-fishing to a decent brook trout.\n- User believes there are large brook trout moving toward Cow Meadows.\n- User has interest in timing these fish around late summer/fall.\n\nJune/July 2025:\n- July 6, 2025: Three Creeks Lake with Michael and Grace. Caught several brookies and rainbows. Decent day. Tons of mosquitoes, mostly not on water.\n\nSeptember 8, 2025:\n- Cow Meadows / Upper Deschutes.\n- One of user's first times there.\n- Very good brook trout fishing.\n- Euro rig with jig white baitfish pattern and ~4.5 mm orange hot-head bead.\n- Many brook trout, average ~11 inches.\n- One nice rainbow ~18 inches.\n- Weather sunny and warm.\n\nLAKE BILLY CHINook\nApril 26, 2026:\n- Tried stripping flies and bobbers in lake; no bulls.\n- Went up Deschutes Arm.\n- Saw many suckers.\n- Caught several rainbows, one brown, and one bull around 17 inches.\n- Bull caught ~10:50 AM.\n\nSAUVIE ISLAND / CARP\nMay 11, 2026:\n- Crane Lake, Sauvie Island.\n- Landed 3 carp.\n- Tons of activity.\n- Orange woolly-bugger-like fly.\n- Fly had no hackle and may have been craw-style.\n\nJune 1, 2026:\n- Sauvie Island carp.\n- Much less activity than previous outing.\n- Saw only a few fish.\n- Zero hookups / approximately one real shot.\n- User wants weather, pressure, moon phase, temperature and environmental data tracked for every carp trip.\n\nNESTUCCA\nJune 30, 2026:\n- Wade fishing.\n- Started ~11:30 AM.\n- Mostly walked and threw spinners.\n- Lower river.\n- Pink #2 Blue Fox spinner.\n- Moved one jack (~20\").\n- Landed at least 10 coastal cutthroat.\n- Little/no wind, overcast.\n- Big corner hole on lower river below bridge produced steelhead.\n- Saw approximately five or more bright steelhead.\n- Fish interested in spinner after ~1 hour.\n- Lost one immediately on hookset with pink #2.\n- Changed to blue #3 Blue Fox.\n- Landed one steelhead at 6:18 PM.\n- 29 inches, 14.5-inch girth.\n- Approximate weight should be calculated using an appropriate steelhead length/girth formula, with uncertainty clearly stated.\n- Continued until ~7:30 PM.\n- No additional fish.\n- Checked \"Newt Hole\" on way out with same spinner, no action.\n- IMPORTANT: Use Hebo weather for Nestucca.\n- Track river flow and recent rainfall because user believes they are critical for coastal steelhead.\n\nJuly 4, 2026:\n- Approximately 9 AM–6 PM.\n- Covered lots of water on foot.\n- Mainly spinners.\n- Lower river: only one steelhead observed.\n- Above CJ's Hole: saw ~3 steelhead and one Chinook.\n- Landed one Chinook on spinner.\n- User wants flow and recent rainfall tracked for this fishery.\n- \"Big Corner Hole\" below bridge is an unnamed location; user may want to name it later.\n\nIMNAHA / WALLOWA\nSeptember 17–18, 2025:\n- Fished Imnaha River for bull trout.\n- Blue Hole.\n- Bull trout fishing was very hot.\n- Many bulls.\n- Several 26+ inch fish.\n- Fish appeared strongly associated with spawning activity.\n- Trip occurred under overcast conditions.\n- User wants to return despite distance and somewhat rough logistics.\n- September 17 fished Wallowa River while driving over.\n- Did well on rainbow trout.\n\nBIG HORN RIVER\nSeptember 20, 2025:\n- Rented boat and floated Bighorn River.\n- Very good day.\n- Many rainbows and a few nice browns.\n- Jerk-stripping a leech over weed beds was highly effective on rainbows.\n- User was primarily targeting browns.\n- Include this in destination/travel fishing journal.\n\nBELIZE\nMarch 21–April 1, 2025:\n- Belize / Caye Caulker area.\n- Overall trip was great; fishing was lackluster.\n- Lost ~30 lb tarpon at boat.\n- Caught a few small bonefish.\n- Missed permit.\n- Saw/missed opportunity at pair of 150+ lb tarpon crushing flats.\n- User considers this an important missed-opportunity trip.\n- Future Belize/Caye Caulker trip is a major travel fishing interest.\n\nBAJA / LA PAZ\nApril 3–8, 2026:\n- Six days fishing around La Paz, Mexico.\n- Landed approximately 50 roosterfish.\n- User's largest rooster approximately 20 lb.\n- Friend/buddy landed approximately 55–60 lb rooster.\n- 30 lb fluorocarbon straight through was considered key.\n- Many pelicans.\n- Needlefish bait was a major issue on at least one day.\n- Large jacks: three very large jacks landed/encountered.\n- One skipjack tuna.\n- Buddy caught one mahi.\n- User saw only one mahi.\n- Many triggerfish.\n- Saw bonefish.\n- Heard rumors of permit.\n- User knows region also has tuna, amberjack, golden trevally, etc.\n- Trip coincided with a busy Mexican holiday weekend.\n- Roosterfish beaches were very busy, which user believes hurt fishing.\n- User observed from social media that larger roosterfish activity increased substantially after departure, along with mahi activity.\n- User suspects trip was slightly before peak big-rooster activity.\n- User may add more detailed Baja notes later.\n\nCOASTAL JETTY / ROCKFISH\nJune 16, 2026:\n- Fished jetty most of day, approximately 8 AM–4 PM.\n- Fishing initially slow.\n- One fish right away, then several-hour lull.\n- Activity increased when tide began coming in.\n- Need to retrieve exact high tide from correct NOAA tide station once jetty is identified.\n- Caught quite a few rockfish on white/chartreuse Clouser.\n- Most were extremely small, around 4 inches.\n- User had never seen such a concentration of tiny rockfish before.\n- Tide appeared strongly related to increased activity.\n- User wants coastal environmental data tracked including tide, swell, wind, pressure, weather, etc.\n- Exact jetty location needs to be confirmed.\n\nFISHING JOURNAL PHILOSOPHY\nThe journal should eventually allow analysis such as:\n- Best Metolius bull trout flows\n- Best Metolius feeding windows by season/time\n- Bull trout response to pressure/weather/moon\n- Nestucca steelhead success vs flow and rainfall\n- Best steelhead conditions\n- Brown trout seasonal movement\n- Fly/presentation success\n- Fish size vs environmental conditions\n- Repeatability of feeding windows\n- Which conditions produce trophy fish\n- \"Where should I fish this week?\" recommendations based on user's own historical data plus current conditions\n\nDo not overstate causation. Distinguish:\n- Observed fact\n- Retrieved environmental data\n- Strong inference\n- Hypothesis\n- Speculation\n\nFISHING SCHEDULE / PRIORITIES\nAnnual schedule is intended to be WEEKLY, with:\n- Primary fishery\n- Backup fishery that is on the route home or only a slight detour\n- Other options\n- Star rating\n- Trophy potential\n- Personal priority\n\nImportant recurring priorities:\n- Winter/summer steelhead on Oregon coastal rivers\n- Metolius bull trout\n- Upper Deschutes/Cow Meadows brook trout\n- East Lake trophy browns\n- Diamond Lake trophy browns\n- Lake Billy Chinook bull trout\n- Lower Deschutes summer steelhead\n- Upper Klamath and tributaries\n- Fall Montana fishing\n- April Baja\n- May Belize/Caye Caulker\n- August Alaska\n\nTRAVEL FISHING\n- Alaska August 2026: Katmai Trophy Lodge trip planned/paid, likely Aug 8–15.\n- Goals: coho on fly, char/Dolly, Arctic char, very large rainbows (25+ goal).\n- Less interested in pink/chum/sockeye.\n- Wants manageable float trips; experienced but somewhat rusty.\n- Grandfather less mobile and prefers gear fishing.\n- Montana fall trip is a major future priority.\n- Baja in April.\n- Belize/Caye Caulker in May.\n\nOREGON REGULATIONS\n- User has uploaded:\n  - 2025–2026 fishing regulations PDF\n  - Oregon Fishing Regulations 2026 PDF\n- These should be consulted for current regulations, closures, seasons, species rules, etc.\n- User specifically wants Upper Metolius closure dates verified from the 2026 ODFW regulations.\n- User believes Upper Deschutes closes September 30 and wants this confirmed before planning.\n- Do not rely on memory for regulations when uploaded official regulations are available.\n\nUPLOADED REFERENCE MATERIALS\n- 2025–2026 fishing regulations.pdf\n- Oregon Fishing Regs 2026.pdf\n- Sankovich_2020_ImnahaRiverWeir_2019annualreportl.pdf\n- Fly fishing (for AI) 6-15.pdf\n- onX markups GPX from 2026-05-04 (contains user fishing locations/markups; use if accessible)\n\nSTYLE FOR FISHING OS\n- Direct.\n- Factual.\n- Confident when evidence supports confidence.\n- Cite sources.\n- No generic filler.\n- No pretending to have retrieved data.\n- If an environmental value is unavailable, say \"not retrieved\" or \"unavailable.\"\n- User wants useful insights, not repeated summaries.\n- When analyzing a fishing trip, prioritize actionable patterns and explain confidence.\n- User wants environmental data automatically attached to every new journal entry.\n- Historical trips should be backfilled in chronological order when reliable archived data can be retrieved.\n- Do not repeatedly ask whether to proceed with the backfill; proceed when tools/data allow.", "priority_species": ["Bull trout", "Large brown trout", "Summer steelhead", "Tiger trout", "Big brook trout", "Trophy redband", "Carp", "Winter steelhead"], "locations": [{"name": "Metol e lake. Alternating currents with small wells. Extraordinary setting.\nKrimmler Ache- Located in the Salzburg region above Europe's highest waterfalls, offering incredible high-altitude scenery. one of the most beautiful fishing spots on the continent, is located above the highest waterfalls in Europe. With restricted access.\nSalza River-Famous for wild brown trout and grayling in a stunning, natural valley setting. only fishing at the beginning of the season or the end of September and October.\nStubach River: river with a great variety of species.\nTraun River- A historic and legendary European fly-fishing destination with technical, clear-water currents.\nYbbs River- Renowned for clear waters and well-managed stretches with dedicated fishing hospitality.\nLakes: Lenisee, Elizabethsee, Hollersbachsee, Hintersee..\nRegulations and Licensing\nPrivate Waters: Almost all rivers in Austria are privately owned or managed; open public access is rare.\nPermits: You need both a state/regional guest fishing card (Gästefischereikarte) and a specific day or stretch ticket (Revierbezirk).\nStay & Fish: Many top-tier fishing hotels (such as those around Mittersill or the Ybbs valley) bundle permits exclusively for their guests.\nTechnique Rules: Most waters enforce strict catch-and-release or single barbless hook policies to protect native stocks"},{"country":"Azerbaijan","regions":["possible not likely","Salmo Trutta Caspius","Religion: Predominantly Shia Muslim (97.3%"],"notes":"possible not likely\nSalmo Trutta Caspius\nAzerbaijan's borders, and its separate exclave, Nakhchivan Autonomous Republic , which is geographically cut off by Armenia, creating two distinct parts of Azerbaijan\nCapital: Baku. Official Language: Azerbaijani\n Religion: Predominantly Shia Muslim (97.3%"},{"country":"Bahamas","regions":["Bonefish"],"notes":"Bonefish"},{"country":"Bahrain","regions":[],"notes":"bust: overfished/ Hot & hot water\n\n\nThe smallest country in the Middle East, Bahrain island tion of about 550,000 people, and its capital city is Praia on Santiago Island \nLarge Ocean Sportfish: massive Blue Marlin, Yellowfin Tuna, and Wahoo \n“Cape Verde is not a traditional flat-water fly-fishing destination due to the lack of shallow flats and strong trade winds. However, adventurous anglers can experience exciting shore and rock-and-surf fly fishing for pelagics like bonito, blue runners, amberjack, and triggerfish “"},{"country":"Cambodia","regions":["snakeheads"],"notes":"snakeheads"},{"country":"Cameroon","regions":["Gassa Camp on the Faro River"],"notes":"Gassa Camp on the Faro River\nNile Perch: Massive freshwater trophies weighing anywhere from 10 to over 200 lbs, targeted primarily during specialized night-fishing sessions.\nAfrican Tigerfish: Fierce, toothy predators offering aggressive daytime sport.\nYellowfish (Niger Barb): Found in smaller class sizes, providing technical daytime fly action"},{"country":"Canada","regions":[],"notes":"Trout, like, steelhead, salmon, char,"},{"country":"Central African Republic","regions":[],"notes":""},{"country":"Chad","regions":[],"notes":"Bust: dry. Lake Chad drying"},{"country":"Chile","regions":[],"notes":""},{"country":"China","regions":[],"notes":""},{"country":"Colombia","regions":[],"notes":""},{"country":"Comoros","regions":[],"notes":"Maybe GT- Looks like a BUST\n641 to 719 square miles, making it one of the smallest and most densely populated countries in Africa \nVolcanic archipelago off Africa’s east coast, in the warm Indian Ocean waters of the Mozambique Channel. largest island, Grande Comore (Ngazidja) is ringed by beaches and old lava from active Mt. Karthala volcano. the capital, Moroni\nhttps://www.fishingworldguide.com/en/blog/fishing-in-comoros"},{"country":"Congo (Republic of the)","regions":[],"notes":""},{"country":"Congo (Democratic Republic of the)","regions":[],"notes":""},{"country":"Cook Islands","regions":["Manihiki","Rakahanga","Rarotonga","Atiu","Mitiaro","Mauke","Manuae","T function home(){let today=new Date();let upcoming=(DATA.trips||[]).filter(t=>tripStatus(t,today)!=='Completed').sort((a,b)=>tripDate(a.date).localeCompare(tripDate(b.date)));let next=upcoming[0];let nextTitle=next?next.id:'No upcoming trip';let nextMeta=next?`${next.date} • ${next.place||next.location||''}`:'Add a future trip with Quick Add';return `<div class="hero"><div><div class="eyebrow">PRIVATE FISHING COMMAND CENTER</div><h1>FISH OS</h1><p>A wormhole into the entire FLYS FOR FISH world: trips, fish, waters, flies, gear, research and future destinations.</p></div><button class="btn gold" onclick="quick()">+ QUICK ADD</button></div><div class="stats dashstats">${[['14','Trips','trips'],['31','Days fished','journal'],['128','Hours fished','journal'],['1,940','Miles','trips'],['67','Fish logged','journal'],['55','Species caught','fish-list'],['24','Waters','locations']].map(a=>`<div class="stat link" onclick="go('${a[2]}')"><b>${a[0]}</b><span>${a[1]}</span></div>`).join('')}</div><div class="dashboard-next"><div><div class="kicker">NEXT TRIP / TIME AWARE</div><h2>${esc(nextTitle)}</h2><p>${esc(nextMeta)} • ${next?tripStatus(next):'No future trip'}</p></div><div><button class="btn gold" onclick="go('${next?`trip-${slug(next.id)}`:'trips'}')">OPEN</button> <button class="btn" onclick="go('calendar')">CALENDAR</button></div></div><div class="dashsection" style="margin-top:14px">${doors([{k:'GOAL',t:'Summer Steelhead',d:'Lower Deschutes swing program and coastal Oregon steelhead.',page:'journal'},{k:'RESEARCH',t:'World Destination Atlas',d:'Country-by-country fly fishing research, operators and links.',page:'destinations'},{k:'SPECIES',t:'Fly-Rod Fish List',d:'Common and semi-common sport fish with custom tracking.',page:'fish-list'},{k:'GEAR',t:'Rod Vault',d:'18-rod inventory with reel, line, purpose, species and price.',page:'gear'},{k:'FIELD',t:'Wickiup Brown Trout',d:'Spring arm observations, streamer window, eggs and bank-hugging big fish.',page:'location-wicki function dateParts(v){let raw=String(v||'').replace(/[–—]/g,'-').trim();let y=(raw.match(/20\d{2}/)||[])[0]||String(new Date().getFullYear());let months={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};let m=raw.match(/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+(\d{1,2})/i);if(!m)return null;let month=months[m[1].slice(0,3).toLowerCase()];let r=raw.match(/(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{1,2}\s*-\s*(\d{1,2})/i);let end=r?Number(r[1]):Number(m[2]);return {start:`${y}-${String(month).padStart(2,'0')}-${String(Number(m[2])).padStart(2,'0')}`,end:`${y}-${String(month).padStart(2,'0')}-${String(end).padStart(2,'0')}`}}
function tripDate(v){let d=dateParts(v);return d?d.start:'9999-12-31'}
function tripEndDate(v){let d=dateParts(v);return d?d.end:tripDate(v)}
function tripStatus(t,now=new Date()){let start=tripDate(t.date),end=tripEndDate(t.date),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),s=new Date(start+'T00:00:00'),e=new Date(end+'T23:59:59');if(today<s)return 'Upcoming';if(today<=e)return 'Active';return 'Completed'}

}
function initFishMap(){

  el.dataset.ready='1';
  const pts=[
    ['Wickiup',43.678869,-121.732449,'location-wickiup'],
    ['Metolius',44.555950,-121.620612,'location-metolius'],
    ['Upper Nestucca',45.220,-123.585,'location-upper-nestucca'],
    ['Katmai',58.65,-156.58,'trip-katmai'],
    ['Bighorn',45.319682,-107.910387,'location-bighorn-river'],
    ['Baja / La Paz',24.14231,-110.31316,'destination-baja-mexico']
  ];
  const map=L.map(el,{scrollWheelZoom:true,zoomControl:true,worldCopyJump:true}).setView([43,-118],4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
  const fishIcon=L.divIcon({className:'fish-pin',html:'<div style="width:14px;height:14px;background:#ff5b00;border:2px solid #7d2500;box-shadow:1px 1px 0 #fff"></div>',iconSize:[14,14],iconAnchor:[7,7]});
  pts.forEach(p=>L.marker([p[1],p[2]],{icon:fishIcon}).addTo(map).bindPopup(`<b>${esc(p[0])}</b><br>${p[1].toFixed(5)}, ${p[2].toFixed(5)}<br><button class="btn" style="margin-top:5px;padding:3px 6px" onclick="go('${p[3]}')">OPEN</button>`));
  const bounds=L.latLngBounds(pts.map(p=>[p[1],p[2]]));
  if(kind==='maps') map.fitBounds(bounds.pad(.18));
  setTimeout(()=>map.invalidateSize(),150);
  window.fishMap=map;
}
function trips(){let ts=(DATA.trips||[]).map((x,i)=>({title:x.id||x.name||x.title||`Trip ${i+1}`,meta:[x.place||x.location,x.date,tripStatus(x),x.targets?.join(', ')].filter(Boolean).join(' • '),raw:x}));return shell('Trips','Every trip becomes a workspace with field log, journal, fish, media, gear, flies and research connections.',`<div class="toolbar"><button class="btn gold" onclick="quick('trip')">+ Trip</button><button class="btn" onclick="go('calendar')">Calendar</button><button class="btn" onclick="go('packing')">Packing</button></div>${list(ts,(i)=>`go('trip-${slug(ts[i].raw.id||ts[i].title)}')`)}`)}

function fishList(){let custom=state.fishCustom||[];let groups=Object.entries(FISH_CATALOG).map(([g,items])=>[g,[...items,...custom.filter(x=>x.group===g).map(x=>x.name)]]);if(custom.filter(x=>!FISH_CATALOG[x.group]).length)groups.push(['Custom',custom.filter(x=>!FISH_CATALOG[x.group]).map(x=>x.name)]);let all=groups.flatMap(g=>g[1]);let caught=all.filter(x=>(state.fishCaught||[]).includes(x)).length;return shell('Fish List','Fly-rod sport fish database — track caught, target, and custom species.',`<div class="stats"><div class="stat"><b>${caught}</b><span>Caught</span></div><div class="stat"><b>${all.length}</b><span>Total species</span></div><div class="stat"><b>${all.length-caught}</b><span>Targets / unmarked</span></div></div><div class="toolbar" style="margin-top:14px"><button class="btn gold" onclick="addFish()">+ Add species</button><button class="btn" onclick="go('journal')">Journal</button></div><div class="grid g2" style="margin-top:14px">${groups.map(([g,items])=>`<div class="card"><h3>${esc(g)}</h3><div class="fishgrid">${items.map(x=>{let c=(state.fishCaught||[]).includes(x);return `<label class="fishrow"><input type="checkbox" ${c?'checked':''} onchange="toggleFish('${esc(x).replace(/'/g,"\\'")}')"><span>${esc(x)}</span><em>${c?'CAUGHT':'TARGET'}</em></label>`}).join('')}</div></div>`).join('')}</div>`) }
function addFish(){let name=prompt('Species name');if(!name)return;let group=prompt('Category (use an existing category or Custom)','Custom')||'Custom';state.fishCustom.push({name:name.trim(),group:group.trim()});localStorage.setItem('fishos_fish_custom',JSON.stringify(state.fishCustom));render()}
function toggleFish(name){let i=state.fishCaught.indexOf(name);if(i>=0)state.fishCaught.splice(i,1);else state.fishCaught.push(name);localStorage.setItem('fishos_fish_caught',JSON.stringify(state.fishCaught));render()}

function slug(x){return x.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function speciesStatus(x){let yes=['Brown trout','Rainbow trout','Cutthroat','Bull trout','Brook trout','Dolly Varden','Steelhead','Coho','Chinook','Chum salmon','Sockeye','Kokanee','Pink','Smallmouth bass','Northern Pike','Sunfish','Snook','Bonefish','Tarpon','Jack','Horse Eye Jack','Roosterfish','Skipjack Tuna','Needle Fish','Barracuda'];return yes.includes(x)?'CAUGHT':'TARGET'}
function speciesDetail(name){let pretty=name.replace(/^species-/,'').replace(/-/g,' ');pretty=pretty.split(' ').map(x=>x?x[0].toUpperCase()+x.slice(1):x).join(' ');let notes={"steelhead":'Oncorhynchus mykiss irideus • caught in Oregon. Wet fly / swing notes: downstream 45°, broadside presentation, 12–16 lb leader not shy, 5–10 ft sink tip notes.',"brown trout":'High priority. Wickiup: large fish close to bank in ~1 ft water; streamer produced a 24+ inch fish in the short morning window; egg/bobber presentation is a current thought.',"bull trout":'High priority. Metolius is a key water; Wenaha, Lostine, McKenzie, Clackamas and Bumping Lake are also tracked.'};return shell(pretty,'Species record with catches, locations, flies, tactics and research.',`<div class="grid g3"><div class="card"><h3>Status</h3><span class="tag gold">${speciesStatus(pretty)}</span><p class="muted">Species family / scientific name fields can be expanded as the tracker is normalized.</p></div><div class="card"><h3>Connected waters</h3>${list((pretty.toLowerCase()==='steelhead'?['Nestucca River','Wilson River','Grande Ronde','Lower Deschutes']:pretty.toLowerCase()==='brown trout'?['Wickiup','Lake Paulina','East Lake','Crane Prairie?','Tree Creek Lake']:['Oregon','Alaska','Montana']).map(x=>({title:x})),i=>`go('location-${slug(pretty)}-${i}')`)}</div><div class="card"><h3>Connected flies</h3>${list((pretty.toLowerCase()==='bull trout'?['Warpath Tomahawk','Plante’s Misdemeanor','Baby Got Bead','Heisenberg','Hawkins Hat Trick']:['Streamers','Egg patterns','Dry flies']).map(x=>({title:x})),i=>`go('fly-${slug(pretty)}-${i}')`)}</div></div><div class="card" style="margin-top:14px"><h3>Field notes</h3><p>${esc(notes[pretty.toLowerCase()]||'No detailed species note has been normalized yet. The raw master tracker remains the source record.')}</p></div>`)}
function locations(){let ls=['Wickiup','Metolius','Upper Nestucca','Lower Deschutes','Bighorn River','Big Spring Creek','Lake Paulina','East Lake','Bumping Lake','Moraine','Brooks','Margot Creek'];return shell('Locations','Waters are hubs: trips, conditions, fish, flies, gear, photos, video, research and maps all connect here.',`<div class="split"><div>${list(ls.map(x=>({title:x,meta:'Water workspace'})),i=>`go('location-${slug(ls[i])}')`)}</div><div class="map"><i class="pin a"></i><i class="pin b"></i><i class="pin c"></i><i class="pin d"></i></div></div>`)}
function locationDetail(n){let p=n.replace(/^location-/,'').replace(/-/g,' ');p=p.replace(/\b\w/g,c=>c.toUpperCase());let w=p.toLowerCase().includes('wickiup');return shell(p,'Location hub — every related record lives one click away.',`<div class="grid g4">${doors([{k:'TRIPS',t:'Trips here',d:'Open trip records connected to this water.',page:'trips'},{k:'FISH',t:'Fish here',d:'Species, size and catch records.',page:'journal-fish'},{k:'FLIES',t:'Flies here',d:'Patterns and tactics that worked.',page:'fly-tying'},{k:'RESEARCH',t:'Research',d:'Notes, links and maps.',page:'research'}])}</div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Field notes</h3><p>${w?'Hundreds of fish stacked into a spring-fed arm. Low water and murky spring influence. Big browns close to the bank; 12–22 inch browns farther out. Streamer produced a 24+ brown and a large rainbow in a short morning window. Egg patterns were the most consistent general success.':'Location-specific notes are ready for expansion from the master research archive.'}</p></div><div class="card"><h3>Open connections</h3><button class="btn" onclick="go('maps')">Map</button> <button class="btn" onclick="go('calendar')">Season</button> <button class="btn" onclick="go('gear')">Gear</button></div></div>`)}
function googleCalendarUrl(ev){let start=ev.start||ev.date||localISO(new Date()),end=ev.end||start;if(/^\d{4}-\d{2}-\d{2}$/.test(start))start=start.replace(/-/g,'')+'T090000';if(/^\d{4}-\d{2}-\d{2}$/.test(end)){let d=new Date(end+'T00:00:00');d.setDate(d.getDate()+1);end=localISO(d).replace(/-/g,'')+'T090000'}return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(ev.title||'Fish OS event')+'&dates='+encodeURIComponent(start.replace(/:/g,'')+'Z/'+end.replace(/:/g,'')+'Z')+'&details='+encodeURIComponent(ev.notes||'Fish OS')+'&location='+encodeURIComponent(ev.location||'')}

function addCalendarEntry(){let title=prompt('Calendar entry title');if(!title)return;let date=prompt('Date (YYYY-MM-DD)',localISO(new Date()));if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return alert('Use YYYY-MM-DD.');let end=prompt('End date (YYYY-MM-DD, optional)',date)||date;let location=prompt('Location (optional)')||'',notes=prompt('Notes (optional)')||'';DATA.calendar_entries=calendarEntries();DATA.calendar_entries.push({id:'cal-'+Date.now(),title,date,end,location,notes});persist();render()}
function calendarInfo(id){let e=calendarEntries().find(x=>x.id===id);if(!e)return;if(confirm(e.title+'\n'+e.date+(e.location?'\n'+e.location:'')+'\n\nOpen in Google Calendar?'))window.open(googleCalendarUrl(e),'_blank')}
function calendar(){let now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),lead=first.getDay(),todayISO=localISO(now),cells=[],entries=calendarEntries();for(let i=0;i<lead;i++)cells.push('<div class="calcell"></div>');for(let d=1;d<=days;d++){let date=new Date(y,m,d),iso=localISO(date),dayTrips=(DATA.trips||[]).filter(t=>iso>=tripDate(t.date)&&iso<=tripEndDate(t.date)),dayEvents=entries.filter(e=>e.date===iso||(e.end&&iso>=e.date&&iso<=e.end)),cls=iso===todayISO?'today':iso<todayISO?'pastday':'futureday';cells.push(`<div class="calcell ${cls}"><b>${d}</b>${dayTrips.map(t=>{let st=tripStatus(t,now);return `<button class="event ${st==='Completed'?'past':st==='Active'?'today':'future'}" onclick="go('trip-${slug(t.id)}')">${esc(t.id)}</button>`}).join('')}${dayEvents.map(e=>`<button class="event future" onclick="calendarInfo('${esc(e.id)}')">${esc(e.title)}</button>`).join('')}</div>`)}while(cells.length%7)cells.push('<div class="calcell"></div>');let upcoming=(DATA.trips||[]).filter(t=>tripStatus(t,now)!=='Completed').sort((a,b)=>tripDate(a.date).localeCompare(tripDate(b.date))),custom=entries.filter(e=>e.date>=todayISO).sort((a,b)=>a.date.localeCompare(b.date));return shell('Live Calendar',`Real-time calendar • ${now.toLocaleDateString(undefined,{month:'long',year:'numeric'})}`,`<div class="notice"><b>Now:</b> <span id="calendarNow">${now.toLocaleString()}</span> • <b>Clock:</b> live • Trip status uses the current date.</div><div class="caltools"><button class="btn gold" onclick="addCalendarEntry()">+ Calendar Entry</button><button class="btn" onclick="go('calendar-help')">Google Calendar</button></div><div class="calendar" style="margin-top:12px">${['SUN','MON','TUE','WED','THU','FRI','SAT'].map(x=>`<div class="calhead">${x}</div>`).join('')}${cells.join('')}</div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Upcoming / Active Trips</h3>${upcoming.length?list(upcoming.map(t=>({title:t.id,meta:`${t.date} • ${tripStatus(t,now)} • ${t.place||t.region||''}`})),i=>`go('trip-${slug(upcoming[i].id)}')`):'<div class="empty">No future trips currently stored.</div>'}</div><div class="card"><h3>Calendar Entries</h3>${custom.length?custom.map(e=>`<div class="row"><div><div class="title">${esc(e.title)}</div><div class="meta">${esc(e.date)}${e.location?' • '+esc(e.location):''}</div></div><button class="gcal" onclick='window.open(googleCalendarUrl(${JSON.stringify(e)}),"_blank")'>GOOGLE CAL</button></div>`).join(''):'<div class="empty">No custom calendar entries yet.</div>'}</div></div>`)}

function flyType(x){let n=(typeof x==='string'?x:x?.name||'').toLowerCase();if(/clouser|streamer|dolly|sparkle|minnow|muddler|sculpin|zonker|leech|baby got bead|tiny dancer/.test(n))return'Streamer';if(/dry|caddis|hopper|adams|parachute|ant|beetle|stimulator/.test(n))return'Dry Fly';if(/nymph|perdigon|pheasant|hare|prince|stonefly/.test(n))return'Nymph';if(/egg|worm|san juan/.test(n))return'Egg / Worm';if(/popovic|crease|airhead|squid|deceiver|clouser|tarpon|rooster|permit|bonefish|tuna|dorado/.test(n))return'Saltwater';return x?.type||'Other'}

function destinations(){let q=(window.destFilter||'').toLowerCase();let arr=DEST_ATLAS.filter(a=>!q||a.country.toLowerCase().includes(q)||a.regions.join(' ').toLowerCase().includes(q)||a.notes.toLowerCase().includes(q));return shell('Destinations','Complete destination atlas from the country research file, with countries and the regions / waters noted inside them.',`<div class="toolbar"><input id="destFilter" class="filterInput" value="${esc(window.destFilter||'')}" placeholder="Filter countries or regions…" oninput="window.destFilter=this.value;destinationsRender()"><button class="btn gold" onclick="quick('destination')">+ Destination</button></div><div id="destAtlas">${destCards(arr)}</div>`)}
function destCards(arr){return `<div class="atlas-count">${arr.length} country / territory records indexed • source terminology preserved</div><div class="atlas">${arr.map((a,i)=>`<details class="country"><summary><span><b>${esc(a.country)}</b>${(()=>{let n=(DATA.destination_notes||[]).find(x=>x.country.toLowerCase()===a.country.toLowerCase());let rating=n?.rating||(/\bbust\b/i.test(a.notes)?'Bust':/\bgreat\b/i.test(a.notes)?'Great':/\bgood\b/i.test(a.notes)?'Good':'');return rating?`<br><span class="ratingline rating-${rating.toLowerCase()}">${rating.toUpperCase()}</span>`:''})()}</span><small>${a.regions.length} region${a.regions.length===1?'':'s'} noted</small></summary><div class="countrybody">${a.regions.length?`<div class="regiontags">${a.regions.map(r=>`<button class="tag" onclick="atlasSearch('${esc(r).replace(/'/g,"\\'")}')">${esc(r)}</button>`).join('')}</div>`:''}<pre>${esc(a.notes||'No additional notes stored.')}</pre><div class="toolbar"><button class="btn" onclick="go('destination-${slug(a.country)}')">Open workspace</button></div></div></details>`).join('')}</div>`}
function destinationsRender(){document.getElementById('destAtlas').innerHTML=destCards(DEST_ATLAS.filter(a=>{let q=(window.destFilter||'').toLowerCase();return !q||a.country.toLowerCase().includes(q)||a.regions.join(' ').toLowerCase().includes(q)||a.notes.toLowerCase().includes(q)}))}
function atlasSearch(q){window.destFilter=q;go('destinations')}

function destinationDetail(n){let key=n.replace(/^destination-/,'').replace(/-/g,' ').toLowerCase();let a=DEST_ATLAS.find(x=>slug(x.country)===n.replace(/^destination-/,'').toLowerCase())||DEST_ATLAS.find(x=>x.country.toLowerCase()===key);let title=a?.country||n.replace(/^destination-/,'').replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());return shell(title,'Destination workspace.',`<div class="grid g3">${doors([{k:'SPECIES',t:'Target species',d:'Species connected to this destination.',page:'fish-list'},{k:'OPERATORS',t:'Operators / bookers',d:'Open known booking and guide references.',page:'resources'},{k:'RESEARCH',t:'Research notes',d:'Open all captured notes and links.',page:'research'}])}</div><div class="card" style="margin-top:14px"><h3>Regions / waters listed</h3>${a?.regions?.length?`<div class="regiontags">${a.regions.map(r=>`<span class="tag">${esc(r)}</span>`).join('')}</div>`:'<p class="muted">No region line was extracted from the source block.</p>'}</div><div class="card" style="margin-top:14px"><h3>Source notes</h3><pre style="white-space:pre-wrap;font:12px/1.45 Tahoma">${esc(a?.notes||'Country / destination notes are retained in the master atlas.')}</pre></div>`)}
function customIcons(){
  const iconsNow=state.customIcons||{};
  const keys=[['home','Dashboard'],['trip','Trips'],['fish','Fish / Journal'],['map','Maps / Locations'],['fly','Flies / Knots'],['gear','Gear / Account'],['box','Inventory / Packing'],['book','Research / Resources'],['globe','Destinations']];
  return shell('Custom Icons','Local icon pack editor — PNG, JPG, GIF, WEBP or SVG.',`<div class="card"><div class="titlebar">ICON PACK // USER OVERRIDES</div><div class="filechrome">These icons are stored in this browser. For permanent GitHub icons, upload the image files to an <b>/icons/</b> folder in the repository and reference them from the site.</div><div class="dropzone" style="margin:10px 0"><input id="iconFiles" type="file" accept="image/*,.svg" multiple onchange="importIcons(this.files)"><div style="margin-top:6px">SELECT CUSTOM ICON FILES</div></div><div class="iconpicker">${keys.map(([k,n])=>`<div class="iconcard"><div class="iconpreview">${iconsNow[k]?`<img src="${iconsNow[k]}" alt="${esc(n)}">`:`<span class="ico" style="width:42px;height:42px">${I(k)}</span>`}</div><div class="iconname">${esc(n)}</div>${iconsNow[k]?`<button class="btn" style="margin-top:6px;padding:4px 7px" onclick="clearIcon('${k}')">CLEAR</button>`:'<div class="muted" style="font-size:10px;margin-top:6px">Use filename to assign</div>'}</div>`).join('')}</div><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="exportIcons()">EXPORT ICON PACK</button><button class="btn" onclick="go('upload-guide')">UPLOAD GUIDE</button><button class="btn" onclick="clearAllIcons()">RESET ICONS</button></div></div><div class="card" style="margin-top:12px"><h3>How assignment works</h3><p class="small muted">Name files with a Fish OS key — for example <b>home.svg</b>, <b>trip.png</b>, <b>fish.svg</b>, <b>map.png</b>, <b>fly.svg</b>, <b>gear.svg</b>, <b>box.svg</b>, <b>book.svg</b>, or <b>globe.svg</b>. Fish OS will assign matching names automatically.</p></div>`)
}
function importIcons(files){
  const wanted=new Set(['home','trip','fish','map','fly','gear','box','book','globe']);let pending=[...files];if(!pending.length)return;
  let out={...(state.customIcons||{})};let i=0;
  const next=()=>{if(i>=pending.length){state.customIcons=out;localStorage.setItem('fishos_custom_icons',JSON.stringify(out));render();return;}let f=pending[i++];let base=f.name.replace(/\.[^.]+$/,'').toLowerCase().replace(/[^a-z0-9_-]/g,'');let key=base;if(!wanted.has(key)){let hit=[...wanted].find(k=>base.includes(k));if(hit)key=hit;}if(!wanted.has(key)){next();return;}if(f.size>350000){alert(f.name+' is over 350 KB and was skipped.');next();return;}let r=new FileReader();r.onload=()=>{out[key]=r.result;next()};r.readAsDataURL(f)};next()
}
function clearIcon(k){delete state.customIcons[k];localStorage.setItem('fishos_custom_icons',JSON.stringify(state.customIcons));render()}
function clearAllIcons(){if(confirm('Reset all custom Fish OS icons?')){state.customIcons={};localStorage.removeItem('fishos_custom_icons');render()}}
function exportIcons(){let blob=new Blob([JSON.stringify(state.customIcons||{},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fish_os_custom_icons.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}

├── index.html
├── .nojekyll
├── icons/
│   ├── home.svg
│   ├── trip.svg
│   ├── fish.svg
│   ├── map.svg
│   └── ...
└── photos/
    └── small website/reference images only</pre><p class="muted small">For your real fishing photo collection, Fish OS should eventually store the files in cloud storage and keep metadata such as trip, location, fish, date and tags in the Fish OS database.</p></div>`)}
function knots(){let groups={"Fly / tippet":['Clinch','Improved Clinch','Trilene','Davey','San Diego Jam','Palomar'],"Leader / tippet connections":['Uni / Grinner / Duncan','Improved Uni','Double Uni','Surgeons','Blood / Barrel','Improved Blood','Albright','Alberto Knot','Carrot Knot'],"Loops":['Non-slip Mono Loop','Perfection Loop','Micro Perfection Loop','Homer Rhodes Loop','Figure 8'],"Backing / reel / line":['Arbor Knot','Nail Knot','Bimini Twist'],"Saltwater / heavy connection":['FG Knot','Bimini Twist','Haywire Twist','Albright','San Diego Jam'],"Special / field":['Snell','Seaguar']};return shell('Knots','Knot library broken into practical connection categories.',`<div class="grid g2">${Object.entries(groups).map(([g,items])=>`<div class="card"><h3>${esc(g)}</h3>${list(items.map(x=>({title:x,meta:'Open knot record'})),i=>`go('knot-${slug(items[i])}')`)}</div>`).join('')}</div>`)}
function knotDetail(n){let p=n.replace(/^knot-/,'').replace(/-/g,' ');p=p.replace(/\b\w/g,c=>c.toUpperCase());return shell(p,'Knot technique record.',`<div class="card"><h3>Notes</h3><p class="muted">The master notes include breaking-strength observations, use cases and connection categories. Preserve the raw values while the knot library is normalized.</p></div>`)}
function defaultPacking(){return {"CLOTHING":[['Hat',1],['Sunglasses',1],['Tshirt',4],['Fishing shirt',4],['Nice shirt',4],['Boxers',8],['Fishing pants',4],['Shorts',2],['Regular pants',2],['Socks',8],['Shoes',1],['Sandals',1]],"FIELD":[['Fly rod',1],['Reel',1],['Leaders',3],['Tippet',3],['Nippers',1],['Forceps / pliers',1],['Floatant',1],['Net',1]],"TRAVEL":[['License / permits',1],['Phone',1],['Charger',1],['Passport / ID',1],['Headlamp',1]]}}
function packState(){if(!state.packing){let d=defaultPacking();state.packing=Object.fromEntries(Object.entries(d).map(([g,items])=>[g,items.map(x=>({name:x[0],qty:x[1],done:false}))]));localStorage.setItem('fishos_packing',JSON.stringify(state.packing))}return state.packing}
function packing(){let p=packState();let total=Object.values(p).flat().length,done=Object.values(p).flat().filter(x=>x.done).length;return shell('Packing','Customizable field checklist — compact RPG / trade-selection style.',`<div class="packhud"><b>PACK LOADOUT</b><span>${done}/${total} checked</span><span>WEIGHT: --</span><button class="btn gold" onclick="addPack()">+ ADD ITEM</button><button class="btn" onclick="resetPack()">RESET</button></div><div class="packscreen">${Object.entries(p).map(([g,items])=>`<section class="packcat"><h3>${esc(g)}</h3>${items.map((x,i)=>`<div class="packitem ${x.done?'done':''}"><button class="packcheck" onclick="togglePack('${esc(g)}',${i})">${x.done?'X':' '}</button><span>${esc(x.name)}</span><input class="qty" type="number" min="0" value="${x.qty}" onchange="qtyPack('${esc(g)}',${i},this.value)"><button class="packdel" onclick="delPack('${esc(g)}',${i})">DEL</button></div>`).join('')}</section>`).join('')}</div>`)}
function persistPack(){localStorage.setItem('fishos_packing',JSON.stringify(state.packing));render()}
function togglePack(g,i){state.packing[g][i].done=!state.packing[g][i].done;persistPack()}
function qtyPack(g,i,v){state.packing[g][i].qty=Math.max(0,Number(v)||0);persistPack()}
function delPack(g,i){state.packing[g].splice(i,1);persistPack()}
function addPack(){let n=prompt('Item name');if(!n)return;let g=prompt('Category','FIELD')||'FIELD';if(!state.packing[g])state.packing[g]=[];state.packing[g].push({name:n,qty:1,done:false});persistPack()}
function resetPack(){if(confirm('Reset packing checklist to the Fish OS seed list?')){state.packing=null;localStorage.removeItem('fishos_packing');render()}}
function casting(){return shell('Casting','Casting notes, practice and technique references.',`<div class="grid g3">${doors([{k:'PRACTICE',t:'Casting drills',d:'Keep practice notes here.',page:'resources'},{k:'SPEY',t:'Two-hand casting',d:'Switch and spey notes.',page:'gear'},{k:'SALT',t:'Saltwater casting',d:'Heavy rod and tropical line notes.',page:'gear'}])}</div>`)}
function why(){return shell('Why I Fish','Long-form personal fishing philosophy.',`<div class="card"><p>${esc(DATA.master_note)}</p></div>`)}
function account(){let logged=!!state.profile.loggedIn;return shell(logged?'Account / Signed In':'Log In','Supabase-ready account layer. Magic-link auth is the default; the browser session persists through supabase-js when configured.',`<div class="loginbox"><div class="card"><div class="eyebrow">FISH OS ACCOUNT</div><h2>${logged?'SIGNED IN':'LOG IN'}</h2><p class="muted">${logged?esc(state.profile.email||'Signed-in user'):'Connect your Supabase project below, then use your email to receive a magic sign-in link.'}</p><div class="form"><input id="sburl" value="${esc(state.supabase.url||'')}" placeholder="Supabase Project URL"><input id="sbkey" value="${esc(state.supabase.key||'')}" placeholder="Supabase Publishable Key"><button class="btn" onclick="saveSupabase()">SAVE SUPABASE CONNECTION</button><input id="pemail" value="${esc(state.profile.email||'')}" placeholder="Email"><button class="btn gold" onclick="magicLogin()">EMAIL ME A MAGIC LINK</button>${logged?'<button class="btn" onclick="logoutSupabase()">LOG OUT</button>':''}</div><div class="notice" style="margin-top:12px">Use the Supabase Project URL and Publishable Key from the project Connect/API settings. Do not paste a service-role/secret key here.</div></div></div>`)}
async function supaClient(){if(!state.supabase.url||!state.supabase.key)return null;if(!window.supabaseClient){if(!window.supabase)return null;window.supabaseClient=window.supabase.createClient(state.supabase.url,state.supabase.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});window.supabaseClient.auth.onAuthStateChange((event,session)=>{if(session?.user){state.profile.loggedIn=true;state.profile.email=session.user.email||'';state.profile.userId=session.user.id;localStorage.setItem('fishos_profile',JSON.stringify(state.profile));if(location.hash==='#account')setTimeout(render,0)}})}return window.supabaseClient}
function saveSupabase(){state.supabase={url:document.getElementById('sburl').value.trim(),key:document.getElementById('sbkey').value.trim()};localStorage.setItem('fishos_supabase',JSON.stringify(state.supabase));alert('Supabase connection saved.');render()}
async function magicLogin(){let c=await supaClient();let email=document.getElementById('pemail').value.trim();if(!c){alert('Save the Supabase Project URL and Publishable Key first.');return}if(!email){alert('Enter your email.');return}let {error}=await c.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname+'#account'}});if(error)alert(error.message);else alert('Magic link sent. Check your email.');}
async function logoutSupabase(){let c=await supaClient();if(c)await c.auth.signOut();state.profile.loggedIn=false;state.profile.email='';localStorage.setItem('fishos_profile',JSON.stringify(state.profile));render()}


function openModal(title,body){let m=document.getElementById('fishModal');if(!m){m=document.createElement('div');m.id='fishModal';document.body.appendChild(m)}m.className='modal';m.innerHTML=`<div class="modalbox"><div class="modalhead"><span>${esc(title)}</span><button class="btn" onclick="closeModal()">X</button></div><div class="modalbody">${body}</div></div>`}
function closeModal(){let m=document.getElementById('fishModal');if(m)m.remove()}
function persistData(){localStorage.setItem('fishos_data',JSON.stringify(DATA));if(window.supabaseClient&&state.profile.loggedIn)syncCloudDebounced()}
function quick(kind='note'){let k=String(kind).toLowerCase();if(k.includes('trip'))return tripForm();if(k.includes('journal'))return journalForm();if(k.includes('destination'))return destinationForm();if(k.includes('fly'))return flyForm();if(k.includes('fish'))return fishForm();return openModal('QUICK ADD',`<div class="grid g2">${[['TRIP','Create a trip record','tripForm()'],['JOURNAL','Write a field note','journalForm()'],['FISH','Log a fish','fishForm()'],['FLY','Add a fly pattern','flyForm()'],['DESTINATION','Add destination note','destinationForm()'],['CALENDAR','Add calendar event','addCalendarEntry()']].map(x=>`<button class="door" onclick="${x[2]}"><div class="kicker">${x[0]}</div><h3>${x[1]}</h3></button>`).join('')}</div>`)}

function journalForm(){openModal('NEW JOURNAL ENTRY',`<div class="form"><input id="njTitle" placeholder="Entry title"><input id="njLocation" placeholder="Water / location"><input id="njSpecies" placeholder="Species — comma separated"><input id="njDate" type="date" value="${localISO(new Date())}"><textarea id="njObserved" placeholder="What happened? Observations, conditions, fish behavior..."></textarea><input id="njTactics" placeholder="Flies / tactics — comma separated"><textarea id="njNotes" placeholder="Result, hypothesis, follow-up"></textarea><button class="btn gold" onclick="saveJournalForm()">SAVE JOURNAL ENTRY</button></div>`)}
function saveJournalForm(){let title=document.getElementById('njTitle').value.trim();if(!title)return alert('Entry title required.');DATA.journal=DATA.journal||[];DATA.journal.unshift({title,location:document.getElementById('njLocation').value.trim(),species:document.getElementById('njSpecies').value.split(',').map(x=>x.trim()).filter(Boolean),date:document.getElementById('njDate').value,observed:document.getElementById('njObserved').value.trim(),tactics:document.getElementById('njTactics').value.split(',').map(x=>x.trim()).filter(Boolean),notes:document.getElementById('njNotes').value.trim()});persistData();closeModal();go('journal')}
function fishForm(){openModal('LOG FISH',`<div class="form"><input id="nfSpecies" placeholder="Species"><input id="nfWater" placeholder="Water / location"><input id="nfLength" placeholder="Length (inches)"><input id="nfGirth" placeholder="Girth (inches)"><input id="nfFly" placeholder="Fly / lure"><textarea id="nfFishNotes" placeholder="Notes"></textarea><button class="btn gold" onclick="saveFishForm()">LOG FISH</button></div>`)}

function destinationForm(){openModal('DESTINATION NOTE',`<div class="form"><input id="ndCountry" placeholder="Country / destination"><input id="ndRegion" placeholder="Region / water"><select id="ndRating"><option>Unrated</option><option>Great</option><option>Good</option><option>OK</option><option>Bust</option></select><textarea id="ndNotes" placeholder="Why? Species, access, operator, season, trip notes..."></textarea><button class="btn gold" onclick="saveDestinationForm()">SAVE NOTE</button></div>`)}
function saveDestinationForm(){let c=document.getElementById('ndCountry').value.trim();if(!c)return alert('Destination required.');DATA.destination_notes=DATA.destination_notes||[];DATA.destination_notes.push({country:c,region:document.getElementById('ndRegion').value.trim(),rating:document.getElementById('ndRating').value,notes:document.getElementById('ndNotes').value.trim()});persistData();closeModal();go('destinations')}

function saveProfile(){state.profile.name=document.getElementById('pname').value||'Local Angler';state.profile.email=document.getElementById('pemail').value||'local@fishos';localStorage.setItem('fishos_profile',JSON.stringify(state.profile));render()}
function clearLocal(){if(confirm('Reset local Fish OS demo data?')){localStorage.removeItem('fishos_profile');localStorage.removeItem('fishos_records');location.reload()}}
function currentHash(){return (location.hash||'#home').slice(1)||'home'}

function search(q){q=q.trim().toLowerCase();let box=document.getElementById('searchResults');if(!q){box.classList.remove('show');return}let arr=[];const add=(type,title,page,hay)=>{if(title&&String(hay??title).toLowerCase().includes(q))arr.push([type,String(title),page])};const routeFor=k=>({trips:'trips',journal:'journal',locations:'locations',rivers:'locations',flies:'fly-patterns',destinations:'destinations',rods:'gear',buy_rods:'gear',knots:'knots',packing:'packing',buy:'purchases',master_note:'why-i-fish'}[k]||'research');const label=k=>({trips:'Trip',journal:'Journal',locations:'Water',rivers:'Water',flies:'Fly',destinations:'Destination',rods:'Rod',knots:'Knot',packing:'Packing',buy:'Purchase',species:'Species',fish:'Species'}[k]||'Fish OS');const walk=(v,key='DATA')=>{if(v==null)return;if(typeof v==='string'){if(v.toLowerCase().includes(q))add(label(key),v,routeFor(key),v);return}if(Array.isArray(v)){v.forEach((x,i)=>{if(typeof x==='string')add(label(key),x,routeFor(key),x);else if(x&&typeof x==='object'){let title=x.id||x.name||x.title||x.place||x.location||`Record ${i+1}`,page=key==='trips'?`trip-${slug(x.id||title)}`:routeFor(key);add(label(key),title,page,JSON.stringify(x));walk(x,key)}});return}if(typeof v==='object')Object.entries(v).forEach(([k,x])=>walk(x,k))};walk(DATA);let seen=new Set();arr=arr.filter(x=>{let k=x[0]+'|'+x[1]+'|'+x[2];if(seen.has(k))return false;seen.add(k);return true});box.innerHTML=arr.slice(0,40).map(x=>`<div class="result" onclick="go('${x[2]}');document.getElementById('searchResults').classList.remove('show')"><span class="tag">${esc(x[0])}</span> ${esc(x[1])}</div>`).join('')||'<div class="result muted">No indexed result.</div>';box.classList.add('show')}

function fishList(){let custom=state.fishCustom||[],groups=Object.entries(FISH_CATALOG).map(([g,items])=>[g,[...items,...custom.filter(x=>x.group===g).map(x=>x.name)]]);if(custom.filter(x=>!FISH_CATALOG[x.group]).length)groups.push(['Custom',custom.filter(x=>!FISH_CATALOG[x.group]).map(x=>x.name)]);let all=groups.flatMap(g=>g[1]);let caught=all.filter(x=>(state.fishCaught||[]).includes(x)).length;return shell('Fish List','Common names plus scientific names where Fish OS has a verified species mapping.',`<div class="stats"><div class="stat"><b>${caught}</b><span>Caught</span></div><div class="stat"><b>${all.length}</b><span>Total species</span></div><div class="stat"><b>${all.length-caught}</b><span>Targets / unmarked</span></div></div>${fishProgress(caught,all.length)}<div class="toolbar"><button class="btn gold" onclick="addFish()">+ Add species</button><button class="btn" onclick="go('journal')">Journal</button></div><div class="grid g2" style="margin-top:14px">${groups.map(([g,items])=>`<div class="card"><h3>${esc(g)}</h3><div class="fishgrid">${items.map(x=>{let c=(state.fishCaught||[]).includes(x);return `<label class="fishrow"><input type="checkbox" ${c?'checked':''} onchange="toggleFish('${esc(x).replace(/'/g,"\\'")}')"><span>${esc(x)}<em class="scientific">${esc(FISH_SCI[x]||'Scientific name not yet indexed')}</em></span><em>${c?'CAUGHT':'TARGET'}</em></label>`}).join('')}</div></div>`).join('')}</div>`)}

function tripDetail(k){let key=k.replace(/^trip-/,'');let t=(DATA.trips||[]).find(x=>slug(x.id||'')===key);if(!t)return shell('Trip','Trip workspace','<div class="empty">Trip record not found.</div>');let status=tripStatus(t);ensureTripPack(t.id);return shell(t.id||'Trip','Deep trip workspace — the central record linking location, dates, fish, journal, gear, flies, packing and research.',`<div class="grid g3"><div class="card"><h3>Overview</h3><div class="tag ${status==='Completed'?'':'hot'}">${esc(status)}</div><div class="tag">${esc(t.date||'')}</div><p class="muted">${esc(t.place||t.location||t.region||'')}</p></div><div class="card"><h3>Targets / species</h3><p>${esc((t.targets||t.species||[]).join(' • ')||'No targets stored.')}</p><p class="small muted">${esc(t.type||'')} ${t.host?'• '+esc(t.host):''}</p></div><div class="card"><h3>Trip details</h3><p class="small">Budget: <b>${t.budget?'$'+Number(t.budget).toLocaleString():'—'}</b><br>Booking: ${esc(t.booking||'—')}<br>Expected hours: ${t.expected_hours||0}</p></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Location</h3><p>${esc(t.place||'—')}</p>${t.lat&&t.lon?`<p class="small muted">${esc(t.lat)}, ${esc(t.lon)}</p>`:''}<div class="triplinks"><button class="btn" onclick="go('maps')">MAPS</button><button class="btn" onclick="tripLocationSearch()">EDIT LOCATION</button></div></div><div class="card"><h3>Plan / notes</h3><p>${esc(t.notes||'No trip notes yet.')}</p>${t.gear_notes?`<p class="small"><b>Gear:</b> ${esc(t.gear_notes)}</p>`:''}</div></div><div class="grid g3" style="margin-top:14px">${doors([{k:'PACK',t:'Trip Packing',d:'Exact loadout, quantities, weights and setup details.',page:'packing'},{k:'JOURNAL',t:'Trip Journal',d:'Conditions, observations and lessons.',page:'journal'},{k:'FISH',t:'Fish Log',d:'Fish caught and target species.',page:'fish-list'}])}</div>`)}
function gear(){let total=(DATA.rods||[]).reduce((n,r)=>n+(parseFloat(String(r[8]).replace(/[$,]/g,''))||0),0),top=[...DATA.rods].sort((a,b)=>(parseFloat(String(b[8]).replace(/[$,]/g,''))||0)-(parseFloat(String(a[8]).replace(/[$,]/g,''))||0)).slice(0,6);return shell('Gear','Interactive rod vault plus the rest of the fishing system.',`<div class="split"><div class="rodscene"><div class="rodgrip"></div><div class="rod"></div><div class="rodreel"></div><div class="rodpoint rp1" onclick="go('rod-list')">ROD VAULT</div><div class="rodpoint rp2" onclick="go('rod-list')">LINE</div><div class="rodpoint rp3" onclick="go('rod-list')">REEL</div><div class="rodpoint rp4" onclick="go('fly-patterns')">FLY BOX</div><div class="rodpoint rp5" onclick="go('packing')">FIELD KIT</div><div class="rodsectionlabel">CLICK A COMPONENT • BUILD A TRIP LOADOUT</div></div><div class="card rodvalueclick" onclick="go('rod-list')"><h3>Collection value</h3><div class="stat"><b>$${total.toLocaleString()}</b><span>Listed rod value</span></div><div class="rodchart">${top.map(r=>{let v=parseFloat(String(r[8]).replace(/[$,]/g,''))||0;return `<div class="rodbar"><span>${esc(r[0])}</span><i style="width:${Math.max(3,Math.round(v/1500*100))}%"></i><b>$${v.toLocaleString()}</b></div>`}).join('')}</div><p class="muted small">Uses the supplied listed prices only. Click to open the full inventory.</p></div></div><div class="card" style="margin-top:14px"><h3>Rod inventory</h3>${list(DATA.rods.map(r=>({title:`${r[0]} — ${r[2]} ${r[3]}`,meta:`${r[1]} wt • ${r[6]} • $${parseFloat(String(r[8]).replace(/[$,]/g,''))||0}`})),i=>`go('rod-${i}')`)}</div>`)}
function inventory(){return shell('Inventory','Counted flies, materials, tippet, leaders and gear.',`<div class="grid g4">${doors([{k:'FLIES',t:'Fly inventory',d:'Patterns, counts and boxes.',page:'fly-patterns'},{k:'MATERIALS',t:'Materials',d:'Tying stock and purchase needs.',page:'purchases'},{k:'TIPPET',t:'Tippet / leaders',d:'Fluoro, mono and sizes.',page:'tippet'},{k:'GEAR',t:'Gear',d:'Rods, reels, lines and field kit.',page:'gear'},{k:'BUY',t:'Buy List',d:'Checklist, categories and running totals.',page:'buy-list'}])}</div>`)}
function buyList(){let items=DATA.buy_items||[];let cats=[...new Set(items.map(x=>x.category||'Other'))];let total=items.filter(x=>!x.done).reduce((n,x)=>n+(Number(x.price)||0)*(Number(x.qty)||1),0);return shell('Buy List','Purchase checklist with category totals and a running total.',`<div class="card"><div class="buytotal">OPEN TOTAL: $${total.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div><p class="muted small">Items without a price are counted as $0 until you enter a price.</p><button class="btn gold" onclick="addBuyItem()">+ ADD TO BUY LIST</button></div><div class="buygrid" style="margin-top:12px">${cats.map(c=>{let arr=items.filter(x=>(x.category||'Other')===c),sum=arr.filter(x=>!x.done).reduce((n,x)=>n+(Number(x.price)||0)*(Number(x.qty)||1),0);return `<div class="card buycat"><h3>${esc(c)}</h3><div class="muted small">Category total: $${sum.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div>${arr.map((x,i)=>`<label class="buyitem ${x.done?'done':''}"><input class="buycheck" type="checkbox" ${x.done?'checked':''} onchange="toggleBuy('${esc(x.id)}')"><span><b>${esc(x.name)}</b><br><span class="small muted">Qty ${x.qty||1} • ${esc(x.notes||'')}</span></span><b>$${((Number(x.price)||0)*(Number(x.qty)||1)).toLocaleString()}</b></label>`).join('')}</div>`}).join('')}</div>`)}
function addBuyItem(){openModal('ADD BUY LIST ITEM',`<div class="form"><input id="buyName" placeholder="Item"><input id="buyCat" placeholder="Category — Rods, Reels, Lines, Flies, Travel…"><input id="buyQty" type="number" value="1" min="1"><input id="buyPrice" type="number" value="0" min="0" step="0.01" placeholder="Price each"><textarea id="buyNotes" placeholder="Model, size, reason, link…"></textarea><button class="btn gold" onclick="saveBuyItem()">ADD ITEM</button></div>`)}
function saveBuyItem(){let n=document.getElementById('buyName').value.trim();if(!n)return alert('Item required.');DATA.buy_items=DATA.buy_items||[];DATA.buy_items.push({id:'buy-'+Date.now(),name:n,category:document.getElementById('buyCat').value.trim()||'Other',qty:Number(document.getElementById('buyQty').value)||1,price:Number(document.getElementById('buyPrice').value)||0,notes:document.getElementById('buyNotes').value.trim(),done:false});persistData();closeModal();go('buy-list')}
function toggleBuy(id){let x=(DATA.buy_items||[]).find(x=>x.id===id);if(x){x.done=!x.done;persistData();render()}}
function purchases(){return buyList()}
function rodList(){return shell('Rod Inventory','Click any setup to inspect the rod, reel, line, purpose, species and listed value.',`<div class="tablewrap"><table class="table"><thead><tr><th></th><th>Nickname</th><th>WT</th><th>Brand</th><th>Model</th><th>Reel</th><th>Line</th><th>Purpose</th><th>Species</th><th>Price</th></tr></thead><tbody>${DATA.rods.map((r,i)=>`<tr onclick="go('rod-${i}')" style="cursor:pointer"><td><span class="gearicon">${rodIcon(r[6]||'rod')}</span></td>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="notice" style="margin-top:12px"><b>Buy List:</b> <button class="btn" onclick="go('buy-list')">OPEN BUY LIST</button></div>`)}
function rodDetail(i){let r=DATA.rods[Number(i)]||DATA.rods[0];let parts=[['ROD',`${r[1]} wt • ${r[2]} ${r[3]}`,'gear'],['REEL',r[4],'gear'],['LINE',r[5],'map'],['PURPOSE',r[6],'fly'],['SPECIES',r[7],'fish']];let price=r[8];return shell(r[0],'Gear setup workspace — click a component to focus on that part of the system.',`<div class="card"><div class="setup">${parts.map(p=>`<div class="setupPart" onclick="alert('${p[0]}\n${String(p[1]).replace(/'/g,"\'")}')"><div class="partIcon">${I(p[2])}</div><b>${p[0]}</b><div class="small muted">${esc(p[1])}</div></div>`).join('')}</div></div><div class="grid g3" style="margin-top:12px">${[['Weight',r[1]],['Brand',r[2]],['Model',r[3]],['Current reel',r[4]],['Line',r[5]],['Purpose',r[6]],['Species',r[7]],['Listed price',price]].map(x=>`<div class="card"><div class="muted small">${x[0]}</div><h3>${esc(x[1])}</h3></div>`).join('')}</div>`)}
function rodIcon(type){return fishSvg(false)}
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{try{if(state.supabase.url&&state.supabase.key&&window.supabase){window.supabaseClient=window.supabase.createClient(state.supabase.url,state.supabase.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});window.supabaseClient.auth.onAuthStateChange((event,session)=>{if(session?.user){state.profile.loggedIn=true;state.profile.email=session.user.email||'';state.profile.userId=session.user.id;state.profile.mode='Supabase';localStorage.setItem('fishos_profile',JSON.stringify(state.profile));setTimeout(loadCloud,0);if(state.page==='account')setTimeout(render,0);}else if(event==='SIGNED_OUT'){state.profile.loggedIn=false;state.profile.userId='';state.profile.mode='Local';localStorage.setItem('fishos_profile',JSON.stringify(state.profile));}});let s=await window.supabaseClient.auth.getSession();if(s.data.session){state.profile.loggedIn=true;state.profile.email=s.data.session.user.email||'';state.profile.userId=s.data.session.user.id;state.profile.mode='Supabase';localStorage.setItem('fishos_profile',JSON.stringify(state.profile));await loadCloud();}}}catch(e){console.warn('Fish OS auth init',e)}})();

/* V15 SUPABASE PERSISTENCE */
function cloudPayload(){return {trips:DATA.trips||[],journal:DATA.journal||[],fish:DATA.fish||[],flies:DATA.flies||[],destination_notes:DATA.destination_notes||[],calendar_entries:DATA.calendar_entries||[],buy_items:DATA.buy_items||[],packingByTrip:state.packingByTrip||{},packing:state.packing||{},fishCustom:state.fishCustom||[],fishCaught:state.fishCaught||[]};}
let cloudTimer=null;function syncCloudDebounced(){clearTimeout(cloudTimer);cloudTimer=setTimeout(syncCloud,700)}
async function syncCloud(){try{if(!window.supabaseClient||!state.profile.loggedIn||!state.profile.userId)return;let payload=cloudPayload();let {error}=await window.supabaseClient.from('fishos_user_data').upsert({user_id:state.profile.userId,data:payload,updated_at:new Date().toISOString()});if(error)console.warn('Fish OS cloud sync:',error.message);else state.cloudStatus='Saved';}catch(e){console.warn(e)}}
async function loadCloud(){try{if(!window.supabaseClient||!state.profile.userId)return;let {data,error}=await window.supabaseClient.from('fishos_user_data').select('data').eq('user_id',state.profile.userId).maybeSingle();if(error){console.warn('Fish OS cloud load:',error.message);return}if(data?.data){let d=data.data;['trips','journal','fish','flies','destination_notes','calendar_entries','buy_items'].forEach(k=>{if(Array.isArray(d[k]))DATA[k]=d[k]});if(d.packingByTrip)state.packingByTrip=d.packingByTrip;if(d.packing)state.packing=d.packing;if(Array.isArray(d.fishCustom))state.fishCustom=d.fishCustom;if(Array.isArray(d.fishCaught))state.fishCaught=d.fishCaught;localStorage.setItem('fishos_data',JSON.stringify(DATA));localStorage.setItem('fishos_packing_by_trip',JSON.stringify(state.packingByTrip||{}));localStorage.setItem('fishos_packing',JSON.stringify(state.packing||null));localStorage.setItem('fishos_fish_custom',JSON.stringify(state.fishCustom));localStorage.setItem('fishos_fish_caught',JSON.stringify(state.fishCaught));}else await syncCloud();render();}catch(e){console.warn(e)}}
function seedUserData(){DATA.buy_items=DATA.buy_items||[{id:'buy-echo-6',name:'Echo 6 wt',category:'Rods',qty:1,price:0,notes:'Buy / replacement',done:false},{id:'buy-winston-2',name:'Winston 2',category:'Rods',qty:1,price:0,notes:'9 wt replacement reel',done:false},{id:'buy-12-reel',name:'Second 12 wt reel',category:'Reels',qty:1,price:0,notes:'',done:false},{id:'buy-ross-8',name:'Ross Evolution R Salt 8 wt',category:'Reels',qty:1,price:695,notes:'Watchlist',done:false}];}
seedUserData();

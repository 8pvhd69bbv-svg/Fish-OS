function tripDetail(k){let key=k.replace(/^trip-/,'');let t=(DATA.trips||[]).find(x=>slug(x.id||'')===key);if(!t)return shell('Trip','Trip workspace','<div class="empty">Trip record not found.</div>');ensureTripPack(t.id);let pref=t.lat&&t.lon?{lat:t.lat,lon:t.lon,weatherName:t.place||t.id}:{};return shell(t.id||'Trip','Deep trip workspace — dates, location, conditions, packing, fish and research.',`<div class="grid g3"><div class="card"><h3>Overview</h3><div class="tag ${tripStatus(t)==='Completed'?'':'hot'}">${esc(tripStatus(t))}</div><div class="tag">${esc(t.date||'')}</div><p class="muted">${esc(t.place||t.location||t.region||'')}</p></div><div class="card"><h3>Targets / species</h3><p>${esc((t.targets||t.species||[]).join(' • ')||'No targets stored.')}</p><p class="small muted">${esc(t.type||'')} ${t.host?'• '+esc(t.host):''}</p></div><div class="card"><h3>Trip details</h3><p class="small">Budget: <b>${t.budget?'$'+Number(t.budget).toLocaleString():'—'}</b><br>Booking: ${esc(t.booking||'—')}<br>Expected hours: ${t.expected_hours||0}</p></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Location</h3><p>${esc(t.place||'—')}</p>${t.lat&&t.lon?`<p class="small muted">${esc(t.lat)}, ${esc(t.lon)}</p>`:''}<button class="btn" onclick="tripLocationSearch()">EDIT / SEARCH LOCATION</button></div><div class="card"><h3>Plan / notes</h3><p>${esc(t.notes||'No trip notes yet.')}</p>${t.gear_notes?`<p class="small"><b>Gear:</b> ${esc(t.gear_notes)}</p>`:''}</div></div>${fieldDataCard()}<div class="grid g3" style="margin-top:14px">${doors([{k:'PACK',t:'Trip Packing',d:'Exact loadout, quantities, weights and setup details.',page:'packing'},{k:'JOURNAL',t:'Trip Journal',d:'Conditions, observations and lessons.',page:'journal'},{k:'FISH',t:'Fish Log',d:'Fish caught and target species.',page:'fish-list'}])}</div>`)}

function authStatusMessage(msg){return `<div class="notice" style="margin-top:10px">${esc(msg)}</div>`}
async function magicLogin(){let c=await supaClient(),email=document.getElementById('pemail')?.value.trim();if(!c)return alert('Save the Supabase Project URL and Publishable Key first.');if(!email)return alert('Enter your email.');let last=Number(localStorage.getItem('fishos_magic_last')||0),wait=Math.ceil((60000-(Date.now()-last))/1000);if(wait>0)return alert(`Supabase email cooldown: wait ${wait} seconds before requesting another email. If you already verified the account, use password sign-in below.`);localStorage.setItem('fishos_magic_last',String(Date.now()));let {error}=await c.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});if(error){localStorage.removeItem('fishos_magic_last');alert(error.message.includes('rate limit')?`Supabase is rate-limiting email delivery. Wait before requesting another email, or use password sign-in after your account is verified.\n\n${error.message}`:error.message)}else alert('Magic link sent. Check your email.');}
async function passwordSignIn(){let c=await supaClient(),email=document.getElementById('pemail')?.value.trim(),pw=document.getElementById('ppass')?.value||'';if(!c||!email||!pw)return alert('Enter your email and password.');let {error}=await c.auth.signInWithPassword({email,password:pw});if(error)alert(error.message);else{state.profile.mode='Supabase';await loadCloud();render()}}
async function passwordSignUp(){let c=await supaClient(),email=document.getElementById('pemail')?.value.trim(),pw=document.getElementById('ppass')?.value||'';if(!c||!email||pw.length<8)return alert('Enter your email and a password of at least 8 characters.');let {error}=await c.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});if(error)alert(error.message);else alert('Account created. If email confirmation is enabled, confirm it once, then use password sign-in.');}
function account(){let logged=!!state.profile.loggedIn;return shell(logged?'Account / Signed In':'Log In','Supabase account layer — magic link or password sign-in.',`<div class="loginbox"><div class="card"><div class="eyebrow">FISH OS ACCOUNT</div><h2>${logged?'SIGNED IN':'LOG IN'}</h2><p class="muted">${logged?esc(state.profile.email||'Signed-in user'):'Use magic link once, or use password sign-in after your Supabase account is verified.'}</p><div class="form"><input id="sburl" value="${esc(state.supabase.url||'')}" placeholder="Supabase Project URL"><input id="sbkey" value="${esc(state.supabase.key||'')}" placeholder="Supabase Publishable Key"><button class="btn" onclick="saveSupabase()">SAVE SUPABASE CONNECTION</button><input id="pemail" value="${esc(state.profile.email||'')}" placeholder="Email"><input id="ppass" type="password" placeholder="Password — 8+ characters"><button class="btn gold" onclick="passwordSignIn()">SIGN IN WITH PASSWORD</button><button class="btn" onclick="passwordSignUp()">CREATE PASSWORD ACCOUNT</button><button class="btn" onclick="magicLogin()">EMAIL ME A MAGIC LINK</button>${logged?'<button class="btn" onclick="logoutSupabase()">LOG OUT</button>':''}</div><div class="notice" style="margin-top:12px"><b>Auth callback:</b><br><span class="mono small">${esc(location.origin+location.pathname)}</span><br><br>In Supabase Authentication → URL Configuration, set the Site URL to the GitHub Pages folder URL and add that same URL without the hash as an allowed redirect URL. Do not paste a service-role/secret key here.</div></div></div>`)}

async function uploadFishFiles(){let c=await supaClient();if(!c||!state.profile.loggedIn||!state.profile.userId)return alert('Sign in first.');let input=document.getElementById('storageFiles'),files=[...(input?.files||[])];if(!files.length)return alert('Choose at least one file.');let cat=document.getElementById('storageCategory').value||'other',trip=document.getElementById('storageTrip').value.trim(),journal=document.getElementById('storageJournal').value.trim(),notes=document.getElementById('storageNotes').value.trim(),status=document.getElementById('storageStatus');if(status)status.textContent='Uploading…';let done=0;for(const f of files){try{let safe=f.name.toLowerCase().replace(/[^a-z0-9._-]+/g,'-').replace(/-+/g,'-'),path=`${state.profile.userId}/${cat}/${Date.now()}-${safe}`;let up=await c.storage.from('fishos-private').upload(path,f,{upsert:false,contentType:f.type||'application/octet-stream'});if(up.error)throw up.error;let ins=await c.from('fishos_files').insert({user_id:state.profile.userId,bucket_id:'fishos-private',path,original_name:f.name,mime_type:f.type||null,size_bytes:f.size,trip_id:trip||null,journal_id:journal||null,category:cat,notes:notes||null});if(ins.error)throw ins.error;done++}catch(e){console.warn('Fish OS file upload',e);if(status)status.textContent=`Uploaded ${done}/${files.length}. Last error: ${e.message||e}`;return}}if(status)status.textContent=`Uploaded ${done} file${done===1?'':'s'} to private storage.`;input.value='';await listFishFiles()}
async function listFishFiles(){let el=document.getElementById('storageList');if(!el)return;let c=await supaClient();if(!c||!state.profile.loggedIn){el.innerHTML='<div class="muted">Sign in to view your private files.</div>';return}let {data,error}=await c.from('fishos_files').select('*').order('created_at',{ascending:false}).limit(50);if(error){el.innerHTML=`<div class="notice">Could not load file records: ${esc(error.message)}</div>`;return}if(!data?.length){el.innerHTML='<div class="muted">No private files uploaded yet.</div>';return}el.innerHTML=data.map(x=>`<div class="filechrome" style="margin:6px 0;display:flex;gap:8px;align-items:center;justify-content:space-between"><span><b>${esc(x.original_name)}</b><br><span class="small muted">${esc(x.category||'other')} • ${x.size_bytes?Math.round(x.size_bytes/1024):0} KB${x.trip_id?' • '+esc(x.trip_id):''}</span></span><span><button class="btn" onclick="downloadFishFile('${esc(x.id)}')">OPEN</button><button class="btn" onclick="deleteFishFile('${esc(x.id)}')">DEL</button></span></div>`).join('')}
async function downloadFishFile(id){let c=await supaClient();if(!c)return;let {data:row,error:q}=await c.from('fishos_files').select('*').eq('id',id).single();if(q||!row)return alert(q?.message||'File record not found.');let {data,error}=await c.storage.from(row.bucket_id).createSignedUrl(row.path,600);if(error)return alert(error.message);window.open(data.signedUrl,'_blank','noopener,noreferrer')}

  window.speciesStatus=function(x){return (state.fishCaught||[]).map(fishCanon).includes(fishCanon(x))?'CAUGHT':'TARGET'};

  window.componentRows=function(kind){const key=kind.toLowerCase();let existing=DATA.component_gear[key]||[];const byName=new Map(existing.map(x=>[String(x.name).toLowerCase(),x]));(DATA.rods||[]).forEach(r=>{let n=kind==='Reels'?r[4]:kind==='Lines'?r[5]:kind==='Fly Boxes'?`Fly box — ${r[0]}`:`Field kit — ${r[0]}`;if(!n||n==='//')return;const k=String(n).toLowerCase();if(!byName.has(k))byName.set(k,{id:`${key}-${slug(n)}`,name:n,weight:'',cost:'',notes:'',sourceRod:r[0]});else if(!byName.get(k).sourceRod)byName.get(k).sourceRod=r[0]});const arr=[...byName.values()];DATA.component_gear[key]=arr;return arr};
  window.componentList=function(kind){let arr=componentRows(kind),componentTotal=arr.reduce((n,x)=>n+(Number(x.cost)||0),0),rodTotal=(DATA.rods||[]).reduce((n,r)=>n+(parseFloat(String(r[9]).replace(/[$,]/g,''))||0),0),allGear=rodTotal+Object.values(DATA.component_gear||{}).flat().reduce((n,x)=>n+(Number(x.cost)||0),0),weight=arr.reduce((n,x)=>n+(parseFloat(x.weight)||0),0);return shell(kind.toUpperCase(),`${kind} only — duplicate entries are automatically consolidated.`, `<div class="component-summary"><div><b>${arr.length}</b><span>${kind.toLowerCase()} recorded</span></div><div><b>$${componentTotal.toFixed(2)}</b><span>entered cost</span></div><div><b>${weight.toFixed(1)} oz</b><span>entered weight</span></div><div><b>${allGear?Math.round(componentTotal/allGear*100):0}%</b><span>of total gear cost</span></div></div><div class="card"><table class="table"><thead><tr><th>${kind.slice(0,-1)}</th><th>Linked rod</th><th>Weight oz</th><th>Cost</th><th>Share</th><th>Notes</th></tr></thead><tbody>${arr.map((x,i)=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.sourceRod||'—')}</td><td><input class="component-edit" value="${esc(x.weight||'')}" onchange="editComponent('${kind.toLowerCase()}',${i},'weight',this.value)"></td><td><input class="component-edit" type="number" value="${esc(x.cost||'')}" onchange="editComponent('${kind.toLowerCase()}',${i},'cost',this.value)"></td><td>${allGear?Math.round((Number(x.cost)||0)/allGear*100):0}%</td><td><input class="component-edit" value="${esc(x.notes||'')}" onchange="editComponent('${kind.toLowerCase()}',${i},'notes',this.value)"></td></tr>`).join('')}</tbody></table></div>`)};

  window.gear=function(){const rods=DATA.rods||[],total=rods.reduce((n,r)=>n+(parseFloat(String(r[9]).replace(/[$,]/g,''))||0),0),top=[...rods].sort((a,b)=>(parseFloat(String(b[9]).replace(/[$,]/g,''))||0)-(parseFloat(String(a[9]).replace(/[$,]/g,''))||0)).slice(0,6);return shell('Gear','Rod vault and connected component inventories.',`<div class="v18gear"><div class="v18rodgraphic"><div class="v18rodshaft"></div><div class="v18rodhandle"></div><div class="v18reel"><i></i></div><button onclick="go('rod-list')" class="v18part p-rod">RODS</button><button onclick="go('gear-reels')" class="v18part p-reel">REELS</button><button onclick="go('gear-lines')" class="v18part p-line">LINES</button><button onclick="go('gear-fly-boxes')" class="v18part p-box">FLY BOXES</button><button onclick="go('gear-field-kits')" class="v18part p-kit">FIELD KIT</button><div class="v18shaftlabel">CLICK A COMPONENT</div></div><div class="card"><h2>$${total.toLocaleString()}</h2><div class="eyebrow">ROD COLLECTION VALUE</div><p class="muted">18 supplied rod records • total uses the listed inventory price field.</p>${top.map(r=>{let v=parseFloat(String(r[9]).replace(/[$,]/g,''))||0;return `<div class="rodbar"><span>${esc(r[0])}</span><i style="width:${Math.max(3,Math.round(v/1500*100))}%"></i><b>$${v.toLocaleString()}</b></div>`}).join('')}</div></div>`)};

  window.flies=function(){return shell('Fly Tying','Patterns are indexed as individual records and can be opened from either Fly Tying or the Pattern Index.',`<div class="grid g2"><div class="card"><h2>Pattern Index</h2><p>${(DATA.flies||[]).length} seeded patterns.</p><button class="btn gold" onclick="go('fly-patterns')">OPEN INDEX</button></div><div class="card"><h2>Materials</h2><p>Materials, tying stock and purchase connections.</p><button class="btn" onclick="go('inventory')">OPEN MATERIALS</button></div></div><div class="flyindexgrid">${(DATA.flies||[]).map((x,i)=>{let n=typeof x==='string'?x:x.name||`Pattern ${i+1}`;return `<button class="flyindexitem" onclick="go('fly-${slug(n)}')"><b>${esc(n)}</b><span>${esc(typeof x==='object'?(x.species||x.materials||'Indexed pattern'):'Fly pattern')}</span></button>`}).join('')}</div>`) };

  window.research=function(){return shell('Research','Research hub separated into distinct desktop panels.',`<div class="researchv18">${doors([{k:'PODCASTS',t:'Podcast Notes',d:'Recorded trips and source journal.',page:'podcasts'},{k:'TECHNIQUE',t:'Experiments / To Do',d:'Experiments, rig ideas and practice.',page:'todo'},{k:'DOCUMENTS',t:'Master Research',d:'Destination, species and water research.',page:'destinations'},{k:'WHY I FISH',t:'Why I Fish',d:'Personal fishing philosophy.',page:'why-i-fish'},{k:'AI',t:'AI Archive',d:'Structured research capture.',page:'account'},{k:'RESOURCES',t:'External Resources',d:'Working links and resource landing pages.',page:'resources'}])}</div>`)};

  window.knotDetail=function(n){let p=n.replace(/^knot-/,'').replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());return shell(p,'Knot technique record.',`<div class="knotdetailv18"><div class="knotimage">DEMONSTRATION IMAGE / VIDEO<br><span>Reserved for uploaded knot demonstration.</span></div><div class="card"><h3>${esc(p)}</h3><p class="muted">Add technique notes, breaking-strength observations and a demonstration image/video to this record.</p><button class="btn" onclick="go('custom-icons-upload-guide')">UPLOAD DEMONSTRATION</button></div></div>`)};

  window.resources=function(){let shops=['Wild on the Fly','The Fly Shop — California','Emerald Water Anglers — Seattle','Frontier Angler','Montana Angler','Trident Fly Fishing'];let bookers=['Yellowdog','Fly Water Travel','Orvis','Fly Odyssey','Eleven Experiences','Nervous Waters','Aardvark Mcleod','Big Y Fly','Isolation Outfitters','Tight Loop Adventure','Shallow Water Expeditions','Tarpon Flats','Moccasin Fly Club','Sports Quest','World’s Best Fishing Trips','Slipstream Angling','African Waters','Fly Cast Away'];let linkCard=(x,i,type)=>`<button class="resourceitem" onclick="go('resource-${type}-${i}')"><b>${esc(x)}</b><span>OPEN LANDING PAGE →</span></button>`;return shell('Resources','Every resource first opens a Fish OS landing page with your notes, then provides the working external link.',`<div class="resourcegrid"><div class="card"><h2>Fly Shops / Operators</h2>${shops.map((x,i)=>linkCard(x,i,'shop')).join('')}</div><div class="card"><h2>Major Bookers</h2>${bookers.map((x,i)=>linkCard(x,i,'booker')).join('')}</div></div><div class="card" style="margin-top:14px"><h2>Imported Links</h2><div class="linksgrid">${(DATA.links||[]).map((x,i)=>`<button class="resourceitem" onclick="go('resource-link-${i}')"><b>${esc(x.title)}</b><span>${esc(x.tags||'')} →</span></button>`).join('')}</div></div>`) };
  const oldResourceData={shops:['Wild on the Fly','The Fly Shop — California','Emerald Water Anglers — Seattle','Frontier Angler','Montana Angler','Trident Fly Fishing'],bookers:['Yellowdog','Fly Water Travel','Orvis','Fly Odyssey','Eleven Experiences','Nervous Waters','Aardvark Mcleod','Big Y Fly','Isolation Outfitters','Tight Loop Adventure','Shallow Water Expeditions','Tarpon Flats','Moccasin Fly Club','Sports Quest','World’s Best Fishing Trips','Slipstream Angling','African Waters','Fly Cast Away']};
  window.resourceUrls={'Wild on the Fly':'https://wildonthefly.com/','The Fly Shop — California':'https://www.theflyshop.com/','Emerald Water Anglers — Seattle':'https://emeraldwateranglers.com/','Frontier Angler':'https://frontierangler.com/','Montana Angler':'https://www.montanaangler.com/','Trident Fly Fishing':'https://www.tridentflyfishing.com/','Yellowdog':'https://www.yellowdogflyfishing.com/','Fly Water Travel':'https://flywatertravel.com/','Orvis':'https://www.orvis.com/','Fly Odyssey':'https://flyodyssey.com/','Nervous Waters':'https://www.nervouswaters.com/','Aardvark Mcleod':'https://www.aardvarkmcleod.com/','Big Y Fly':'https://bigyflyco.com/','Isolation Outfitters':'https://isolationoutfitters.com/','Tight Loop Adventure':'https://tightloopadventures.com/','Shallow Water Expeditions':'https://shallowwaterexpeditions.com/','Tarpon Flats':'https://www.tarponflats.com/','Moccasin Fly Club':'https://moccasinflyclub.com/','Sports Quest':'https://www.sportsquest.com/','World’s Best Fishing Trips':'https://worldsbestfishingtrips.com/','Slipstream Angling':'https://slipstreamangling.com/','African Waters':'https://www.africanwaters.net/','Fly Cast Away':'https://www.flycastaway.com/'};window.resourceDetail=function(kind,i){let arr=kind==='shop'?oldResourceData.shops:oldResourceData.bookers;let x=arr[Number(i)];if(kind==='link'){let q=DATA.links?.[Number(i)];return shell(q?.title||'Resource','Fish OS resource landing page.',`<div class="card"><h2>${esc(q?.title||'Resource')}</h2><p>${esc(q?.tags||'')}</p>${q?.url?`<a class="btn gold" target="_blank" rel="noopener" href="${esc(q.url)}">OPEN WORKING LINK</a>`:''}</div>`)}let url=resourceUrls[x]||'';return shell(x||'Resource','Fish OS landing page.',`<div class="card"><h2>${esc(x||'Resource')}</h2><p>Add your personal notes, contact information, trip relevance and saved research here.</p>${url?`<p><a class="btn gold" target="_blank" rel="noopener noreferrer" href="${url}">OPEN WORKING RESOURCE LINK</a></p><p class="small muted">${esc(url)}</p>`:'<p class="muted">No external URL stored.</p>'}<button class="btn" onclick="go('resources')">BACK TO RESOURCES</button></div>`)};

  window.packing=function(){let trips=DATA.trips||[],sel=state.packTripId||(trips[0]?.id||'GENERAL');if(sel!=='GENERAL'&&!trips.some(t=>t.id===sel))sel='GENERAL';state.packTripId=sel;let p=sel==='GENERAL'?(state.packing||(state.packing=defaultTripPack())):ensureTripPack(sel),all=Object.values(p).flat(),done=all.filter(x=>x.done).length,totalWeight=all.reduce((n,x)=>n+(Number(x.qty)||0)*(Number(x.weight)||0),0);return shell('Packing','Trip-specific loadouts with an explicit trip manager.',`<div class="packtripbar"><label>TRIP <select id="packTripSelect" onchange="state.packTripId=this.value;localStorage.setItem('fishos_pack_trip',this.value);persistPack()">${['GENERAL',...trips.map(t=>t.id)].map(x=>`<option value="${esc(x)}" ${x===sel?'selected':''}>${esc(x)}</option>`).join('')}</select></label><button class="btn gold" onclick="addPackingTrip()">+ ADD TRIP</button><button class="btn" onclick="addPack()">+ ADD ITEM</button><span>${done}/${all.length} checked • ${totalWeight.toFixed(1)} oz</span></div><div class="packscreen">${Object.entries(p).map(([g,items])=>`<section class="packcat"><h3>${esc(g)}</h3>${items.map((x,i)=>`<div class="packitem ${x.done?'done':''}"><button class="packcheck" onclick="toggleTripPack('${esc(g)}',${i})">${x.done?'X':' '}</button><span>${esc(x.name)}<small>${esc(x.details||'')}</small></span><input class="qty" type="number" min="0" value="${x.qty||1}" onchange="qtyTripPack('${esc(g)}',${i},this.value)"><button class="packdel" onclick="delTripPack('${esc(g)}',${i})">DEL</button></div>`).join('')}</section>`).join('')}</div>`) };
  window.addPackingTrip=function(){let n=prompt('Trip name');if(!n)return;let id='trip-'+slug(n)+'-'+Date.now();DATA.trips.push({id,name:n,date:'',place:'',type:'Planning',targets:[]});ensureTripPack(id);state.packTripId=id;persistData();localStorage.setItem('fishos_pack_trip',id);render()};
  window.toggleTripPack=function(g,i){let p=state.packTripId==='GENERAL'?state.packing:ensureTripPack(state.packTripId);p[g][i].done=!p[g][i].done;persistPack()};
  window.qtyTripPack=function(g,i,v){let p=state.packTripId==='GENERAL'?state.packing:ensureTripPack(state.packTripId);p[g][i].qty=Math.max(0,Number(v)||0);persistPack()};
  window.delTripPack=function(g,i){let p=state.packTripId==='GENERAL'?state.packing:ensureTripPack(state.packTripId);p[g].splice(i,1);persistPack()};

  window.setPassword=function(){let pw=prompt('Set a new Fish OS password (8+ characters).');if(!pw)return;if(pw.length<8)return alert('Password must be at least 8 characters.');supaClient().then(async c=>{if(!c)return alert('Supabase connection is not configured.');let {error}=await c.auth.updateUser({password:pw});alert(error?error.message:'Password set. You can now use SIGN IN WITH PASSWORD.');});};
  window.account=function(){let logged=!!state.profile.loggedIn;return shell(logged?'Account / Signed In':'Log In','Supabase account and private storage connection.',`<div class="loginbox"><div class="card"><div class="eyebrow">FISH OS ACCOUNT</div><h2>${logged?'SIGNED IN':'LOG IN'}</h2><p class="muted">${logged?esc(state.profile.email||'Signed-in user'):'If your old magic link now opens Fish OS, check this page for SIGNED IN. You can then set a password without requesting another email.'}</p><div class="form"><input id="sburl" value="${esc(state.supabase.url||'')}" placeholder="Supabase Project URL"><input id="sbkey" value="${esc(state.supabase.key||'')}" placeholder="Supabase Publishable Key"><button class="btn" onclick="saveSupabase()">SAVE SUPABASE CONNECTION</button><input id="pemail" value="${esc(state.profile.email||'')}" placeholder="Email"><input id="ppass" type="password" placeholder="Password — 8+ characters"><button class="btn gold" onclick="passwordSignIn()">SIGN IN WITH PASSWORD</button><button class="btn" onclick="passwordSignUp()">CREATE PASSWORD ACCOUNT</button><button class="btn" onclick="magicLogin()">EMAIL ME A MAGIC LINK</button>${logged?`<button class="btn" onclick="setPassword()">SET / RESET MY PASSWORD</button><button class="btn" onclick="logoutSupabase()">LOG OUT</button>`:''}</div><div class="notice" style="margin-top:12px"><b>Redirect:</b><br><span class="mono small">${esc(location.origin+location.pathname)}</span><br><br>If no new email arrives, do not keep requesting links. Use the existing working magic link to establish the session, then SET / RESET MY PASSWORD.</div></div></div>`)};

  const baseRender=window.render;
  window.render=function(){baseRender(); const p=state.page; if(p.startsWith('resource-shop-'))document.getElementById('main').innerHTML=resourceDetail('shop',p.replace('resource-shop-','')); else if(p.startsWith('resource-booker-'))document.getElementById('main').innerHTML=resourceDetail('booker',p.replace('resource-booker-','')); else if(p.startsWith('resource-link-'))document.getElementById('main').innerHTML=resourceDetail('link',p.replace('resource-link-',''));};
})();
</script>
</body></html>

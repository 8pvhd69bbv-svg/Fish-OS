:#49665c}.row .title{font-weight:750}.row .meta{font-size:11px;color:var(--muted)}.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:14px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{border-bottom:1px solid var(--line);padding:9px 7px;text-align:left;vertical-align:top}.table th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em}.rodscene{min-height:320px;position:relative;overflow:hidden;background:linear-gradient(180deg,#0c1916,#08110f);border-radius:12px;border:1px solid var(--line)}.rod{position:absolute;left:7%;right:7%;top:43%;height:4px;background:linear-gradient(90deg,#8b7143,#d8b46a,#6b5032);transform:rotate(-8deg);box-shadow:0 0 20px #d8b46a33}.rod:after{content:'';position:absolute;right:0;top:-6px;width:62px;height:16px;border:2px solid #8fa39a;border-radius:50%;background:#0c1714}.rodpoint{position:absolute;border:1px solid var(--line);background:#101e1a;color:var(--text);padding:7px 9px;border-radius:7px;font-size:10px}.rp1{left:9%;top:30%}.rp2{left:35%;top:24%}.rp3{left:63%;top:57%}.rp4{right:9%;top:29%}.rp5{left:46%;bottom:18%}.map{min-height:300px;border:1px solid var(--line);border-radius:12px;position:relative;overflow:hidden;background:radial-gradient(circle at 40% 40%,#254d4033,transparent 25%),linear-gradient(145deg,#0a1512,#11211d)}.pin{position:absolute;width:12px;height:12px;border:2px solid var(--gold);background:#16221e;border-radius:50%;box-shadow:0 0 0 4px #d8b46a1a}.pin.a{left:28%;top:34%}.pin.b{left:48%;top:55%}.pin.c{left:71%;top:28%}.pin.d{left:61%;top:72%}.calendar{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}.calhead,.calcell{padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:88px}.calhead{min-height:auto;background:#101e1a;color:var(--muted);font-size:10px;text-transform:uppercase}.calcell b{font-size:11px}.event{display:block;margi <script>
const DATA={"version": "0.7", "system": "FISH OS", "project": "FLYS FOR FISH", "storage_note": "Seed/reference data. User-created browser records remain local until a real shared backend is connected.", "master_profile_text": "FISHING OS — USER CONTEXT / MASTER FISHING PROFILE\n\nUSER\n- 27-year-old male, Oregon.\n- Experienced fly fisherman, especially interested in predatory trout and steelhead.\n- Primary targets: Bull trout and large brown trout.\n- Secondary/high-priority targets: summer steelhead, tiger trout, big brook trout, trophy redbands, carp.\n- Wants factual, confident, well-cited fishing information.\n- Do not invent conditions, regulations, flows, weather, fish sizes, or historical data.\n- If data cannot be retrieved, explicitly say so.\n- User strongly prefers actual data and useful analysis over generic fishing advice.\n\nMASTER FISHING JOURNAL\nThe journal is intended to become a long-term angling database, not merely a trip diary.\n\nFor every trip, preserve:\n- Date\n- Waterbody\n- Exact/approximate location or named hole\n- Start/end time\n- Weather\n- Air temperature\n- Wind speed/direction\n- Cloud cover\n- Barometric pressure\n- Pressure trend\n- Moon phase/illumination\n- Sunrise/sunset\n- Rainfall\n- Days since measurable rain\n- River flow (cfs) where applicable\n- Flow trend\n- Water temperature where available\n- Water clarity\n- Tide for coastal fisheries\n- Fish seen\n- Fish landed\n- Fish lost\n- Approximate size\n- Species\n- Flies/lures\n- Presentation\n- Productive water\n- Wildlife/forage observations\n- Important behavioral observations\n- Lessons learned\n- Environmental/fishing correlations\n\nIMPORTANT:\nEnvironmental data should be retrieved from actual historical sources whenever possible. Do NOT fabricate or estimate historical weather, pressure, flow, rainfall, moon, or tide data and present it as observed data.\n\nPreferred environmental sources:\n- NOAA/NWS or reliable historical weather station data\n- USGS gauges for river flow and water temperature\n- NOAA tide data for coastal trips\n- Reliable astronomical data for moon phase/sunrise/sunset\n\nPreferred weather stations:\n- Nestucca: Hebo, Oregon\n- Metolius: Camp Sherman / nearest appropriate station\n- Upper Deschutes: La Pine / nearest appropriate station\n- East Lake/Diamond/Crane Prairie: nearest representative Central Oregon station\n- Imnaha: nearest appropriate station\n- Coastal fisheries: nearest representative coastal station\n\nSTEELHEAD TRACKING\nSteelhead are a major component of the journal.\n\nLower Deschutes:\n- 5-star personal goal: land a summer steelhead on the swing.\n- Track flows, recent rainfall, water temperature, timing, visibility, and fly/presentation.\n- Summer steelhead are a major priority.\n\nNestucca:\n- Track both summer and winter steelhead.\n- For every Nestucca entry, use Hebo weather.\n- Flow is considered particularly important.\n- Track recent rainfall and days since rain.\n- User specifically wants rainfall/flow incorporated into analysis.\n\nWilson:\n- Track winter and summer steelhead timing.\n- User will provide additional timing information later.\n\nTROUT PRIORITIES\n1. Bull trout — obsession / highest priority.\n2. Large brown trout — highest priority.\n3. Lower Deschutes summer steelhead — must land a summer fish on the swing.\n4. Huge tiger trout — 4-star priority.\n5. Big brook trout.\n6. Trophy redbands / Upper Klamath Basin.\n7. Carp.\n8. Winter steelhead.\n\nMAJOR OREGON FISHERIES OF INTEREST\n- Metolius River\n- Upper Deschutes / Cow Meadows\n- Crane Prairie Reservoir\n- Wickiup Reservoir\n- East Lake\n- Diamond Lake\n- Lake Billy Chinook\n- Lower Deschutes\n- Nestucca River\n- Wilson River\n- Upper Klamath Lake\n- Williamson River\n- Sprague River\n- Imnaha River\n- Wallowa River\n- Grande Ronde\n- Sauvie Island / Crane Lake\n- Oregon coastal jetty/rock fisheries\n\nMETOLIUS\n- User considers the Metolius a primary bull trout fishery.\n- River is spring-fed, extremely clear, and generally very stable.\n- User frequently fishes specific named locations including:\n  - Dolly Hole\n  - Pokenny Hole\n  - Aquarium Hole\n  - Lower Bridge / Bridge 99\n  - Long Jams\n  - Tailouts\n- User wants to investigate upper-river fishing immediately before seasonal closure, especially October, because of large lake-run bull trout moving upstream to spawn.\n- Big articulated streamers are extremely important.\n- User has repeatedly observed bull trout reacting to large white streamers.\n- User has learned that 10–12+ inch streamers can move fish that smaller 4–6 inch flies do not.\n- User has observed bull trout attacking hooked whitefish/trout.\n- User has observed bull trout attacking other hooked bull trout.\n- Important hypothesis to track: bull trout may respond strongly to streamers that dead-drift, stall, or contact the bottom rather than only actively swung/stripped flies.\n- User has observed major short feeding windows rather than continuous activity.\n- Tailouts may contain many bull trout at certain times, particularly around evening/night, then appear empty later.\n- User wants environmental conditions correlated with these behavioral observations.\n\nIMPORTANT METOLIUS JOURNAL OBSERVATIONS\nApril 8, 2024:\n- User considers this one of his best bull trout days and the day he \"cracked the code.\"\n- Caught multiple bulls.\n- Used huge ~12-inch articulated, often white flies.\n- Several big fish.\n- Saw fish chasing other fish.\n- Caught whitefish and had bull trout remain nearby and attack a streamer.\n- User believes 4–6 inch flies often fail to move the biggest fish.\n- This pattern has been difficult to reproduce and appears rare.\n\nMay 14, 2026:\n- Fished Metolius briefly.\n- Hooked whitefish in Dolly Hole.\n- Large bull immediately ate/attacked the whitefish.\n- Bull went extremely deep into euro rod backing.\n- User had to enter water to clear snags.\n- Ultimately landed the bull.\n- Around 7:30 PM.\n- No other whitefish sign noted.\n\nMay 26, 2026:\n- Fished roughly 2 PM–9 PM.\n- Water crystal clear / normal Metolius conditions.\n- Pokenny: saw at least two bulls; one repeatedly attempted to eat small rainbows user was catching.\n- Dolly Hole: no sign initially until whitefish was hooked.\n- ~4:20 PM caught a decent fish on euro setup with heavy jig Lunch Money streamer.\n- Shortly afterward caught ~16-inch fish on switch rod with indicator and golden stone.\n- Fished hard until dark.\n- Around 8:50 PM caught a massive bull in deep tailout on a swung fly.\n- Fish made multiple hard upstream runs.\n- Barely fit in Fishpond Mid-Length net; estimated >35 inches / 3x net basket length (size estimate uncertain).\n- This was NOT a sighting; it was a landed fish.\n- Important: user corrected earlier misunderstanding that this was a \"giant sighting.\"\n\nJune 15, 2025:\n- Pokenny Hole: bull around 18–20 inches at 9:44 AM.\n\nJune 16, 2025:\n- Dolly Hole: brown trout around 18 inches on a nymph.\n- Pokenny: bull around 22 inches at 6:55 AM.\n- Roadside deep bucket near campground pull-off: bull around 24 inches at 9:08 AM.\n- Saw golden stones on branches.\n\nJuly 5, 2025:\n- Around 9:27 PM caught a thick bull around 24 inches immediately below lower bridge.\n- 12+ inch yellow/white brush streamer.\n- Also caught a brown trout.\n\nSeptember 2025 Metolius:\n- September 23: very productive day, lots of fish/running.\n- Large colored-up trout estimated 25+ inches near Lake Creek.\n- Another smaller bull upper river around 1:47 PM.\n- September 24: bull around 20 inches in Long Jams below Dolly Hole around 10:48 PM.\n- Another afternoon session with Michael produced several rainbows.\n- User snapped rod.\n\nJuly 11, 2026:\n- Started ~5 PM.\n- Checked upstream spot without success, then Dolly Hole by ~5:30 PM.\n- Fished until ~1 hour after sunset (~9:51 PM).\n- Bull #1: 7:11 PM, 10-inch white streamer / red-wire \"Bully\" contraption.\n- Bull #2: 7:53 PM, basic white-on-white Dolly Llama.\n- Lost another small bull after another bull attacked it.\n- Strong bull frenzy roughly 7–8 PM.\n- Activity then died.\n- Walked to tailout and saw many bull trout eyes; described it as insane.\n- Next day saw no bull trout in lower tailout.\n- Possible otter observed rising.\n\nJuly 12, 2026:\n- Dolly Hole ~4:30–6:45 AM: one small bull on streamer, otherwise quiet.\n- Pokenny: moved one bull but no eat.\n- Lower Bridge: fished until around noon; no fish seen.\n- Aquarium Hole with Chase: moved fish; caught whitefish on nymph, followed by bull trout.\n- Dolly Hole ~6:30–10 PM: very slow, one bull observed.\n- Repeatedly saw a fish porpoising in same location.\n- Other anglers believed these were Chinook.\n- Another scarred fish with white patches was also believed to be Chinook.\n- User suspects a pair of Chinook may have been present.\n- Baby black bear observed.\n- Dolly tailout had no visible bull eyes, unusual compared with previous evening.\n\nJuly 14, 2026:\n- Dolly Hole ~9 AM–noon: no fish.\n- Around noon Bridge 99: Chase caught ~12-inch bull on spinner with minnow attached.\n- Pokenny around 3 PM: caught a couple rainbows, no big bull.\n- Aquarium Hole ~7–10 PM: caught two bulls, ~20 and ~18 inches.\n- Both on large white streamer in far tailout.\n\nJuly 15, 2026:\n- Dolly Hole ~5:30 AM–1 PM.\n- Around 6 AM: ~16-inch tagged bull on swung Sparkle Minnow.\n- Hooked a substantially larger bull on switch rod indicator with small caddis Perdigon; fish made hard run and broke off.\n- Saw many fish in tailout in morning.\n- Fish seemed to move forward into hole as morning progressed, while some remained deep/far tailout under logs.\n- Around 10:20 AM activity suddenly increased for ~30 minutes.\n- Hooked approximately seven bull trout.\n- Landed three.\n- Largest approximately 27 inches.\n- A ~20-inch bull ate large white streamer; larger bull attacked it and both were hooked briefly before smaller fish came off.\n- Alternated 12–14 inch white streamer and 15-inch olive streamer.\n- Olive generated interest from two fish.\n- User believes hooks are too large and contributed to losses.\n- Important observation: bull trout repeatedly showed willingness to attack streamer when it was dead-drifted or even snagged on bottom.\n- Fish could appear from nowhere to eat a fly resting near bottom.\n- User wants to determine better presentation.\n- Fished holes below Dolly with large white streamer and got no eats.\n- Lower Bridge ~2:30–3:30 PM: no bulls on large white streamer.\n\nUPPER DESCHUTES / COW MEADOWS\nMay 24, 2026:\n- Fished Cow Meadows.\n- Large brook trout present.\n- Landed one easy ~18-inch brook trout.\n- Jig streamer, Sparkle Minnow / minnow color, worked in logs and undercuts.\n- Many looks/eats.\n- Estimated ~20 fish landed in ~4 hours.\n- Unclear whether any were rainbows.\n- Floated lake in pontoon in morning; okay fishing.\n- Spooked many fish.\n- Could not initially find deep water; fish were holding in weeds.\n- Caught one while stripping a leech sight-fishing to a decent brook trout.\n- User believes there are large brook trout moving toward Cow Meadows.\n- User has interest in timing these fish around late summer/fall.\n\nJune/July 2025:\n- July 6, 2025: Three Creeks Lake with Michael and Grace. Caught several brookies and rainbows. Decent day. Tons of mosquitoes, mostly not on water.\n\nSeptember 8, 2025:\n- Cow Meadows / Upper Deschutes.\n- One of user's first times there.\n- Very good brook trout fishing.\n- Euro rig with jig white baitfish pattern and ~4.5 mm orange hot-head bead.\n- Many brook trout, average ~11 inches.\n- One nice rainbow ~18 inches.\n- Weather sunny and warm.\n\nLAKE BILLY CHINook\nApril 26, 2026:\n- Tried stripping flies and bobbers in lake; no bulls.\n- Went up Deschutes Arm.\n- Saw many suckers.\n- Caught several rainbows, one brown, and one bull around 17 inches.\n- Bull caught ~10:50 AM.\n\nSAUVIE ISLAND / CARP\nMay 11, 2026:\n- Crane Lake, Sauvie Island.\n- Landed 3 carp.\n- Tons of activity.\n- Orange woolly-bugger-like fly.\n- Fly had no hackle and may have been craw-style.\n\nJune 1, 2026:\n- Sauvie Island carp.\n- Much less activity than previous outing.\n- Saw only a few fish.\n- Zero hookups / approximately one real shot.\n- User wants weather, pressure, moon phase, temperature and environmental data tracked for every carp trip.\n\nNESTUCCA\nJune 30, 2026:\n- Wade fishing.\n- Started ~11:30 AM.\n- Mostly walked and threw spinners.\n- Lower river.\n- Pink #2 Blue Fox spinner.\n- Moved one jack (~20\").\n- Landed at least 10 coastal cutthroat.\n- Little/no wind, overcast.\n- Big corner hole on lower river below bridge produced steelhead.\n- Saw approximately five or more bright steelhead.\n- Fish interested in spinner after ~1 hour.\n- Lost one immediately on hookset with pink #2.\n- Changed to blue #3 Blue Fox.\n- Landed one steelhead at 6:18 PM.\n- 29 inches, 14.5-inch girth.\n- Approximate weight should be calculated using an appropriate steelhead length/girth formula, with uncertainty clearly stated.\n- Continued until ~7:30 PM.\n- No additional fish.\n- Checked \"Newt Hole\" on way out with same spinner, no action.\n- IMPORTANT: Use Hebo weather for Nestucca.\n- Track river flow and recent rainfall because user believes they are critical for coastal steelhead.\n\nJuly 4, 2026:\n- Approximately 9 AM–6 PM.\n- Covered lots of water on foot.\n- Mainly spinners.\n- Lower river: only one steelhead observed.\n- Above CJ's Hole: saw ~3 steelhead and one Chinook.\n- Landed one Chinook on spinner.\n- User wants flow and recent rainfall tracked for this fishery.\n- \"Big Corner Hole\" below bridge is an unnamed location; user may want to name it later.\n\nIMNAHA / WALLOWA\nSeptember 17–18, 2025:\n- Fished Imnaha River for bull trout.\n- Blue Hole.\n- Bull trout fishing was very hot.\n- Many bulls.\n- Several 26+ inch fish.\n- Fish appeared strongly associated with spawning activity.\n- Trip occurred under overcast conditions.\n- User wants to return despite distance and somewhat rough logistics.\n- September 17 fished Wallowa River while driving over.\n- Did well on rainbow trout.\n\nBIG HORN RIVER\nSeptember 20, 2025:\n- Rented boat and floated Bighorn River.\n- Very good day.\n- Many rainbows and a few nice browns.\n- Jerk-stripping a leech over weed beds was highly effective on rainbows.\n- User was primarily targeting browns.\n- Include this in destination/travel fishing journal.\n\nBELIZE\nMarch 21–April 1, 2025:\n- Belize / Caye Caulker area.\n- Overall trip was great; fishing was lackluster.\n- Lost ~30 lb tarpon at boat.\n- Caught a few small bonefish.\n- Missed permit.\n- Saw/missed opportunity at pair of 150+ lb tarpon crushing flats.\n- User considers this an important missed-opportunity trip.\n- Future Belize/Caye Caulker trip is a major travel fishing interest.\n\nBAJA / LA PAZ\nApril 3–8, 2026:\n- Six days fishing around La Paz, Mexico.\n- Landed approximately 50 roosterfish.\n- User's largest rooster approximately 20 lb.\n- Friend/buddy landed approximately 55–60 lb rooster.\n- 30 lb fluorocarbon straight through was considered key.\n- Many pelicans.\n- Needlefish bait was a major issue on at least one day.\n- Large jacks: three very large jacks landed/encountered.\n- One skipjack tuna.\n- Buddy caught one mahi.\n- User saw only one mahi.\n- Many triggerfish.\n- Saw bonefish.\n- Heard rumors of permit.\n- User knows region also has tuna, amberjack, golden trevally, etc.\n- Trip coincided with a busy Mexican holiday weekend.\n- Roosterfish beaches were very busy, which user believes hurt fishing.\n- User observed from social media that larger roosterfish activity increased substantially after departure, along with mahi activity.\n- User suspects trip was slightly before peak big-rooster activity.\n- User may add more detailed Baja notes later.\n\nCOASTAL JETTY / ROCKFISH\nJune 16, 2026:\n- Fished jetty most of day, approximately 8 AM–4 PM.\n- Fishing initially slow.\n- One fish right away, then several-ho function list(items,fn){return `<div class="list">${items.map((x,i)=>`<div class="row" onclick="${fn(i)}"><div><div class="title">${esc(x.title||x.name||x)}</div><div class="meta">${esc(x.meta||'')}</div></div><span class="muted">›</span></div>`).join('')}</div>`}
function home(){return `<div class="hero"><div><div class="eyebrow">PRIVATE FISHING COMMAND CENTER</div><h1>FISH OS</h1><p>A wormhole into the entire FLYS FOR FISH world: trips, fish, waters, flies, gear, research and future destinations.</p></div><button class="btn gold" onclick="quick()">+ QUICK ADD</button></div><div class="stats">${[['14','Trips'],['31','Days fished'],['128','Hours'],['1,940','Miles'],['67','Fish logged'],['55','Species caught'],['24','Waters']].map(a=>`<div class="stat"><b>${a[0]}</b><span>${a[1]}</span></div>`).join('')}</div><div class="grid g3" style="margin-top:14px">${doors([{k:'NEXT',t:'Katmai Trophy Lodge',d:'August 8–15 • Coho, Dolly Varden, rainbow, grayling, salmon.',page:'trip-katmai'},{k:'GOAL',t:'Summer Steelhead',d:'Lower Deschutes swing program and coastal Oregon steelhead.',page:'fish-steelhead'},{k:'RESEARCH',t:'World Destination Atlas',d:'Country-by-country fly fishing research, operators and links.',page:'destinations'},{k:'SPECIES',t:'143-species tracker',d:'55 caught • 88 not caught • species families and targets.',page:'journal-fish'},{k:'GEAR',t:'Rod Vault',d:'18-rod inventory with reel, line, purpose, species and price.',page:'gear'},{k:'FIELD',t:'Wickiup Brown Trout',d:'Spring arm observations, streamer window, eggs and bank-hugging big fish.',page:'location-wickiup'}])}</div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Fishing map</h3><div class="map"><i class="pin a"></i><i class="pin b"></i><i class="pin c"></i><i class="pin d"></i></div></div><div class="card"><h3>Big fish / recent</h3>${list([{title:'29 in steelhead — Upper Nestucca',meta:'Blue Fox spinner • 14.5 in girth'},{title:'24+ in brown — Wickiup',meta:'Streamer • spring arm'},{title:'24+ in rainbow — Wickiup',meta:'Spring arm • low water'}],i=>`go('journal-entry-${i}')`)}</div></div>`}
function trips(){let ts=(DATA.trips||[]).map((x,i)=>({title:x.name||x.title||`Trip ${i+1}`,meta:[x.location,x.date,x.species].filter(Boolean).join(' • ')}));ts.push({title:'Katmai Trophy Lodge',meta:'Aug 8–15 • Alaska • Coho / char / rainbows'});return shell('Trips','Every trip becomes a workspace with field log, journal, fish, media, gear, flies and research connections.',`<div class="toolbar"><button class="btn gold" onclick="quick('trip')">+ Trip</button><button class="btn" onclick="go('calendar')">Calendar</button><button class="btn" onclick="go('packing')">Packing</button></div>${list(ts,i=>i===ts.length-1?`go('trip-katmai')`:`go('trip-${i}')`)}`)}
function tripDetail(k){let kat=k==='katmai';let title=kat?'Katmai Trophy Lodge — Aug 8–15':'Trip workspace';let body=kat?`<div class="grid g3"><div class="card"><h3>Overview</h3><div class="tag gold">ALASKA</div><div class="tag">Aug 8–15</div><p class="muted">Coho • Dolly Varden • Rainbow • Grayling • Chum • Pink • Sockeye • Kings</p></div><div class="card"><h3>Field log</h3><p>Coho were hit and miss. King Salmon Creek and Big Creek were fun. Main Naknek ranged low to high.</p><p>Biggest rainbow noted at Moraine; huge Brooks fish were hard to hook and land.</p></div><div class="card"><h3>Connections</h3><button class="btn" onclick="go('fish-steelhead')">Species tracker</button> <button class="btn" onclick="go('gear')">Gear</button> <button class="btn" onclick="go('research')">Research</button></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Waters</h3>${list(['Moraine','Brooks','Margot / Margo Creek','Big Creek','King Salmon Creek','Upper Naknek','Main Naknek'],i=>`go('location-${i}')`)}</div><div class="card"><h3>Notes</h3><p>Arctic char: not around. Consider Frank’s Lake section.</p><p>Lake trout: hard to dial in; big fish elusive.</p><p>Pike: main lake on a calm day.</p><p>Morraine float guide: Braden • MillerTimeFlies • (804)-774-1548</p></div></div>`:`<div class="empty">Trip record workspace. Use Quick Add to create a trip and then connect location, fish, flies, gear, photos and research.</div>`;return shell(title,'Deep trip workspace',body,`<button class="btn gold" onclick="quick('journal')">+ Field Note</button>`)}
function fish(){let groups=[['Trout',['Brown trout','Rainbow trout','Cutthroat','Redband Trout','Lahontan cutthroat','Westslope Cutthroat','Yellowstone Cutthroat','Coastal Cutthroat','Marble Trout','Softmouth Trout','Sevsan trout']],['Char',['Bull trout','Brook trout','Arctic Char','Dolly Varden','Lake Trout','White Spotted Char','Stone Char','Yellowmouth char']],['Salmon',['Steelhead','Coho','Chinook','Chum salmon','Sockeye','Kokanee','Pink','Atlantic salmon','Masu / Cherry']],['Warmwater',['Northern Pike','Musky','Smallmouth bass','Large Mouth','Carp','Sunfish','Walleye']],['Saltwater',['Snook','Bonefish','Tarpon','Jack','Horse Eye Jack','Roosterfish','Skipjack Tuna','GT','Permit','Triggerfish','Mahi Mahi','Barracuda','Needle Fish']]];return shell('Journal + Fish','Combined field journal and species tracker. 143 tracked species in the current master list.',`<div class="stats"><div class="stat"><b>55</b><span>Caught</span></div><div class="stat"><b>88</b><span>Not caught</span></div><div class="stat"><b>143</b><span>Total</span></div><div class="stat"><b>38.5%</b><span>Completion</span></div></div><div class="grid g2" style="margin-top:14px">${groups.map(g=>`<div class="card"><h3>${g[0]}</h3>${list(g[1].map(x=>({title:x,meta:speciesStatus(x)})),i=>`go('species-${slug(g[1][i])}')`)}</div>`).join('')}</div><div class="card" style="margin-top:14px"><h3>Recent journal</h3>${list([{title:'Wickiup spring arm',meta:'24+ brown + 24+ rainbow • streamer window • eggs'}, {title:'Metolius Dolly Hole',meta:'Two bull trout • 10 in white streamer + Dolly Llama'}, {title:'Upper Nestucca steelhead',meta:'29 in / 14.5 in girth • blue Fox spinner'}],i=>`go('journal-entry-${i}')`)}</div>`)}
function slug(x){return x.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function speciesStatus(x){let yes=['Brown trout','Rainbow trout','Cutthroat','Bull trout','Brook trout','Dolly Varden','Steelhead','Coho','Chinook','Chum salmon','Sockeye','Kokanee','Pink','Smallmouth bass','Northern Pike','Sunfish','Snook','Bonefish','Tarpon','Jack','Horse Eye Jack','Roosterfish','Skipjack Tuna','Needle Fish','Barracuda'];return yes.includes(x)?'CAUGHT':'TARGET'}
function speciesDetail(name){let pretty=name.replace(/^species-/,'').replace(/-/g,' ');pretty=pretty.split(' ').map(x=>x?x[0].toUpperCase()+x.slice(1):x).join(' ');let notes={"steelhead":'Oncorhynchus mykiss irideus • caught in Oregon. Wet fly / swing notes: downstream 45°, broadside presentation, 12–16 lb leader not shy, 5–10 ft sink tip notes.',"brown trout":'High priority. Wickiup: large fish close to bank in ~1 ft water; streamer produced a 24+ inch fish in the short morning window; egg/bobber presentation is a current thought.',"bull trout":'High priority. Metolius is a key water; Wenaha, Lostine, McKenzie, Clackamas and Bumping Lake are also tracked.'};return shell(pretty,'Species record with catches, locations, flies, tactics and research.',`<div class="grid g3"><div class="card"><h3>Status</h3><span class="tag gold">${speciesStatus(pretty)}</span><p class="muted">Species family / scientific name fields can be expanded as the tracker is normalized.</p></div><div class="card"><h3>Connected waters</h3>${list((pretty.toLowerCase()==='steelhead'?['Nestucca River','Wilson River','Grande Ronde','Lower Deschutes']:pretty.toLowerCase()==='brown trout'?['Wickiup','Lake Paulina','East Lake','Crane Prairie?','Tree Creek Lake']:['Oregon','Alaska','Montana']).map(x=>({title:x})),i=>`go('location-${slug(pretty)}-${i}')`)}</div><div class="card"><h3>Connected flies</h3>${list((pretty.toLowerCase()==='bull trout'?['Warpath Tomahawk','Plante’s Misdemeanor','Baby Got Bead','Heisenberg','Hawkins Hat Trick']:['Streamers','Egg patterns','Dry flies']).map(x=>({title:x})),i=>`go('fly-${slug(pretty)}-${i}')`)}</div></div><div class="card" style="margin-top:14px"><h3>Field notes</h3><p>${esc(notes[pretty.toLowerCase()]||'No detailed species note has been normalized yet. The raw master tracker remains the source record.')}</p></div>`)}
function locations(){let ls=['Wickiup','Metolius','Upper Nestucca','Lower Deschutes','Bighorn River','Big Spring Creek','Lake Paulina','East Lake','Bumping Lake','Moraine','Brooks','Margot Creek'];return shell('Locations','Waters are hubs: trips, conditions, fish, flies, gear, photos, video, research and maps all connect here.',`<div class="split"><div>${list(ls.map(x=>({title:x,meta:'Water workspace'})),i=>`go('location-${slug(ls[i])}')`)}</div><div class="map"><i class="pin a"></i><i class="pin b"></i><i class="pin c"></i><i class="pin d"></i></div></div>`)}
function locationDetail(n){let p=n.replace(/^location-/,'').replace(/-/g,' ');p=p.replace(/\b\w/g,c=>c.toUpperCase());let w=p.toLowerCase().includes('wickiup');return shell(p,'Location hub — every related record lives one click away.',`<div class="grid g4">${doors([{k:'TRIPS',t:'Trips here',d:'Open trip records connected to this water.',page:'trips'},{k:'FISH',t:'Fish here',d:'Species, size and catch records.',page:'journal-fish'},{k:'FLIES',t:'Flies here',d:'Patterns and tactics that worked.',page:'fly-tying'},{k:'RESEARCH',t:'Research',d:'Notes, links and maps.',page:'research'}])}</div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Field notes</h3><p>${w?'Hundreds of fish stacked into a spring-fed arm. Low water and murky spring influence. Big browns close to the bank; 12–22 inch browns farther out. Streamer produced a 24+ brown and a large rainbow in a short morning window. Egg patterns were the most consistent general success.':'Location-specific notes are ready for expansion from the master research archive.'}</p></div><div class="card"><h3>Open connections</h3><button class="btn" onclick="go('maps')">Map</button> <button class="btn" onclick="go('calendar')">Season</button> <button class="btn" onclick="go('gear')">Gear</button></div></div>`)}
function calendar(){let months=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];return shell('Calendar','Seasonality, trips and fishing windows. 2026 view.',`<div class="calendar">${['SUN','MON','TUE','WED','THU','FRI','SAT'].map(x=>`<div class="calhead">${x}</div>`).join('')}${Array.from({length:35},(_,i)=>{let d=i-2;let ev=d===8?'KATMAI':d===21?'STEELHEAD':'';return `<div class="calcell"><b>${d>0&&d<=31?d:''}</b>${ev?`<span class="event">${ev}</span>`:''}</div>`}).join('')}</div><div class="grid g3" style="margin-top:14px">${months.map((m,i)=>`<div class="door" onclick="go('calendar-${i+1}')"><div class="kicker">2026</div><h3>${m}</h3><p>Open seasonal fishing workspace.</p></div>`).join('')}</div>`)}
function maps(){return shell('Maps','Map layer index for waters, access, waypoints and research.',`<div class="map" style="min-height:430px"><i class="pin a"></i><i class="pin b"></i><i class="pin c"></i><i class="pin d"></i></div><div class="grid g3" style="margin-top:14px">${doors([{k:'ONX',t:'ONX layer',d:'Access and property research.',page:'resources'},{k:'GOOGLE EARTH',t:'Google Earth',d:'Destination scouting and waypoints.',page:'resources'},{k:'USGS / NOAA',t:'Conditions',d:'Flow, water and weather sources.',page:'resources'}])}</div>`)}
function flies(){return shell('Fly Tying','Patterns, materials, fly photos and tying knowledge — all linked to fish and trips.',`<div class="grid g4">${doors([{k:'PATTERNS',t:'Patterns',d:`${DATA.flies.length} named patterns in current load.`,page:'fly-patterns'},{k:'MATERIALS',t:'Materials',d:'Inventory and purchase connections.',page:'inventory'},{k:'PHOTOS',t:'Fly photos / Best Of',d:'Visual pattern library.',page:'photos'},{k:'KNOWLEDGE',t:'Tying knowledge',d:'Techniques, designers and notes.',page:'research'}])}</div><div class="card" style="margin-top:14px"><h3>Pattern index</h3>${list(DATA.flies.map(x=>({title:x,meta:'Fly pattern'})),i=>`go('fly-${slug(DATA.flies[i])}')`)}</div>`)}
function flyPatterns(){return shell('Fly Patterns','Pattern record list.',list(DATA.flies.map(x=>({title:x,meta:'Materials • tying notes • fish • trips'})),i=>`go('fly-${slug(DATA.flies[i])}')`))}
function flyDetail(n){let p=n.replace(/^fly-/,'').replace(/-/g,' ');p=p.replace(/\b\w/g,c=>c.toUpperCase());return shell(p,'Pattern workspace.',`<div class="grid g3">${doors([{k:'TYING',t:'Tying recipe',d:'Materials, hook, thread and steps.',page:'research'},{k:'FISH',t:'Fish caught',d:'Species records using this pattern.',page:'journal-fish'},{k:'INVENTORY',t:'Inventory',d:'Count and material dependencies.',page:'inventory'}])}</div><div class="card" style="margin-top:14px"><h3>Raw pattern note</h3><p class="muted">The master archive currently preserves this pattern name. Recipe fields can be filled through Quick Add without changing the raw record.</p></div>`)}
function gear(){return shell('Gear','Interactive rod vault plus reels, lines, fly boxes, waders and saltwater gear.',`<div class="split"><div class="rodscene"><div class="rod"></div>${[['rp1','ROD'],['rp2','LINE'],['rp3','REEL'],['rp4','FLY BOXES'],['rp5','WADERS']].map(([c,t])=>`<button class="rodpoint ${c}" onclick="go('gear-${t.toLowerCase().replace(' ','-')}')">${t}</button>`).join('')}</div><div class="card"><h3>Collection</h3><div class="stat"><b>$11,625</b><span>Listed rod value</span></div><p class="muted">18 rod records loaded. Uncertain fields retain ?, ??, ^^^ and // exactly as supplied.</p><button class="btn gold" onclick="go('rod-list')">Open rod inventory</button></div></div><div class="card" style="margin-top:14px"><h3>Rod inventory</h3>${list(DATA.rods.map(r=>({title:r[0],meta:`${r[1]} • ${r[2]} ${r[3]} • ${r[7]} • ${r[8]}`})),i=>`go('rod-${i}')`)}</div>`)}
function rodList(){return shell('Rod Inventory','Complete current rod collection.',`<table class="table"><thead><tr><th>Nickname</th><th>WT</th><th>Brand</th><th>Model</th><th>Reel</th><th>Line</th><th>Purpose</th><th>Species</th><th>Price</th></tr></thead><tbody>${DATA.rods.map((r,i)=>`<tr onclick="go('rod-${i}')" style="cursor:pointer">${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="notice" style="margin-top:12px">Buy: ${DATA.buy_rods.map(esc).join(' • ')}</div>`)}
function rodDetail(i){let r=DATA.rods[Number(i)]||DATA.rods[0];return shell(r[0],'Individual gear record.',`<div class="grid g3">${[['Weight',r[1]],['Brand',r[2]],['Model',r[3]],['Current reel',r[4]],['Line',r[5]],['Purpose',r[6]],['Species',r[7]],['Price',r[8]]].map(a=>`<div class="card"><div class="muted small">${a[0]}</div><h3>${esc(a[1])}</h3></div>`).join('')}</div>`)}
function inventory(){return shell('Inventory','Counted flies, materials, tippet, leaders and gear.',`<div class="grid g4">${doors([{k:'FLIES',t:'Fly inventory',d:'Patterns, counts and boxes.',page:'fly-patterns'},{k:'MATERIALS',t:'Materials',d:'Tying stock and purchase needs.',page:'purchases'},{k:'TIPPET',t:'Tippet / leaders',d:'Fluoro, mono and sizes.',page:'tippet'},{k:'GEAR',t:'Gear',d:'Rods, reels, lines and field kit.',page:'gear'}])}</div><div class="card" style="margin-top:14px"><h3>Known buy queue</h3>${list(DATA.buy.map(x=>({title:x,meta:'Purchase / inventory link'})),i=>`go('purchase-${i}')`)}</div>`)}
function purchases(){return shell('Purchases + Warranties','Buy queue and gear purchase records.',`<div class="card"><h3>Current buy list</h3>${list(DATA.buy.map(x=>({title:x})),i=>`go('purchase-${i}')`)}</div><div class="card" style="margin-top:14px"><h3>Reel watchlist</h3><p>5 wt Guru S olive • 7 wt Guru S Blue • 8 wt Ross Evolution R Salt Blue $695 • 9 wt replacement • 8 wt Spey • 11/12 wt backing.</p><p class="muted">Brands noted: Hatch, Shilton, Nautilus, Ross, Hardy, Abel, Tibor, Bauer.</p></div>`)}
function research(){return shell('Research','Raw notes, podcasts, links, experiments and AI-ready research.',`<div class="grid g3">${doors([{k:'PODCASTS',t:'Podcast notes',d:'Fly fishing destinations, Fish Tips and technique notes.',page:'podcasts'},{k:'TECHNIQUE',t:'Experiments / To Do',d:'Prototype streamers, Carolina rig, donkey rig, practice knots.',page:'todo'},{k:'DOCUMENTS',t:'Master research',d:'Country atlas, species notes and destination research.',page:'destinations'},{k:'WHY I FISH',t:'Why I fish',d:'Personal fishing philosophy and long-form writing.',page:'why-i-fish'},{k:'AI',t:'AI Archive',d:'Structured prompts and research capture.',page:'account'},{k:'RESOURCES',t:'External resources',d:'Shops, bookers, operators, podcasts and maps.',page:'resources'}])}</div>`)}
function resources(){let shops=['Wild on the Fly','The Fly Shop — California','Emerald Water Anglers — Seattle','Frontier Angler','Montana Angler','Trident Fly Fishing'];let bookers=['Yellowdog','Fly Water Travel','Orvis','Fly Odyssey','Eleven Experiences','Nervous Waters','Aardvark Mcleod','Big Y Fly','Isolation Outfitters','Tight Loop Adventure','Shallow Water Expeditions','Tarpon Flats','Moccasin Fly Club','Sports Quest','World’s Best Fishing Trips','Slipstream Angling','African Waters','Fly Cast Away'];return shell('Resources','Fly shops, booking operators, guides, podcasts and field resources.',`<div class="grid g2"><div class="card"><h3>Fly shops / operators</h3>${list(shops.map(x=>({title:x})),i=>`go('resource-${i}')`)}</div><div class="card"><h3>Major bookers</h3>${list(bookers.map(x=>({title:x})),i=>`go('resource-booker-${i}')`)}</div></div><div class="card" style="margin-top:14px"><h3>Specific contacts</h3><p>Braden — Moraine float guide — MillerTimeFlies — (804)-774-1548</p><p>Frank Day — Nestucca steelhead</p><p>Dan Smith — How to Catch Any Fish</p><p>Chad See — Fly Rod Chronicles filmmaker / producer</p></div>`)}
function destinations(){return shell('Destinations','World fly-fishing atlas: targets, operators, species and your own verdicts.',`<div class="toolbar"><button class="btn gold" onclick="quick('destination')">+ Destination</button><button class="btn" onclick="go('destinations-top')">Top targets</button><button class="btn" onclick="go('destinations-bust')">Bust / caution</button></div><div class="grid g4">${DATA.destinations.map(x=>`<div class="door" onclick="go('destination-${slug(x)}')"><div class="kicker">DESTINATION</div><h3>${esc(x)}</h3><p>Open destination workspace.</p></div>`).join('')}</div>`)}
function destinationDetail(n){let p=n.replace(/^destination-/,'').replace(/-/g,' ');p=p.replace(/\b\w/g,c=>c.toUpperCase());let special={"ana atoll":'Anaa Atoll — $5,500 / 7 day note; Emerald Water Anglers, Fly Odyssey, Jeff Currier and Big Y references.',"los roques":'Los Roques — tarpon, bonefish, permit, trigger, jacks, cuda, snook; bluewater tuna, dolphin, wahoo and billfish.',"nubian flats / sudan":'Nubian Flat — triggerfish, GT, Bohar snapper, bluefin trevally, permit, milkfish, bumphead parrotfish, huge bonefish and dogtooth tuna.',"christmas island":'Christmas Island — villages, 1:1 guide note, Ikari House. Waypoints episode notes include low-tide / water movement observations.'};let key=p.toLowerCase();return shell(p,'Destination workspace.',`<div class="grid g3">${doors([{k:'SPECIES',t:'Target species',d:'Species connected to this destination.',page:'journal-fish'},{k:'OPERATORS',t:'Operators / bookers',d:'Open known booking and guide references.',page:'resources'},{k:'RESEARCH',t:'Research notes',d:'Open all captured notes and links.',page:'research'}])}</div><div class="card" style="margin-top:14px"><h3>Current notes</h3><p>${esc(special[key]||'Country / destination notes are retained in the master atlas. Add specific water, operator, cost, access and verdict records as research continues.')}</p></div>`)}
function knots(){return shell('Knots','Knot library organized by connection type.',`<div class="grid g3">${DATA.knots.map(x=>`<div class="door" onclick="go('knot-${slug(x)}')"><div class="kicker">KNOT</div><h3>${esc(x)}</h3><p>Open technique record.</p></div>`).join('')}</div>`)}
function knotDetail(n){let p=n.replace(/^knot-/,'').replace(/-/g,' ');p=p.replace(/\b\w/g,c=>c.toUpperCase());return shell(p,'Knot technique record.',`<div class="card"><h3>Notes</h3><p class="muted">The master notes include breaking-strength observations, use cases and connection categories. Preserve the raw values while the knot library is normalized.</p></div>`)}
function packing(){return shell('Packing','Reusable field packing checklist.',`<div class="grid g3">${DATA.packing.map((x,i)=>`<div class="door"><div class="kicker">PACK</div><h3>${esc(x)}</h3><p>Checklist item</p></div>`).join('')}</div>`)}
function why(){return shell('Why I Fish','Long-form personal fishing philosophy.',`<div class="card"><p>${esc(DATA.master_note)}</p></div>`)}
function account(){return shell('Account','Identity and data-storage layer.',`<div class="loginbox"><div class="card"><h2>Local account</h2><p class="muted">Current prototype stores records in this browser. The interface is ready for a real account backend; GitHub Pages alone cannot securely provide multi-user authentication or shared cloud storage.</p><div class="form"><input id="pname" value="${esc(state.profile.name)}" placeholder="Name"><input id="pemail" value="${esc(state.profile.email)}" placeholder="Email"><button class="btn gold" onclick="saveProfile()">Save profile</button><button class="btn" onclick="clearLocal()">Reset local data</button></div></div></div>`)}
function quick(kind='note'){return alert('Quick Add '+kind+' — form layer is next. The data model is already separated for account-scoped records.')}
function saveProfile(){state.profile.name=document.getElementById('pname').value||'Local Angler';state.profile.email=document.getElementById('pemail').value||'local@fishos';localStorage.setItem('fishos_profile',JSON.stringify(state.profile));render()}
function clearLocal(){if(confirm('Reset local Fish OS demo data?')){localStorage.removeItem('fishos_profile');localStorage.removeItem('fishos_records');location.reload()}}
function back(){if(state.stack.length)state.page=state.stack.pop();else state.page='home';render()}
function go(p){if(p===state.page)return;state.stack.push(state.page);state.page=p;render();window.scrollTo(0,0)}
function render(){side();mobile();let p=state.page,body='';if(p==='home')body=home();else if(p==='trips')body=trips();else if(p==='trip-katmai')body=tripDetail('katmai');else if(p.startsWith('trip-'))body=tripDetail(p);else if(p==='journal-fish')body=fish();else if(p.startsWith('species-'))body=speciesDetail(p);else if(p.startsWith('journal-entry'))body=shell('Journal Entry','Field note workspace.',`<div class="card"><h3>Field note</h3><p>Open and expand the original journal record here. This is where photos, fish measurements, conditions, flies and exact location become linked records.</p></div>`);else if(p==='locations')body=locations();else if(p.startsWith('location-'))body=locationDetail(p);else if(p==='calendar'||p.startsWith('calendar-'))body=calendar();else if(p==='maps')body=maps();else if(p==='fly-tying')body=flies();else if(p==='fly-patterns')body=flyPatterns();else if(p.startsWith('fly-'))body=flyDetail(p);else if(p==='gear')body=gear();else if(p==='rod-list')body=rodList();else if(p.startsWith('rod-'))body=rodDetail(p.slice(4));else if(p==='inventory')body=inventory();else if(p==='purchases'||p.startsWith('purchase-'))body=purchases();else if(p==='research'||p==='podcasts'||p==='todo')body=research();else if(p==='why-i-fish')body=why();else if(p==='resources'||p.startsWith('resource-'))body=resources();else if(p==='destinations'||p==='destinations-top'||p==='destinations-bust')body=destinations();else if(p.startsWith('destination-'))body=destinationDetail(p);else if(p==='knots')body=knots();else if(p.startsWith('knot-'))body=knotDetail(p);else if(p==='casting')body=research();else if(p==='packing')body=packing();else if(p==='account')body=account();else body=home();document.getElementById('main').innerHTML=body}
function search(q){q=q.trim().toLowerCase();let box=document.getElementById('searchResults');if(!q){box.classList.remove('show');return}let arr=[];DATA.flies.forEach(x=>{if(x.toLowerCase().includes(q))arr.push(['Fly',x,'fly-'+slug(x)])});DATA.destinations.forEach(x=>{if(x.toLowerCase().includes(q))arr.push(['Destination',x,'destination-'+slug(x)])});DATA.rods.forEach((x,i)=>{if(x.join(' ').toLowerCase().includes(q))arr.push(['Rod',x[0],'rod-'+i])});DATA.rivers.forEach(x=>{if(x.toLowerCase().includes(q))arr.push(['Water',x,'location-'+slug(x)])});let species=['Brown trout','Rainbow trout','Cutthroat','Bull trout','Dolly Varden','Steelhead','Coho','Chinook','Roosterfish','Bonefish','Tarpon','GT'];species.forEach(x=>{if(x.toLowerCase().includes(q))arr.push(['Species',x,'species-'+slug(x)])});box.innerHTML=arr.slice(0,18).map(x=>`<div class="result" onclick="go('${x[2]}');document.getElementById('searchResults').classList.remove('show')"><span class="tag">${x[0]}</span> ${esc(x[1])}</div>`).join('')||'<div class="result muted">No indexed result.</div>';box.classList.add('show')}
document.getElementById('search').addEventListener('input',e=>search(e.target.value));document.getElementById('searchBtn').onclick=()=>search(document.getElementById('search').value);document.getElementById('accountBtn').onclick=()=>go('account');document.getElementById('menuBtn').onclick=()=>{document.getElementById('side').style.display=document.getElementById('side').style.display==='block'?'':'block'};window.addEventListener('popstate',back);render();
</script></body></html>
